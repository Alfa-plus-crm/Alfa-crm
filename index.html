<script>
/* Встроенный файл: assets/js/clients.js */
/* ==========================================================================
   clients.js — Клиенты: список (поиск, фильтры, сортировка, теги), карточка с вкладками,
   история изменений, файлы (Supabase Storage, бакет client-files), корзина.
   Данные клиента: {id,name,phone,email,company,source,mgr,status,added,tags[],nextContact,changes[]}
   ========================================================================== */
const CLF={q:'',status:'',source:'',mgr:'',tag:'',sort:'added'};
const CSORTS=[['added','Новые сверху'],['name','По имени'],['sum','По сумме покупок'],['last','По последнему контакту']];
const cPaid=c=>sum(fin.filter(f=>f.type==='in'&&isPaid(f)&&(f.cid===c.id||deals.find(d=>d.id===f.deal)?.cid===c.id)),f=>f.sum);
const cWait=c=>sum(fin.filter(f=>f.type==='in'&&!isPaid(f)&&(f.cid===c.id||deals.find(d=>d.id===f.deal)?.cid===c.id)),f=>f.sum);
const cLast=c=>typeof auLastContact==='function'?auLastContact(c):(c.added||'');
const allTags=()=>[...new Set(clients.flatMap(c=>c.tags||[]))].sort();
const tagHtml=c=>(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
const parseTags=s=>[...new Set(String(s||'').split(/[,;]+/).map(x=>x.trim().slice(0,24)).filter(Boolean))].slice(0,12);

V.clients=()=>{
  $('#view').innerHTML=`<div class="ph"><div><h1>Клиенты</h1><p id="ccount"></p></div><div class="acts">${typeof exportButtons==='function'?exportButtons('clients'):''}<button class="btn pri" data-act="newClient">${ico('plus')}Добавить клиента</button></div></div>
  <div class="tools"><input class="grow" id="cq" type="search" placeholder="Поиск по имени, телефону, почте, компании, тегам" value="${esc(CLF.q)}" aria-label="Поиск клиентов">
   <select id="cs" aria-label="Статус"><option value="">Все статусы</option>${CSTAT.map(s=>`<option ${CLF.status===s?'selected':''}>${s}</option>`).join('')}</select>
   <select id="cso" aria-label="Источник"><option value="">Все источники</option>${SOURCES.map(s=>`<option ${CLF.source===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
   <select id="cm" aria-label="Ответственный"><option value="">Все ответственные</option>${mgrOpts().map(m=>`<option value="${m[0]}" ${CLF.mgr==m[0]?'selected':''}>${esc(m[1])}</option>`).join('')}</select>
   <select id="ctg" aria-label="Тег"><option value="">Все теги</option>${allTags().map(t=>`<option ${CLF.tag===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
   <select id="cso2" aria-label="Сортировка">${CSORTS.map(s=>`<option value="${s[0]}" ${CLF.sort===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div>
  <div id="cbody"></div>`;
  const bind=(id,k,ev='onchange')=>{$(id)[ev]=e=>{CLF[k]=e.target.value;drawClients()}};
  bind('#cq','q','oninput');bind('#cs','status');bind('#cso','source');bind('#cm','mgr');bind('#ctg','tag');bind('#cso2','sort');
  drawClients();
};
function cFiltered(){
  const q=norm(CLF.q);
  const l=clients.filter(c=>(!q||norm([c.name,c.phone,c.email,c.company,(c.tags||[]).join(' ')].join(' ')).includes(q))&&(!CLF.status||c.status===CLF.status)&&(!CLF.source||c.source===CLF.source)&&(!CLF.mgr||c.mgr==CLF.mgr)&&(!CLF.tag||(c.tags||[]).includes(CLF.tag)));
  const s=CLF.sort;
  return l.sort((a,b)=>s==='name'?a.name.localeCompare(b.name,'ru'):s==='sum'?cPaid(b)-cPaid(a):s==='last'?cLast(b).localeCompare(cLast(a)):(b.added||'').localeCompare(a.added||'')||b.id-a.id);
}
function drawClients(){
  const l=cFiltered(),box=$('#cbody');if(!box)return;
  $('#ccount').textContent=`Найдено: ${l.length} из ${clients.length}`;
  if(!clients.length){box.innerHTML=`<div class="card">${emptyState('users','Клиентов пока нет','Добавьте первого клиента — к нему можно привязать сделки, задачи, файлы и историю общения.',`<button class="btn pri" data-act="newClient">${ico('plus')}Добавить клиента</button>`)}</div>`;return}
  if(!l.length){box.innerHTML=`<div class="card">${emptyState('filter','Клиенты не найдены','Измените фильтры или строку поиска.',`<button class="btn" data-act="cReset">Сбросить фильтры</button>`)}</div>`;return}
  box.innerHTML=`<div class="tw"><table><thead><tr><th>Клиент</th><th>Контакты</th><th>Источник</th><th>Ответственный</th><th>Покупки</th><th>Статус</th><th></th></tr></thead><tbody>${l.map(c=>{const nd=deals.filter(d=>d.cid===c.id).length;
   return `<tr class="click" data-act="client" data-id="${c.id}"><td><span class="cell"><span class="av s" style="background:${COLORS[c.id%8]}">${ini(c.name)}</span><span><b style="font-weight:550">${esc(c.name)}</b><br><small class="mut">${esc(c.company||'')}</small>${(c.tags||[]).length?`<div class="tags">${tagHtml(c)}</div>`:''}</span></span></td>
   <td>${esc(c.phone||'—')}<br><small class="mut">${esc(c.email||'')}</small></td><td>${esc(c.source||'—')}</td><td>${person(c.mgr)}</td>
   <td>${rub(cPaid(c))}<br><small class="mut">сделок: ${nd}${cWait(c)?' · ждём '+rub(cWait(c)):''}</small></td><td>${cpill(c.status)}</td>
   <td><span class="cell"><button class="ibtn" style="width:32px;height:32px" data-act="editClient" data-id="${c.id}" aria-label="Изменить">${ico('edit')}</button><button class="ibtn" style="width:32px;height:32px" data-act="delClient" data-id="${c.id}" aria-label="Удалить">${ico('trash')}</button></span></td></tr>`}).join('')}</tbody></table></div>`;
}
A.cReset=()=>{Object.assign(CLF,{q:'',status:'',source:'',mgr:'',tag:''});V.clients()};
A.client=(b,e)=>{if(e&&e.target.closest('.ibtn'))return;openClient(+b.dataset.id)};
A.newClient=()=>clientForm();
A.editClient=(b,e)=>{e&&e.stopPropagation();clientForm(+b.dataset.id)};
A.delClient=(b,e)=>{e&&e.stopPropagation();cDelete(+b.dataset.id)};

/* ---------- Удаление через корзину ---------- */
function cDelete(id){
  if(!can('clients.delete'))return toast('Недостаточно прав для удаления клиентов');
  const c=cliOf(id);if(!c)return;
  const nd=deals.filter(d=>d.cid===id),nf=files.filter(f=>f.cid===id);
  confirmBox(`Переместить клиента «${esc(c.name)}» в корзину? Вместе с ним уйдут: сделок — ${nd.length}, история, комментарии, диалоги и звонки${nf.length?`, файлов — ${nf.length}`:''}. Платежи в финансах останутся. Восстановить можно в течение 30 дней.`,()=>{
    const pick=a=>a.filter(x=>x.cid===id);
    const extra={deals:nd,hist:pick(hist),notes:pick(notes),dialogs:pick(dialogs),calls:pick(calls),files:nf,taskLinks:tasks.filter(t=>t.cid===id).map(t=>t.id)};
    [hist,notes,dialogs,calls,files].forEach(a=>{for(let k=a.length-1;k>=0;k--)if(a[k].cid===id)a.splice(k,1)});
    tasks.forEach(t=>{if(t.cid===id)t.cid=null});
    for(let k=deals.length-1;k>=0;k--)if(deals[k].cid===id)deals.splice(k,1);
    trashPut('client',c,extra);persist();closeModal();toast('Клиент перемещён в корзину');drawNav();ntRefresh();V[cur]();
  },'В корзину');
}

/* ---------- Форма клиента + история изменений ---------- */
const C_FIELDS=[['name','Имя'],['phone','Телефон'],['email','Почта'],['company','Компания'],['source','Источник'],['mgr','Ответственный'],['status','Статус'],['tags','Теги']];
function clientForm(id){
  if(!can('clients.edit'))return toast('Недостаточно прав для изменения клиентов');
  const c=id?cliOf(id):{name:'',phone:'',email:'',company:'',source:SOURCES[0]||'Сайт',mgr:actor().id||1,status:'Новый',tags:[]};
  if(!c)return;
  modal({title:id?'Редактирование клиента':'Новый клиент',body:`<form class="form" id="cf" onsubmit="return false">${fld('f_name','Имя и фамилия',c.name,{full:1,ph:'Иван Петров'})}${fld('f_phone','Телефон',c.phone,{ph:'+7 ___ ___-__-__'})}${fld('f_email','Электронная почта',c.email,{type:'email'})}${fld('f_company','Компания',c.company)}${fld('f_source','Источник обращения',c.source,{type:'select',opts:SOURCES})}${fld('f_mgr','Ответственный сотрудник',c.mgr,{type:'select',opts:mgrOpts()})}${fld('f_status','Статус',c.status,{type:'select',opts:CSTAT})}${fld('f_tags','Теги через запятую',(c.tags||[]).join(', '),{ph:'VIP, опт'})}</form><div class="err" id="cferr" role="alert"></div>`,
   foot:[{label:'Отмена',fn:closeModal},{label:id?'Сохранить':'Добавить',cls:'pri',fn:()=>{
     const name=val('f_name'),email=val('f_email'),phone=val('f_phone');
     const err=m=>{$('#cferr').textContent=m};
     if(!name)return err('Укажите имя клиента');
     if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('Проверьте формат электронной почты');
     if(phone&&phone.replace(/\D/g,'').length<5)return err('Телефон слишком короткий');
     const dup=clients.find(x=>x.id!==id&&((email&&x.email&&x.email.toLowerCase()===email.toLowerCase())||(phone&&x.phone&&x.phone.replace(/\D/g,'')===phone.replace(/\D/g,''))));
     const save=()=>{
       const o={name,phone,email,company:val('f_company')||'Частное лицо',source:val('f_source'),mgr:+val('f_mgr'),status:val('f_status'),tags:parseTags(val('f_tags'))};
       if(id){
         const ch=[];C_FIELDS.forEach(([k,n])=>{const a=k==='tags'?(c.tags||[]).join(', '):k==='mgr'?mgrOf(c.mgr).name:c[k],b=k==='tags'?o.tags.join(', '):k==='mgr'?mgrOf(o.mgr).name:o[k];if(String(a||'')!==String(b||''))ch.push({at:Date.now(),a:actor().id||1,f:n,from:String(a||''),to:String(b||'')})});
         Object.assign(c,o);if(ch.length){c.changes=[...ch,...(c.changes||[])].slice(0,100);log(`изменил(а) клиента «${c.name}»`,{ent:'client'})}
       }else{Object.assign(o,{id:++nid,added:iso(0),changes:[]});clients.unshift(o);log(`добавил(а) клиента «${o.name}»`,{ent:'client'});fire('Создан клиент',{cid:o.id,mgr:o.mgr,what:o.name})}
       persist();closeModal();toast(id?'Изменения сохранены':'Клиент добавлен');drawNav();V[cur]();
     };
     if(dup)confirmBox(`Похожий клиент уже есть: «${esc(dup.name)}» (совпадает телефон или почта). Всё равно сохранить?`,save,'Сохранить');else save();
   }}]});
}

/* ---------- Карточка клиента ---------- */
const CT={tab:'info'};
function openClient(id,tab='info'){
  const c=cliOf(id);if(!c)return;
  const tabs=[['info','Обзор'],['deals','Сделки'],['hist','История'],['tasks','Задачи'],['notes','Комментарии'],['files','Файлы'],['chg','Изменения']];
  const cnt={deals:deals.filter(d=>d.cid===id).length,tasks:tasks.filter(t=>t.cid===id&&t.status!=='Выполнена').length,notes:notes.filter(n=>n.cid===id).length,files:files.filter(f=>f.cid===id).length};
  const body={
   info:()=>{const dd=deals.filter(d=>d.cid===id),act=dd.filter(d=>!['won','lost'].includes(d.stage));
     return `<div class="c-kpis"><div><small>Оплачено</small><b>${rub(cPaid(c))}</b></div><div><small>Ожидается</small><b>${rub(cWait(c))}</b></div><div><small>Сделок в работе</small><b>${act.length}</b></div><div><small>Последний контакт</small><b>${fd(cLast(c))}</b></div></div>
     <div class="form">${[['Телефон',c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:'—'],['Почта',c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'—'],['Компания',esc(c.company||'—')],['Источник',esc(c.source||'—')],['Ответственный',esc(mgrOf(c.mgr).name)],['Добавлен',fdf(c.added)],['Следующий контакт',c.nextContact?fd(c.nextContact):'не назначен'],['Теги',tagHtml(c)||'—']].map(x=>`<div class="fld"><label>${x[0]}</label><div>${x[1]}</div></div>`).join('')}</div>`},
   deals:()=>{const d=deals.filter(x=>x.cid===id);return d.length?`<div class="list">${d.map(x=>`<div class="row click" data-act="cOpenDeal" data-id="${x.id}"><div class="grow"><b>${esc(x.title)}</b><small>${fd(x.created)}${x.items?.length?' · товаров: '+x.items.length:''}</small></div><b>${rub(x.sum)}</b>${dPill(x.stage)}</div>`).join('')}</div>`:emptyState('deal','Сделок нет','',`<button class="btn" data-act="cNewDeal" data-id="${id}">${ico('plus')}Новая сделка</button>`)},
   hist:()=>{const h=hist.filter(x=>x.cid===id).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);return h.length?`<div class="tl">${h.map(x=>`<div><b>${esc(x.type)}</b> · <span class="mut">${fd(x.d)}</span><br>${esc(x.t)}</div>`).join('')}</div>`:emptyState('log','Взаимодействий пока нет','Здесь появятся сделки, задачи, звонки и сообщения по клиенту.')},
   tasks:()=>{const t=tasks.filter(x=>x.cid===id);return (t.length?`<div class="list">${t.map(x=>`<div class="row click" data-act="cOpenTask" data-id="${x.id}"><div class="grow"><b class="${x.status==='Выполнена'?'done':''}">${esc(x.title)}</b><small>до ${fd(x.due)} · ${esc(mgrOf(x.mgr).name)}</small></div>${ppill(x.prio)}</div>`).join('')}</div>`:emptyState('tasks','Задач нет'))+`<div style="margin-top:12px"><button class="btn" data-act="cNewTask" data-id="${id}">${ico('plus')}Задача по клиенту</button></div>`},
   notes:()=>`<div class="list">${notes.filter(n=>n.cid===id).map(n=>`<div class="row">${av(n.a)}<div class="grow" style="white-space:normal"><b style="white-space:normal;font-weight:400">${esc(n.t)}</b><small>${esc(mgrOf(n.a).name)} · ${fd(n.d)}</small></div></div>`).join('')||emptyState('msg','Комментариев нет')}</div><div class="tools" style="margin:14px 0 0"><input class="grow" id="nt" placeholder="Написать комментарий…"><button class="btn pri" id="nadd">Добавить</button></div>`,
   files:()=>{const f=files.filter(x=>x.cid===id);return `<div class="list">${f.map(x=>`<div class="row"><span class="nt-ic">${ico('file')}</span><div class="grow"><b>${esc(x.name)}</b><small>${fileSize(x.size)} · ${esc(fdt(x.at))} · ${esc(mgrOf(x.a||1).name)}</small></div><button class="btn sm" data-act="cFileGet" data-id="${x.id}">Скачать</button><button class="ibtn" style="width:32px;height:32px" data-act="cFileDel" data-id="${x.id}" aria-label="Удалить файл">${ico('trash')}</button></div>`).join('')||emptyState('file','Файлов нет','Договоры, счета и другие документы клиента.')}</div>
     <div style="margin-top:12px"><label class="btn" for="cfile">${ico('plus')}Загрузить файл</label><input id="cfile" type="file" hidden><p class="tk-hint">Файлы хранятся в вашем защищённом хранилище Supabase (бакет client-files, до 10 МБ). Если хранилище не настроено, загрузка вернёт ошибку — см. supabase/README.md.</p></div>`},
   chg:()=>{const ch=c.changes||[];return ch.length?`<div class="tl">${ch.map(x=>`<div><span class="mut">${esc(fdt(x.at))} · ${esc(mgrOf(x.a).name)}</span><br><b>${esc(x.f)}</b>: ${x.from?esc(x.from):'—'} → ${x.to?esc(x.to):'—'}</div>`).join('')}</div><p class="tk-hint">Записываются изменения полей карточки с момента включения истории.</p>`:emptyState('edit','Изменений пока нет','Правки полей клиента будут записываться здесь.')}
  };
  const draw=t=>{CT.tab=t;$('.mb').innerHTML=`<div class="tabs">${tabs.map(x=>`<button class="${x[0]===t?'on':''}" data-t="${x[0]}">${x[1]}${cnt[x[0]]?` (${cnt[x[0]]})`:''}</button>`).join('')}</div>`+body[t]();
    $$('.tabs button').forEach(b=>b.onclick=()=>draw(b.dataset.t));
    $('#nadd')&&($('#nadd').onclick=()=>{const v=val('nt');if(!v)return;notes.push({cid:id,a:actor().id||1,t:v,d:iso(0)});persist();cnt.notes++;draw('notes');toast('Комментарий добавлен')});
    $('#cfile')&&($('#cfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;await cUpload(id,f);cnt.files=files.filter(x=>x.cid===id).length;draw('files')});
    window._cDraw=draw};
  modal({title:`<span class="cell"><span class="av" style="background:${COLORS[c.id%8]}">${ini(c.name)}</span><span>${esc(c.name)}<br><small class="mut" style="font:400 12px var(--fb)">${esc(c.company||'')} · ${cpill(c.status)}</small></span></span>`,body:'',wide:1,
   foot:[{label:'Удалить',cls:'dng',fn:()=>cDelete(id)},{label:'Новая сделка',fn:()=>dealForm(null,id)},{label:'Изменить',fn:()=>clientForm(id)},{label:'Закрыть',cls:'pri',fn:closeModal}]});
  draw(tab);
}
A.cOpenDeal=b=>{closeModal();openDeal(+b.dataset.id)};
A.cOpenTask=b=>{closeModal();openTask(+b.dataset.id)};
A.cNewDeal=b=>{closeModal();dealForm(null,+b.dataset.id)};
A.cNewTask=b=>{closeModal();taskForm(null,{cid:+b.dataset.id})};

/* ---------- Файлы клиента (Supabase Storage) ---------- */
const fileSize=n=>!n?'—':n<1024?n+' Б':n<1048576?Math.round(n/1024)+' КБ':(n/1048576).toFixed(1).replace('.',',')+' МБ';
const FILE_MAX=10*1024*1024;
async function cUpload(cid,f){
  if(!can('clients.edit'))return toast('Недостаточно прав');
  if(f.size>FILE_MAX)return toast('Файл больше 10 МБ');
  const id=++nid,safe=f.name.replace(/[^\w.\-а-яА-ЯёЁ ]+/g,'_').slice(-80),path=`${CUR}/${cid}/${id}-${encodeURIComponent(safe).replace(/%/g,'')}`;
  toast('Загрузка…');
  try{
    const r=await sb.storage.from('client-files').upload(path,f,{upsert:false,contentType:f.type||'application/octet-stream'});
    if(r.error)throw r.error;
    files.push({id,cid,name:f.name,size:f.size,type:f.type,path,at:Date.now(),a:actor().id||1});
    addHist(cid,'Файл',`Загружен файл «${f.name}»`);log(`загрузил(а) файл «${f.name}» клиенту «${cliOf(cid)?.name}»`,{ent:'client'});persist();toast('Файл загружен');
  }catch(e){console.warn('upload',e);toast('Не удалось загрузить файл: '+(e.message||'хранилище недоступно')+'. Проверьте, что применена миграция 003 (бакет client-files).')}
}
A.cFileGet=async b=>{const f=files.find(x=>x.id==b.dataset.id);if(!f)return;
  try{const r=await sb.storage.from('client-files').createSignedUrl(f.path,60);if(r.error)throw r.error;const a=document.createElement('a');a.href=r.data.signedUrl;a.download=f.name;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
  catch(e){toast('Не удалось получить файл: '+(e.message||'ошибка хранилища'))}};
A.cFileDel=b=>{const f=files.find(x=>x.id==b.dataset.id);if(!f)return;
  confirmBox(`Удалить файл «${esc(f.name)}» безвозвратно?`,async()=>{try{await sb.storage.from('client-files').remove([f.path])}catch(e){console.warn(e)}files.splice(files.indexOf(f),1);persist();toast('Файл удалён');window._cDraw&&window._cDraw('files')},'Удалить')};

</script>
<script>
/* Встроенный файл: assets/js/deals.js */
/* ==========================================================================
   deals.js — Сделки: канбан из 7 этапов, вероятность, причина отказа,
   комментарии, история, товары со склада, платёж по сделке.
   Правила денег: при «Успешно завершено» создаётся ОЖИДАЕМЫЙ платёж (st «Ожидается»).
   Выручкой он станет только после отметки «Оплачен» в Финансах.
   Удаление — через корзину; ожидаемые платежи сделки уходят в корзину вместе с ней,
   полученные (оплаченные) остаются в финансах как факт.
   ========================================================================== */
const LOSS_REASONS=['Слишком дорого','Выбрали конкурента','Нет бюджета','Клиент не отвечает','Не подошёл продукт','Не устроили сроки','Другое'];
const DK={q:'',mgr:'',view:'board'};
const dStage=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const dPill=id=>{const s=dStage(id);return `<span class="pill" style="color:${s.c};background:color-mix(in srgb,${s.c} 16%,transparent)">${esc(s.name)}</span>`};
const dEvent=(d,t)=>{(d.events=d.events||[]).push({at:Date.now(),t,a:actor().id||1});if(d.events.length>100)d.events.shift()};
const dFin=d=>fin.filter(f=>f.deal===d.id);
const dWeighted=d=>(+d.sum||0)*(d.prob!=null?d.prob:PROB[d.stage]||0)/100;

/* ---------- Смена этапа (единая точка: интерфейс, автоматизация, drag&drop) ---------- */
setStage=function(d,st){
  const was=d.stage,c=cliOf(d.cid);
  if(st===was)return;
  d.stage=st;d.moved=iso(0);d.prob=PROB[st]??d.prob;
  dEvent(d,`Этап: «${dStage(was).name}» → «${dStage(st).name}»`);
  if(st==='won'){
    d.closed=iso(0);
    if(!dFin(d).length)fin.push({id:++nid,deal:d.id,cid:d.cid,date:iso(0),due:d.payDue||addDays(iso(0),3),type:'in',cat:'Оплата по сделке',t:`${c?c.name+' — ':''}${d.title}`,sum:d.sum,st:'Ожидается'});
    if(c)c.status='Постоянный';
    addHist(d.cid,'Сделка',`Сделка «${d.title}» успешно завершена на ${rub(d.sum)}`);
    if(typeof stockApplyDeal==='function'&&d.items?.length){const r=stockApplyDeal(d);if(!r.ok)toast('Товары не списаны: на складе недостаточно. Спишите вручную в разделе «Склад»')}
  }
  if(was==='won'){
    const pend=dFin(d).filter(f=>!isPaid(f));pend.forEach(f=>fin.splice(fin.indexOf(f),1));
    if(dFin(d).some(isPaid))toast('Платёж по сделке уже получен — он остаётся в финансах. Проверьте его вручную');
    if(typeof stockRevertDeal==='function')stockRevertDeal(d);
    delete d.closed;
  }
  if(st==='lost'){d.closed=iso(0);addHist(d.cid,'Сделка',`Сделка «${d.title}» отклонена${d.lossReason?': '+d.lossReason:''}`)}
  if(was==='lost'){delete d.lossReason;delete d.lossNote;if(st!=='won')delete d.closed}
  fire('Смена этапа сделки',{cid:d.cid,mgr:d.mgr,what:`«${d.title}» → ${dStage(st).name}`});
};

/* Интерактивная смена этапа с проверками (причина отказа, нехватка товара) */
function moveDeal(d,st,done){
  if(!can('deals.edit')){toast('Недостаточно прав для изменения сделок');return}
  if(!d||d.stage===st)return;
  const finish=()=>{setStage(d,st);log(`перевёл(а) сделку «${d.title}» на этап «${dStage(st).name}»`,{ent:'deal'});persist();toast(`«${d.title}» → ${dStage(st).name}`);drawNav();ntRefresh();done?done():refreshDeals()};
  if(st==='lost'){
    modal({title:'Причина отказа',body:`<form class="form" onsubmit="return false">${fld('l_r','Причина',d.lossReason||LOSS_REASONS[0],{type:'select',opts:LOSS_REASONS,full:1})}${fld('l_n','Комментарий',d.lossNote||'',{type:'textarea',full:1})}</form>`,
      foot:[{label:'Отмена',fn:()=>{closeModal();refreshDeals()}},{label:'Отметить отказом',cls:'dng',fn:()=>{d.lossReason=val('l_r');d.lossNote=val('l_n');closeModal();finish()}}]});
    return;
  }
  finish();
}
/* проверка склада без списания */
function dStockShort(d){
  if(!d.items?.length||d.stockApplied)return [];
  return d.items.map(i=>{const p=products.find(x=>x.id===+i.pid);return p&&p.qty<i.qty?{name:p.name,need:i.qty,have:Math.max(0,p.qty)}:null}).filter(Boolean);
}
const _moveDeal=moveDeal;
moveDeal=function(d,st,done){
  if(st==='won'){const sh=dStockShort(d);if(sh.length){
    confirmBox(`На складе не хватает: ${sh.map(s=>`${esc(s.name)} (нужно ${s.need}, есть ${s.have})`).join('; ')}. Закрыть сделку без списания товаров? Остатки придётся скорректировать вручную.`,()=>_moveDeal(d,st,done),'Закрыть без списания');return}}
  _moveDeal(d,st,done);
};
function refreshDeals(){if(cur==='deals')dDraw();else if(typeof V[cur]==='function')V[cur]()}

/* ---------- Канбан ---------- */
V.deals=()=>{
  $('#view').innerHTML=`<div class="ph"><div><h1>Сделки</h1><p id="dsum"></p></div><div class="acts"><button class="btn pri" data-act="newDeal">${ico('plus')}Новая сделка</button></div></div>
  <div class="tools"><input id="dq" type="search" placeholder="Поиск по сделкам и клиентам" value="${esc(DK.q)}" aria-label="Поиск">
   <select id="dm" aria-label="Ответственный"><option value="">Все ответственные</option>${staff.map(m=>`<option value="${m.id}" ${DK.mgr==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="kan" id="kan"></div>`;
  $('#dq').oninput=e=>{DK.q=e.target.value;dDraw()};$('#dm').onchange=e=>{DK.mgr=e.target.value;dDraw()};dDraw();
};
const dList=()=>{const q=norm(DK.q);return deals.filter(d=>(!DK.mgr||d.mgr==DK.mgr)&&(!q||norm(d.title+' '+(cliOf(d.cid)?.name||'')+' '+(cliOf(d.cid)?.company||'')).includes(q)))};
function dDraw(){
  const all=dList(),act=all.filter(d=>!['won','lost'].includes(d.stage));
  $('#dsum').textContent=`В работе: ${act.length} на ${rub(sum(act,d=>d.sum))} · прогноз по вероятности ${rub(Math.round(sum(act,dWeighted)))}`;
  if(!deals.length){$('#kan').outerHTML=`<div class="card" id="kan">${emptyState('deal','Сделок пока нет','Создайте первую сделку — она появится в воронке, а при успешном завершении создаст ожидаемый платёж в финансах.',`<button class="btn pri" data-act="newDeal">${ico('plus')}Новая сделка</button>`)}</div>`;return}
  $('#kan').innerHTML=STAGES.map(s=>{const l=all.filter(d=>d.stage===s.id);return `<div class="col" data-stage="${s.id}"><h4><i style="background:${s.c}"></i>${esc(s.name)}<span class="pill gray" style="margin-left:auto">${l.length}</span></h4><div class="sum">${rub(sum(l,d=>d.sum))}</div>
   ${l.map(d=>{const late=d.exp&&d.exp<iso(0)&&!['won','lost'].includes(d.stage);return `<div class="deal" draggable="true" data-id="${d.id}" data-act="deal" tabindex="0"><b>${esc(d.title)}</b><div class="mut">${esc(cliOf(d.cid)?.name||'Клиент удалён')}</div><div class="amt">${rub(d.sum)} <small class="mut">· ${d.prob??PROB[d.stage]}%</small></div>
   ${d.stage==='lost'&&d.lossReason?`<div class="d-loss">${esc(d.lossReason)}</div>`:''}${d.exp&&!['won','lost'].includes(d.stage)?`<div class="d-exp ${late?'late':''}">Закрытие: ${fd(d.exp)}</div>`:''}
   <div class="ft">${av(d.mgr,1)}<span>${esc(mgrOf(d.mgr).name.split(' ')[0])}</span><button class="ibtn d-mv" data-act="dMove" data-id="${d.id}" aria-label="Сменить этап" title="Сменить этап">${ico('more')}</button></div></div>`}).join('')||'<div class="tk-e">Пусто</div>'}</div>`}).join('');
  let dragId=null;
  $$('.deal').forEach(el=>{el.ondragstart=e=>{dragId=+el.dataset.id;el.classList.add('drag');e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'};el.ondragend=()=>{el.classList.remove('drag');$$('.col').forEach(c=>c.classList.remove('over'))};
    el.onkeydown=e=>{if(e.key==='Enter'&&e.target===el)openDeal(+el.dataset.id)}});
  $$('.col').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{e.preventDefault();col.classList.remove('over');const id=+(e.dataTransfer.getData('text/plain')||dragId),d=deals.find(x=>x.id===id);if(d&&d.stage!==col.dataset.stage)moveDeal(d,col.dataset.stage)}});
}
A.deal=(b,e)=>{if(e&&e.target.closest('.d-mv'))return;openDeal(+b.dataset.id)};
A.dMove=(b,e)=>{e&&e.stopPropagation();const d=deals.find(x=>x.id==b.dataset.id);if(!d)return;
  modal({title:'Перевести на этап',body:`<div class="list">${STAGES.map(s=>`<button class="row d-st ${s.id===d.stage?'on':''}" data-act="dMoveTo" data-id="${d.id}" data-st="${s.id}"><i style="background:${s.c}"></i><span class="grow">${esc(s.name)}</span>${s.id===d.stage?ico('check'):''}</button>`).join('')}</div>`,foot:[{label:'Отмена',fn:closeModal}]})};
A.dMoveTo=b=>{const d=deals.find(x=>x.id==b.dataset.id);closeModal();if(d)moveDeal(d,b.dataset.st)};
A.newDeal=()=>dealForm();
function openDeal(id){dealForm(id)}

/* ---------- Карточка / форма сделки ---------- */
function dealForm(id,cid){
  if(!clients.length){toast('Сначала добавьте клиента');clientForm();return}
  if(!can('deals.edit'))return toast('Недостаточно прав для работы со сделками');
  const d=id?deals.find(x=>x.id===id):{title:'',cid:cid||clients[0]?.id,sum:'',mgr:actor().id||1,stage:'new',prob:PROB.new,exp:'',items:[],comments:[],events:[]};
  if(!d)return;
  const fins=id?dFin(d):[];
  const cm=()=>(d.comments||[]).map(c=>`<div class="row">${av(c.a,1)}<div class="grow" style="white-space:normal"><b style="white-space:normal;font-weight:400">${esc(c.t)}</b><small>${esc(mgrOf(c.a).name)} · ${esc(c.at?fdt(c.at):'')}</small></div></div>`).join('')||'<div class="mut">Комментариев пока нет</div>';
  const pay=fins.length?`<h4 style="margin:18px 0 8px">Платежи по сделке</h4><div class="list">${fins.map(f=>`<div class="row"><div class="grow"><b>${rub(f.sum)}</b><small>${isPaid(f)?'Получен '+fd(paidDate(f)):'Ожидается'+(f.due?' до '+fd(f.due):'')}</small></div><span class="pill ${isPaid(f)?'ok':'warn'}">${isPaid(f)?'Оплачен':'Ожидается'}</span>${isPaid(f)||!can('finance.edit')?'':`<button class="btn sm" data-act="dPay" data-id="${f.id}">Отметить оплаченным</button>`}</div>`).join('')}</div><p class="tk-hint">Сумма станет выручкой только после отметки «Оплачен».</p>`:'';
  const ev=id&&d.events?.length?`<h4 style="margin:18px 0 8px">История сделки</h4><div class="tl">${[...d.events].reverse().slice(0,15).map(e=>`<div><span class="mut">${esc(fdt(e.at))} · ${esc(mgrOf(e.a).name)}</span><br>${esc(e.t)}</div>`).join('')}</div>`:'';
  modal({title:id?'Сделка':'Новая сделка',wide:true,body:`<form class="form" onsubmit="return false">${fld('d_title','Название сделки',d.title,{full:1,ph:'Например: Поставка оборудования'})}
   ${fld('d_cid','Клиент',d.cid,{type:'select',opts:clients.map(c=>[c.id,c.name+(c.company?' — '+c.company:'')])})}${fld('d_sum','Сумма, ₽',d.sum,{type:'number'})}
   ${fld('d_mgr','Ответственный',d.mgr,{type:'select',opts:mgrOpts()})}${fld('d_stage','Этап',d.stage,{type:'select',opts:STAGES.map(s=>[s.id,s.name])})}
   ${fld('d_prob','Вероятность, %',d.prob??PROB[d.stage],{type:'number'})}${fld('d_exp','Ожидаемая дата закрытия',d.exp||'',{type:'date'})}
   ${typeof whDealItemsHtml==='function'?whDealItemsHtml(d.items||[]):''}
   ${d.stage==='lost'?`<div class="d-lossbox fld full"><label>Причина отказа</label><div><b>${esc(d.lossReason||'не указана')}</b>${d.lossNote?'<br>'+esc(d.lossNote):''}</div></div>`:''}</form>
   ${pay}${id?`<h4 style="margin:18px 0 8px">Комментарии</h4><div id="dcm" class="list">${cm()}</div><div class="tools" style="margin:12px 0 0"><input class="grow" id="d_c" placeholder="Написать комментарий…"><button class="btn" id="d_cadd" type="button">Отправить</button></div>`:''}${ev}`,
   foot:[...(id?[{label:'Удалить',cls:'dng',fn:()=>dDelete(d)}]:[]),{label:'Отмена',fn:closeModal},{label:id?'Сохранить':'Создать',cls:'pri',fn:()=>{
     if(!val('d_title')){toast('Укажите название сделки');return}
     const sum_=+val('d_sum');if(!(sum_>=0)){toast('Сумма не может быть отрицательной');return}
     const pr=Math.max(0,Math.min(100,+val('d_prob')||0)),st=val('d_stage');
     const o={title:val('d_title'),cid:+val('d_cid'),sum:sum_||0,mgr:+val('d_mgr'),exp:val('d_exp'),items:typeof whReadDealItems==='function'?whReadDealItems():(d.items||[])};
     if(id){
       const changed=d.items?.length&&d.stockApplied&&JSON.stringify(o.items)!==JSON.stringify(d.items);
       if(changed){toast('Состав товаров нельзя менять после списания со склада. Верните сделку с этапа «Успешно завершено», измените и закройте снова');return}
       Object.assign(d,o);d.prob=pr;dEvent(d,'Сделка изменена');log(`изменил(а) сделку «${d.title}»`,{ent:'deal'});
       const was=d.stage;persist();closeModal();
       if(st!==was)moveDeal(d,st);else{d.prob=pr;toast('Сделка сохранена');drawNav();refreshDeals()}
     }else{
       Object.assign(o,{id:++nid,created:iso(0),moved:iso(0),stage:'new',prob:pr,comments:[],events:[]});deals.unshift(o);dEvent(o,'Сделка создана');
       log(`создал(а) сделку «${o.title}»`,{ent:'deal'});addHist(o.cid,'Сделка',`Создана сделка «${o.title}» на ${rub(o.sum)}`);
       const cl=cliOf(o.cid);if(cl&&cl.status==='Новый')cl.status='В работе';fire('Создана сделка',{cid:o.cid,mgr:o.mgr,what:o.title});
       persist();closeModal();toast('Сделка создана');
       if(st!=='new')moveDeal(o,st);else{drawNav();refreshDeals()}
     }}}]});
  if(id)$('#d_cadd').onclick=()=>{const v=val('d_c');if(!v)return;(d.comments=d.comments||[]).push({a:actor().id||1,t:v,at:Date.now()});persist();$('#dcm').innerHTML=cm();$('#d_c').value=''};
}
A.dPay=b=>{closeModal();A.fnPay({dataset:{id:b.dataset.id}});refreshDeals()};

function dDelete(d){
  const paid=dFin(d).filter(isPaid),pend=dFin(d).filter(f=>!isPaid(f));
  confirmBox(`Переместить сделку «${esc(d.title)}» в корзину?${pend.length?` Ожидаемые платежи (${pend.length}) уйдут вместе с ней.`:''}${paid.length?` Полученные платежи (${paid.length}) останутся в финансах.`:''}${d.stockApplied?' Списанные товары вернутся на склад.':''}`,()=>{
    if(d.stockApplied&&typeof stockRevertDeal==='function')stockRevertDeal(d);
    const extra={fin:pend};pend.forEach(f=>fin.splice(fin.indexOf(f),1));
    trashPut('deal',d,extra);persist();closeModal();toast('Сделка перемещена в корзину');drawNav();refreshDeals();
  },'В корзину');
}

</script>
<script>
/* Встроенный файл: assets/js/tasks.js */
/* ==========================================================================
   tasks.js — Задачи и Календарь
   Задача: {id,title,desc,mgr,due,time,prio,status,cid,did,rep,remind,comments[]}
     rep    — повтор: '' | day | week | month (при выполнении создаётся следующая задача)
     remind — за сколько дней напомнить: '' | 0 | 1 | 3 (уведомление внутри CRM, см. notifications.js)
   Удаление — через корзину (trashPut), восстановление в разделе «Корзина».
   ========================================================================== */
const TK={view:'list',q:'',st:'',mgr:'',prio:'',hideDone:false};
const REPS=[['','Не повторять'],['day','Каждый день'],['week','Каждую неделю'],['month','Каждый месяц']];
const REMS=[['','Без напоминания'],['0','В день срока'],['1','За 1 день'],['3','За 3 дня']];
const tkDone=t=>t.status==='Выполнена';
const tkLate=t=>!tkDone(t)&&t.due&&t.due<iso(0);
const tkDate=d=>d===iso(0)?'Сегодня':d===iso(1)?'Завтра':d===iso(-1)?'Вчера':fd(d);
function tkNext(due,rep){
  if(rep==='day')return addDays(due,1);if(rep==='week')return addDays(due,7);
  const d=new Date(due+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return isoOf(d);
}
/* Единая смена статуса: журнал + повтор */
function tkSetStatus(t,st){
  if(t.status===st)return;
  const was=t.status;t.status=st;
  if(st==='Выполнена'){
    t.doneAt=Date.now();log(`выполнил(а) задачу «${t.title}»`,{ent:'task'});
    if(t.rep){
      let nd=tkNext(t.due,t.rep);while(nd<iso(0))nd=tkNext(nd,t.rep);
      tasks.push({...t,id:++nid,due:nd,status:'К выполнению',doneAt:null,comments:[]});
      toast(`Задача выполнена. Следующая создана на ${fd(nd)}`);
    }
  }else if(was==='Выполнена'){delete t.doneAt}
  persist();
}
const tkFilter=()=>{const q=norm(TK.q);return tasks.filter(t=>(!TK.st||t.status===TK.st)&&(!TK.mgr||t.mgr==TK.mgr)&&(!TK.prio||t.prio===TK.prio)&&(!TK.hideDone||!tkDone(t))&&(!q||norm(t.title+' '+(t.desc||'')+' '+(cliOf(t.cid)?.name||'')).includes(q)))};
const tkLinks=t=>{const c=cliOf(t.cid),d=t.did&&deals.find(x=>x.id===t.did);return [c&&`<a href="#" data-act="openClient" data-id="${c.id}">${esc(c.name)}</a>`,d&&`<a href="#" data-act="openDeal" data-id="${d.id}">${esc(d.title)}</a>`].filter(Boolean).join(' · ')};
const tkRow=t=>`<div class="tk-row click ${tkDone(t)?'dn':''}" data-act="task" data-id="${t.id}"><button class="chk ${tkDone(t)?'on':''}" data-act="tcheck" data-id="${t.id}" aria-label="Отметить выполненной">${tkDone(t)?'✓':''}</button>
  <div class="tk-m"><b class="${tkDone(t)?'done':''}">${esc(t.title)}</b><small>${esc(mgrOf(t.mgr).name)}${t.rep?' · '+ico('refresh')+' повтор':''}${t.comments?.length?` · ${t.comments.length} ком.`:''}${cliOf(t.cid)?' · '+esc(cliOf(t.cid).name):''}</small></div>
  <span class="tk-due ${tkLate(t)?'late':''}">${t.due?tkDate(t.due)+(t.time?' '+esc(t.time):''):'без срока'}</span>${ppill(t.prio)}<span class="pill ${tkDone(t)?'ok':t.status==='В работе'?'info':t.status==='На проверке'?'warn':'gray'}">${esc(t.status)}</span></div>`;

V.tasks=()=>{
  $('#view').innerHTML=`<div class="ph"><div><h1>Задачи</h1><p id="tcount"></p></div><div class="acts"><button class="btn" data-go="calendar">${ico('cal')}Календарь</button><button class="btn pri" data-act="newTask">${ico('plus')}Создать задачу</button></div></div>
  <div class="tools"><div class="seg"><button data-act="tkView" data-m="list" class="${TK.view==='list'?'on':''}">Список</button><button data-act="tkView" data-m="board" class="${TK.view==='board'?'on':''}">Доска</button></div>
   <input id="tq" type="search" placeholder="Поиск задач" value="${esc(TK.q)}" aria-label="Поиск">
   <select id="ts" aria-label="Статус"><option value="">Все статусы</option>${TSTAT.map(s=>`<option ${TK.st===s?'selected':''}>${s}</option>`).join('')}</select>
   <select id="tm" aria-label="Исполнитель"><option value="">Все исполнители</option>${staff.map(m=>`<option value="${m.id}" ${TK.mgr==m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
   <select id="tp" aria-label="Приоритет"><option value="">Любой приоритет</option>${PRIO.map(s=>`<option ${TK.prio===s?'selected':''}>${s}</option>`).join('')}</select>
   <label class="chk-l"><input type="checkbox" id="tdn" ${TK.hideDone?'checked':''}> Скрыть выполненные</label></div><div id="tbody"></div>`;
  $('#tq').oninput=e=>{TK.q=e.target.value;tkDraw()};$('#ts').onchange=e=>{TK.st=e.target.value;tkDraw()};
  $('#tm').onchange=e=>{TK.mgr=e.target.value;tkDraw()};$('#tp').onchange=e=>{TK.prio=e.target.value;tkDraw()};
  $('#tdn').onchange=e=>{TK.hideDone=e.target.checked;tkDraw()};tkDraw();
};
function tkDraw(){
  const l=tkFilter(),box=$('#tbody');if(!box)return;
  $('#tcount').textContent=`Показано ${l.length} · не выполнено ${l.filter(t=>!tkDone(t)).length} · просрочено ${l.filter(tkLate).length}`;
  if(!tasks.length){box.innerHTML=`<div class="card">${emptyState('tasks','Задач пока нет','Создайте первую задачу — её можно привязать к клиенту или сделке, назначить срок, повтор и напоминание.',`<button class="btn pri" data-act="newTask">${ico('plus')}Создать задачу</button>`)}</div>`;return}
  if(!l.length){box.innerHTML=`<div class="card">${emptyState('filter','Ничего не найдено','Измените фильтры или строку поиска.')}</div>`;return}
  if(TK.view==='board'){
    box.innerHTML=`<div class="tk-board">${TSTAT.map(s=>{const c=l.filter(t=>t.status===s).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
      return `<div class="tk-col" data-st="${s}"><div class="tk-ch"><b>${s}</b><span class="pill gray">${c.length}</span></div><div class="tk-cb">${c.map(t=>`<div class="tk-card ${tkLate(t)?'late':''}" draggable="true" data-act="task" data-id="${t.id}"><b>${esc(t.title)}</b><div class="tk-cm">${ppill(t.prio)}<span class="${tkLate(t)?'down':'mut'}">${t.due?tkDate(t.due):'—'}</span></div><div class="tk-cf">${av(t.mgr,1)}<small>${esc(mgrOf(t.mgr).name)}</small></div></div>`).join('')||'<div class="tk-e">Пусто</div>'}</div></div>`}).join('')}</div>`;
    $$('.tk-card',box).forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('drag')}));
    $$('.tk-col',box).forEach(col=>{
      col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});col.addEventListener('dragleave',()=>col.classList.remove('over'));
      col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const t=tasks.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(!t||!can('tasks.edit'))return;tkSetStatus(t,col.dataset.st);drawNav();tkDraw()});
    });
    return;
  }
  const t0=iso(0),t1=iso(1),w=iso(7),G=[['Просрочено',t=>tkLate(t)],['Сегодня',t=>!tkDone(t)&&t.due===t0],['Завтра',t=>!tkDone(t)&&t.due===t1],['На этой неделе',t=>!tkDone(t)&&t.due>t1&&t.due<=w],['Позже',t=>!tkDone(t)&&t.due>w],['Без срока',t=>!tkDone(t)&&!t.due],['Выполнено',tkDone]];
  box.innerHTML=G.map(([n,f])=>{const g=l.filter(f).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));return g.length?`<div class="tk-grp"><h3 class="${n==='Просрочено'?'down':''}">${n} <span>${g.length}</span></h3><div class="card tk-list">${g.map(tkRow).join('')}</div></div>`:''}).join('');
}
A.tkView=b=>{TK.view=b.dataset.m;V.tasks()};
A.tcheck=(b,e)=>{e&&e.stopPropagation();const t=tasks.find(x=>x.id==b.dataset.id);if(!t||!can('tasks.edit'))return toast('Недостаточно прав');
  tkSetStatus(t,tkDone(t)?'К выполнению':'Выполнена');drawNav();ntRefresh();V[cur]()};
A.task=(b,e)=>{if(e&&e.target.closest('.chk,a'))return;openTask(+b.dataset.id)};
A.newTask=()=>taskForm();
function openTask(id){taskForm(id)}

/* ---------- Форма задачи ---------- */
function taskForm(id,pre={}){
  if(!can('tasks.edit'))return toast('Недостаточно прав для работы с задачами');
  const t=id?tasks.find(x=>x.id===id):{title:'',desc:'',mgr:actor().id||1,due:iso(1),time:'',prio:'Средний',status:'К выполнению',cid:'',did:'',rep:'',remind:'',comments:[],...pre};
  if(!t)return;
  t.comments=t.comments||[];
  const cm=()=>t.comments.map(c=>`<div class="row">${av(c.a,1)}<div class="grow" style="white-space:normal"><b style="white-space:normal;font-weight:400">${esc(c.t)}</b><small>${esc(mgrOf(c.a).name)} · ${fd(c.d)}</small></div></div>`).join('')||'<div class="mut">Комментариев пока нет</div>';
  modal({title:id?'Задача':'Новая задача',wide:true,body:`<form class="form" onsubmit="return false">${fld('t_title','Название',t.title,{full:1})}${fld('t_desc','Описание',t.desc||'',{type:'textarea',full:1})}
   ${fld('t_mgr','Исполнитель',t.mgr,{type:'select',opts:staff.map(s=>[s.id,s.name])})}${fld('t_prio','Приоритет',t.prio,{type:'select',opts:PRIO})}
   ${fld('t_due','Срок',t.due||'',{type:'date'})}${fld('t_time','Время (необязательно)',t.time||'',{type:'time'})}
   ${fld('t_st','Статус',t.status,{type:'select',opts:TSTAT})}${fld('t_rep','Повтор',t.rep||'',{type:'select',opts:REPS})}
   ${fld('t_rem','Напоминание',t.remind===''||t.remind==null?'':String(t.remind),{type:'select',opts:REMS})}
   ${fld('t_cid','Клиент',t.cid||'',{type:'select',opts:[['','— не выбран —'],...clients.map(c=>[c.id,c.name+(c.company?' — '+c.company:'')])]})}
   ${fld('t_did','Сделка',t.did||'',{type:'select',full:1,opts:[['','— не выбрана —'],...deals.map(d=>[d.id,d.title])]})}</form>
   <p class="tk-hint">Напоминание появится в уведомлениях CRM, пока она открыта. Email и push не отправляются.</p>
   ${id?`<h4 style="margin:18px 0 8px">Комментарии</h4><div id="tcm" class="list">${cm()}</div><div class="tools" style="margin:12px 0 0"><input class="grow" id="t_c" placeholder="Написать комментарий…"><button class="btn" id="t_cadd" type="button">Отправить</button></div>`:''}`,
   foot:[...(id?[{label:'Удалить',cls:'dng',fn:()=>confirmBox(`Переместить задачу «${esc(t.title)}» в корзину? Её можно будет восстановить в течение 30 дней.`,()=>{trashPut('task',t);persist();closeModal();toast('Задача перемещена в корзину');drawNav();V[cur]()},'В корзину')}]:[]),{label:'Отмена',fn:closeModal},{label:id?'Сохранить':'Создать',cls:'pri',fn:()=>{
     if(!val('t_title')){toast('Укажите название задачи');return}
     const rep=val('t_rep'),due=val('t_due');
     if(rep&&!due){toast('Для повторяющейся задачи нужен срок');return}
     const o={title:val('t_title'),desc:val('t_desc'),mgr:+val('t_mgr'),due,time:val('t_time'),prio:val('t_prio'),rep,remind:val('t_rem'),cid:val('t_cid')?+val('t_cid'):null,did:val('t_did')?+val('t_did'):null};
     if(id){const st=val('t_st');Object.assign(t,o);tkSetStatus(t,st);log(`изменил(а) задачу «${t.title}»`,{ent:'task'})}
     else{Object.assign(o,{id:++nid,comments:[],status:val('t_st')});tasks.push(o);log(`создал(а) задачу «${o.title}»`,{ent:'task'});if(o.cid)addHist(o.cid,'Задача',`Создана задача «${o.title}»`)}
     persist();closeModal();toast(id?'Задача сохранена':'Задача создана');drawNav();ntRefresh();V[cur]()}}]});
  if(id)$('#t_cadd').onclick=()=>{const v=val('t_c');if(!v)return;t.comments.push({a:actor().id||1,t:v,d:iso(0)});persist();$('#tcm').innerHTML=cm();$('#t_c').value=''};
}

/* ==========================================================================
   Календарь: день / неделя / месяц
   События: задачи, ожидаемые платежи, повторные контакты, ожидаемое закрытие сделок
   ========================================================================== */
const CL={mode:'month',date:iso(0)};
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function clEvents(from,to){
  const out=[],add=(date,kind,title,id,extra={})=>{if(date&&date.slice(0,10)>=from&&date.slice(0,10)<=to)out.push({date:date.slice(0,10),kind,title,id,...extra})};
  tasks.forEach(t=>add(t.due,'task',t.title,t.id,{time:t.time,hi:t.prio==='Высокий',done:tkDone(t),late:tkLate(t)}));
  fin.filter(f=>f.type==='in'&&!isPaid(f)).forEach(f=>add(f.due,'pay',`${rub(f.sum)} · ${f.t}`,f.id));
  clients.forEach(c=>add(c.nextContact,'contact',`Связаться: ${c.name}`,c.id));
  deals.filter(d=>d.stage!=='won'&&d.stage!=='lost').forEach(d=>add(d.exp||d.close,'deal',`Закрытие: ${d.title}`,d.id));
  return out.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
const clChip=e=>{
  const act=e.kind==='task'?'task':e.kind==='contact'?'openClient':e.kind==='deal'?'openDeal':'calGoFin';
  return `<button class="ev k-${e.kind} ${e.hi?'hi':''} ${e.done?'dn':''} ${e.late?'late':''}" ${e.kind==='task'?'draggable="true"':''} data-act="${act}" data-id="${e.id}" title="${esc(e.title)}">${e.time?`<i>${esc(e.time)}</i> `:''}${esc(e.title)}</button>`;
};
A.calGoFin=()=>go('finance');
function clRange(){
  const d=new Date(CL.date+'T12:00:00');
  if(CL.mode==='day')return {from:CL.date,to:CL.date,title:d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
  if(CL.mode==='week'){const s=addDays(CL.date,-((d.getDay()+6)%7));return {from:s,to:addDays(s,6),title:`${fd(s)} — ${fd(addDays(s,6))}`}}
  const f=CL.date.slice(0,8)+'01',last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),lead=(new Date(f+'T12:00:00').getDay()+6)%7;
  return {from:addDays(f,-lead),to:addDays(f,Math.ceil((lead+last)/7)*7-lead-1),title:`${MON[d.getMonth()][0].toUpperCase()+MON[d.getMonth()].slice(1)} ${d.getFullYear()}`,month:d.getMonth()};
}
V.calendar=()=>{
  const r=clRange(),ev=clEvents(r.from,r.to),t0=iso(0);
  const dayCell=(ds,out)=>`<div class="d ${out?'o':''} ${ds===t0?'t':''}" data-date="${ds}"><span>${+ds.slice(8)}</span>${ev.filter(e=>e.date===ds).map(clChip).join('')}<button class="cal-add" data-act="calAdd" data-date="${ds}" aria-label="Добавить задачу на ${fd(ds)}">+</button></div>`;
  let body='';
  if(CL.mode==='month'){
    body=`<div class="cal">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="h">${x}</div>`).join('')}`;
    for(let ds=r.from;ds<=r.to;ds=addDays(ds,1))body+=dayCell(ds,new Date(ds+'T12:00:00').getMonth()!==r.month);
    body+='</div>';
  }else if(CL.mode==='week'){
    body=`<div class="cal-week">`;for(let ds=r.from;ds<=r.to;ds=addDays(ds,1)){const d=new Date(ds+'T12:00:00');body+=`<div class="cw ${ds===t0?'t':''}" data-date="${ds}"><div class="cw-h"><small>${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}</small><b>${d.getDate()}</b></div>${ev.filter(e=>e.date===ds).map(clChip).join('')||'<span class="tk-e">—</span>'}<button class="cal-add" data-act="calAdd" data-date="${ds}" aria-label="Добавить задачу">+</button></div>`}body+='</div>';
  }else{
    const l=ev.filter(e=>e.date===CL.date);
    body=`<div class="card cal-dayl" data-date="${CL.date}">${l.length?l.map(e=>`<div class="cd-r"><span class="cd-t">${e.time||'весь день'}</span>${clChip(e)}<small class="mut">${{task:'Задача',pay:'Ожидаемый платёж',contact:'Повторный контакт',deal:'Сделка'}[e.kind]}</small></div>`).join(''):emptyState('cal','На этот день ничего не запланировано','Добавьте задачу или назначьте повторный контакт в карточке клиента.')}<div style="padding:10px 0 0"><button class="btn sm" data-act="calAdd" data-date="${CL.date}">${ico('plus')}Задача на этот день</button></div></div>`;
  }
  $('#view').innerHTML=`<div class="ph"><div><h1>Календарь</h1><p>${r.title}</p></div><div class="acts"><button class="btn" data-go="tasks">${ico('tasks')}Задачи</button><button class="btn pri" data-act="calAdd" data-date="${CL.date}">${ico('plus')}Задача</button></div></div>
  <div class="tools"><div class="seg">${[['day','День'],['week','Неделя'],['month','Месяц']].map(([m,n])=>`<button data-act="calMode" data-m="${m}" class="${CL.mode===m?'on':''}">${n}</button>`).join('')}</div>
   <button class="btn sm" data-act="calNav" data-d="-1" aria-label="Назад">‹</button><button class="btn sm" data-act="calNav" data-d="0">Сегодня</button><button class="btn sm" data-act="calNav" data-d="1" aria-label="Вперёд">›</button>
   <span class="cal-leg"><i class="k-task"></i>Задачи<i class="k-pay"></i>Платежи<i class="k-contact"></i>Контакты<i class="k-deal"></i>Сделки</span></div>${body}
  <p class="nt-note">Задачи можно переносить перетаскиванием на другой день. Платежи, контакты и сделки показаны по их срокам и меняются в своих разделах.</p>`;
  $$('[draggable=true]').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}));
  $$('[data-date]').forEach(cell=>{
    cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('over')});cell.addEventListener('dragleave',()=>cell.classList.remove('over'));
    cell.addEventListener('drop',e=>{e.preventDefault();cell.classList.remove('over');const t=tasks.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(!t||!can('tasks.edit'))return;
      t.due=cell.dataset.date;log(`перенёс(ла) задачу «${t.title}» на ${fd(t.due)}`,{ent:'task'});persist();ntRefresh();V.calendar()});
  });
};
A.calMode=b=>{CL.mode=b.dataset.m;V.calendar()};
A.calNav=b=>{const d=+b.dataset.d;
  if(!d)CL.date=iso(0);
  else if(CL.mode==='month'){const x=new Date(CL.date+'T12:00:00');x.setDate(1);x.setMonth(x.getMonth()+d);CL.date=isoOf(x)}
  else CL.date=addDays(CL.date,d*(CL.mode==='week'?7:1));
  V.calendar()};
A.calAdd=(b,e)=>{e&&e.stopPropagation();taskForm(null,{due:b.dataset.date||iso(1)})};
A.openClient=(b,e)=>{e&&e.preventDefault();e&&e.stopPropagation();closeModal();openClient(+b.dataset.id)};
A.openDeal=(b,e)=>{e&&e.preventDefault();e&&e.stopPropagation();closeModal();openDeal(+b.dataset.id)};

</script>
<script>
/* Встроенный файл: assets/js/warehouse.js */
/* ==========================================================================
   warehouse.js — «Склад и товары» (раздел 'products')
   Каталог, карточка, приход/списание/корректировка, движения, поставщики,
   низкие остатки и интеграция со сделками (stockApplyDeal / stockRevertDeal /
   whDealItemsHtml / whReadDealItems). Контракт данных — docs/CONTRACT.md.
   Знак qty в moves: in/out/writeoff — положительное количество операции,
   adjust — знаковая разница (факт − учёт).
   ========================================================================== */
const WH={tab:'catalog',q:'',cat:'',sup:'',low:false,sort:'name',from:'',to:'',pid:'',mt:'',back:null};
const WH_UNITS=['шт','м','кг','л','упак','компл'];
const WH_REASONS=['Брак','Порча','Утеря','Истёк срок','Использовано в работе','Другое'];
const WH_MT={in:['Приход','ok'],out:['Продажа','info'],writeoff:['Списание','bad'],adjust:['Корректировка','warn']};

/* ---------- помощники ---------- */
const whCan=()=>can('stock.edit');
const whNum=s=>{const n=parseFloat(String(s??'').replace(',','.').replace(/\s/g,''));return Number.isFinite(n)?n:NaN};
const whR3=n=>Math.round(n*1000)/1000;
const whFq=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:3}).format(+n||0);
const whMin=p=>+p.min||0;
const whCost=p=>+p.cost||0;
const whUnit=p=>p.unit||'шт';
const whById=id=>products.find(p=>p.id==id);
const whSup=id=>suppliers.find(s=>s.id==id);
const whSupName=p=>whSup(p.sup)?.name||'—';
const whMarkup=p=>whCost(p)>0&&+p.price>0?Math.round((p.price-whCost(p))/whCost(p)*100):null;
const whSkuTaken=(sku,self)=>products.some(x=>x!==self&&String(x.sku||'').trim().toLowerCase()===sku.toLowerCase());
const whStatus=p=>p.qty<=0?['bad','Нет в наличии']:p.qty<=whMin(p)?['warn','Мало']:['ok','В наличии'];
function whNormalize(){products.forEach(p=>{if(p.min==null)p.min=0;if(p.cost==null)p.cost=0;if(!p.unit)p.unit='шт';p.qty=+p.qty||0})}

/* ---------- ядро движений ---------- */
function stockLow(){return products.filter(p=>(+p.qty||0)<=whMin(p))}
/* Уведомление ровно один раз при пересечении порога вниз; флаг сбрасывается при росте выше порога */
function whAfter(p,wasLow){
  const low=p.qty<=whMin(p);
  if(!low){p.lowNotified=false;return}
  if(!wasLow&&!p.lowNotified){
    p.lowNotified=true;
    notify({type:'stock',text:p.qty<=0?`Закончился товар «${p.name}»`:`Заканчивается «${p.name}»: осталось ${whFq(p.qty)} ${whUnit(p)} (порог ${whFq(whMin(p))})`,go:'products',ent:'product'});
  }
}
function whMove(p,type,qty,o={}){
  const wasLow=(+p.qty||0)<=whMin(p);
  const delta=(type==='in'||type==='adjust')?qty:-qty;
  const before=+p.qty||0;
  if(type==='in'&&o.cost!=null&&qty>0){
    const c=+o.cost||0;
    p.cost=before>0?Math.round((before*whCost(p)+qty*c)/(before+qty)*100)/100:c;
  }
  p.qty=whR3(before+delta);
  const m={id:++nid,pid:p.id,type,qty,at:Date.now(),by:actor().name,note:o.note||''};
  if(o.deal!=null)m.deal=o.deal;
  if(type==='in'&&o.cost!=null)m.cost=+o.cost||0;
  else if(type==='out'||type==='writeoff')m.cost=whCost(p);
  if(o.sup)m.sup=o.sup;
  moves.push(m);
  whAfter(p,wasLow);
  persist();
  return m;
}

/* ---------- интеграция со сделками ---------- */
function whAgg(items){
  const g=new Map();
  (items||[]).forEach(it=>{const q=whNum(it&&it.qty),pid=it&&it.pid;if(!pid||!(q>0))return;g.set(+pid,whR3((g.get(+pid)||0)+q))});
  return [...g].map(([pid,qty])=>({pid,qty}));
}
function stockApplyDeal(deal,force){
  if(!deal)return {ok:false,short:[]};
  if(deal.stockApplied)return {ok:true,short:[],already:true};
  const items=whAgg(deal.items).filter(i=>whById(i.pid));
  if(!items.length)return {ok:true,short:[]};
  const short=items.filter(i=>whById(i.pid).qty<i.need_||whById(i.pid).qty<i.qty).map(i=>({pid:i.pid,need:i.qty,have:Math.max(0,whById(i.pid).qty)}));
  if(short.length&&!force)return {ok:false,short};
  const out=[];
  items.forEach(i=>{
    const p=whById(i.pid),take=whR3(Math.min(i.qty,Math.max(0,p.qty)));
    if(take<=0)return;
    whMove(p,'out',take,{deal:deal.id,note:'Продажа: '+(deal.title||('сделка #'+deal.id))});
    out.push({pid:p.id,qty:take});
  });
  deal.stockApplied=true;deal.stockOut=out;
  log(`списал(а) со склада товары сделки «${deal.title||deal.id}» (${out.length} поз.)`,{ent:'deal',id:deal.id});
  persist();
  return {ok:true,short};
}
function stockRevertDeal(deal){
  if(!deal||!deal.stockApplied)return {ok:true,reverted:false};
  const out=Array.isArray(deal.stockOut)?deal.stockOut:whAgg(deal.items);
  out.forEach(i=>{const p=whById(i.pid);if(!p)return;whMove(p,'in',i.qty,{deal:deal.id,note:'отмена сделки',cost:whCost(p)})});
  deal.stockApplied=false;deal.stockOut=[];
  log(`вернул(а) на склад товары сделки «${deal.title||deal.id}»`,{ent:'deal',id:deal.id});
  persist();
  return {ok:true,reverted:true};
}

/* ---------- редактор позиций сделки ---------- */
function whDiOpts(sel){return `<option value="">— выберите товар —</option>`+products.map(p=>`<option value="${p.id}" data-price="${+p.price||0}" data-qty="${+p.qty||0}" data-unit="${esc(whUnit(p))}" ${p.id==sel?'selected':''}>${esc(p.name)} · ${esc(p.sku||'')} · ${whFq(p.qty)} ${esc(whUnit(p))}</option>`).join('')}
function whDiRow(pid,qty){
  const p=whById(pid),q=whNum(qty)>0?whNum(qty):1;
  return `<div class="wh-dirow"><select class="wh-di-pid" aria-label="Товар">${whDiOpts(pid)}</select><input class="wh-di-qty" type="number" min="0" step="any" value="${q}" aria-label="Количество"><span class="wh-di-sum">${p?rub(q*p.price):'—'}</span><button type="button" class="ibtn" data-act="whItemDel" aria-label="Убрать позицию">${ico('x')}</button><div class="wh-di-warn" ${p&&q>p.qty?'':'hidden'}>${p&&q>p.qty?`На складе только ${whFq(p.qty)} ${esc(whUnit(p))}`:''}</div></div>`;
}
function whDealItemsHtml(items){
  const rows=whAgg(items).filter(i=>whById(i.pid));
  const total=rows.reduce((a,i)=>a+i.qty*(whById(i.pid).price||0),0);
  return `<div class="wh-di fld full" id="whDI"><label>Товары из склада</label>
    <div class="wh-di-rows">${rows.map(i=>whDiRow(i.pid,i.qty)).join('')}</div>
    <div class="wh-di-empty" ${rows.length?'hidden':''}>${products.length?'Позиции не добавлены':'Каталог пуст — сначала добавьте товары в разделе «Склад и товары»'}</div>
    <div class="wh-di-foot"><button type="button" class="btn" data-act="whItemAdd" ${products.length?'':'disabled'}>${ico('plus')}Добавить товар</button><span class="wh-di-total">Итого: <b>${rub(total)}</b></span></div></div>`;
}
function whReadDealItems(){
  const root=$('#whDI')||$('.wh-di');if(!root)return [];
  const out=[];
  $$('.wh-dirow',root).forEach(r=>{const pid=+$('.wh-di-pid',r).value,q=whNum($('.wh-di-qty',r).value);if(pid&&q>0)out.push({pid,qty:q})});
  return whAgg(out);
}
function whDiCalc(root){
  let total=0,n=0;
  $$('.wh-dirow',root).forEach(r=>{
    n++;const s=$('.wh-di-pid',r),o=s.selectedOptions[0],q=whNum($('.wh-di-qty',r).value)||0,pr=+(o&&o.dataset.price)||0,st=o&&o.value?+o.dataset.qty:null;
    const line=o&&o.value?q*pr:0;total+=line;$('.wh-di-sum',r).textContent=o&&o.value?rub(line):'—';
    const w=$('.wh-di-warn',r),bad=st!=null&&q>st;w.hidden=!bad;w.textContent=bad?`На складе только ${whFq(st)} ${o.dataset.unit}`:'';
  });
  $('.wh-di-total b',root).textContent=rub(total);
  $('.wh-di-empty',root).hidden=n>0;
}
A.whItemAdd=b=>{const root=b.closest('.wh-di');if(!root)return;$('.wh-di-rows',root).insertAdjacentHTML('beforeend',whDiRow('',1));whDiCalc(root);$$('.wh-di-pid',root).pop()?.focus()};
A.whItemDel=b=>{const root=b.closest('.wh-di'),r=b.closest('.wh-dirow');if(r)r.remove();if(root)whDiCalc(root)};
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{const root=e.target.closest&&e.target.closest('.wh-di');if(root)whDiCalc(root)}));

/* ---------- раздел ---------- */
const WH_TABS=[['catalog','Каталог'],['in','Поступления'],['out','Списания'],['moves','Все движения'],['sup','Поставщики']];
V.products=()=>{
  whNormalize();
  const can_=whCan();
  const act={catalog:can_?`<button class="btn" data-act="whOp" data-type="in">${ico('in')}Приход</button><button class="btn pri" data-act="whNew">${ico('plus')}Добавить товар</button>`:'',
    in:can_?`<button class="btn pri" data-act="whOp" data-type="in">${ico('plus')}Оформить приход</button>`:'',
    out:can_?`<button class="btn pri" data-act="whOp" data-type="writeoff">${ico('plus')}Списать товар</button>`:'',
    moves:can_?`<button class="btn" data-act="whOp" data-type="adjust">Корректировка</button>`:'',
    sup:can_?`<button class="btn pri" data-act="whSupNew">${ico('plus')}Добавить поставщика</button>`:''}[WH.tab]||'';
  $('#view').innerHTML=`<div class="ph"><div><h1>Склад и товары</h1><p>Каталог, остатки, закупки и движение товаров</p></div><div class="acts">${act}</div></div>
  <div class="tabs" role="tablist">${WH_TABS.map(t=>`<button role="tab" class="${WH.tab===t[0]?'on':''}" data-act="whTab" data-t="${t[0]}" aria-selected="${WH.tab===t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="tabpane" id="whPane"></div>`;
  ({catalog:whCatalog,in:()=>whMovesTab('in'),out:()=>whMovesTab('writeoff'),moves:()=>whMovesTab(''),sup:whSuppliers}[WH.tab]||whCatalog)();
};
A.whTab=b=>{WH.tab=b.dataset.t;WH.from=WH.to=WH.pid=WH.mt='';V.products()};

/* ----- каталог ----- */
function whKpi(){
  const byCost=sum(products,p=>p.qty*whCost(p)),bySale=sum(products,p=>p.qty*p.price),low=stockLow().length;
  const mk=products.map(whMarkup).filter(x=>x!=null),avg=mk.length?Math.round(mk.reduce((a,b)=>a+b,0)/mk.length):null;
  return `<div class="wh-kpis"><div class="card kpi"><div class="l">Позиций</div><div class="v">${products.length}</div></div>
  <div class="card kpi"><div class="l">Остатки по закупке</div><div class="v">${mln(byCost)}</div></div>
  <div class="card kpi"><div class="l">Остатки по продаже</div><div class="v">${mln(bySale)}</div></div>
  <button class="card kpi wh-kpi-btn ${WH.low?'on':''}" data-act="whLowToggle" aria-pressed="${WH.low}"><div class="l">Ниже порога</div><div class="v ${low?'down':''}">${low}</div></button>
  <div class="card kpi"><div class="l">Средняя наценка</div><div class="v">${avg==null?'—':avg+'%'}</div></div></div>`;
}
function whCatalog(){
  const cats=[...new Set([...CATS,...products.map(p=>p.cat).filter(Boolean)])];
  $('#whPane').innerHTML=`${whKpi()}
  <div class="tools"><input class="grow" id="wh_q" placeholder="Название или артикул" value="${esc(WH.q)}" aria-label="Поиск товаров">
  <select id="wh_cat" aria-label="Категория"><option value="">Все категории</option>${cats.map(c=>`<option ${WH.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <select id="wh_sup" aria-label="Поставщик"><option value="">Все поставщики</option>${suppliers.map(s=>`<option value="${s.id}" ${WH.sup==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  <select id="wh_sort" aria-label="Сортировка">${[['name','По названию'],['sku','По артикулу'],['qty-asc','Остаток: меньше'],['qty-desc','Остаток: больше'],['price-desc','Цена: дороже'],['margin-desc','Наценка: выше']].map(o=>`<option value="${o[0]}" ${WH.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
  <div id="whList"></div>`;
  $('#wh_q').oninput=e=>{WH.q=e.target.value;whDrawList()};
  $('#wh_cat').onchange=e=>{WH.cat=e.target.value;whDrawList()};
  $('#wh_sup').onchange=e=>{WH.sup=e.target.value;whDrawList()};
  $('#wh_sort').onchange=e=>{WH.sort=e.target.value;whDrawList()};
  whDrawList();
}
A.whLowToggle=()=>{WH.low=!WH.low;V.products()};
function whDrawList(){
  const q=WH.q.trim().toLowerCase();
  let l=products.filter(p=>(!q||((p.name||'')+' '+(p.sku||'')).toLowerCase().includes(q))&&(!WH.cat||p.cat===WH.cat)&&(!WH.sup||p.sup==WH.sup)&&(!WH.low||p.qty<=whMin(p)));
  const s=WH.sort,cmp={name:(a,b)=>(a.name||'').localeCompare(b.name||'','ru'),sku:(a,b)=>(a.sku||'').localeCompare(b.sku||'','ru'),'qty-asc':(a,b)=>a.qty-b.qty,'qty-desc':(a,b)=>b.qty-a.qty,'price-desc':(a,b)=>b.price-a.price,'margin-desc':(a,b)=>(whMarkup(b)??-1e9)-(whMarkup(a)??-1e9)}[s];
  l=l.slice().sort(cmp);
  const el=$('#whList');if(!el)return;
  if(!products.length){el.innerHTML=`<div class="card">${emptyState('box','Каталог пуст','Добавьте первый товар: остатки, закупочные и продажные цены будут в одном месте.',whCan()?`<button class="btn pri" data-act="whNew">${ico('plus')}Добавить товар</button>`:'')}</div>`;return}
  if(!l.length){el.innerHTML=`<div class="card">${emptyState('search','Ничего не найдено','Измените поиск или сбросьте фильтры.',`<button class="btn" data-act="whReset">Сбросить фильтры</button>`)}</div>`;return}
  const can_=whCan();
  el.innerHTML=`<div class="tw"><table class="wh-tbl"><thead><tr><th>Товар</th><th>Артикул</th><th>Категория</th><th>Поставщик</th><th class="r">Остаток</th><th class="r">Закупка</th><th class="r">Цена</th><th class="r">Наценка</th><th>Статус</th><th></th></tr></thead><tbody>${l.map(p=>{
    const st=whStatus(p),mk=whMarkup(p);
    return `<tr class="${p.qty<=whMin(p)?'wh-lowrow':''}"><td><button class="wh-link" data-act="whCard" data-id="${p.id}">${esc(p.name)}</button></td><td class="mut">${esc(p.sku||'')}</td><td>${esc(p.cat||'—')}</td><td>${esc(whSupName(p))}</td>
    <td class="r"><b>${whFq(p.qty)}</b> <span class="mut">${esc(whUnit(p))}</span><div class="mut wh-sm">порог ${whFq(whMin(p))}</div></td><td class="r">${whCost(p)?rub(whCost(p)):'<span class="mut">—</span>'}</td><td class="r">${rub(p.price)}</td><td class="r">${mk==null?'<span class="mut">—</span>':mk+'%'}</td>
    <td><span class="pill ${st[0]}">${st[1]}</span></td>
    <td><span class="cell wh-acts"><button class="ibtn" data-act="whCard" data-id="${p.id}" aria-label="Карточка и история">${ico('eye')}</button>${can_?`<button class="ibtn" data-act="whOp" data-type="in" data-id="${p.id}" aria-label="Приход">${ico('plus')}</button><button class="ibtn" data-act="whEdit" data-id="${p.id}" aria-label="Изменить">${ico('edit')}</button><button class="ibtn" data-act="whDel" data-id="${p.id}" aria-label="Удалить">${ico('trash')}</button>`:''}</span></td></tr>`}).join('')}</tbody></table></div>`;
}
A.whReset=()=>{WH.q=WH.cat=WH.sup='';WH.low=false;V.products()};

/* ----- форма товара ----- */
A.whNew=()=>whForm();
A.whEdit=b=>whForm(+b.dataset.id,b.dataset.back);
function whForm(id,back){
  if(!whCan()){toast('Недостаточно прав для изменения склада');return}
  const p=id?whById(id):null;
  const o=p||{name:'',sku:'',cat:CATS[0]||'',sup:'',unit:'шт',cost:'',price:'',min:'',qty:''};
  const cats=[...new Set([...CATS,o.cat].filter(Boolean))];
  modal({title:p?'Редактирование товара':'Новый товар',body:`<div class="form">${fld('wp_name','Название',o.name,{full:1})}${fld('wp_sku','Артикул (уникальный)',o.sku,{ph:'EL-0000'})}${fld('wp_cat','Категория',o.cat,{type:'select',opts:cats})}
  ${fld('wp_sup','Поставщик',o.sup||'',{type:'select',opts:[['','— не указан —'],...suppliers.map(s=>[s.id,s.name])]})}${fld('wp_unit','Единица измерения',o.unit||'шт',{type:'select',opts:[...new Set([...WH_UNITS,o.unit||'шт'])]})}
  ${fld('wp_cost','Закупочная цена, ₽',o.cost,{type:'number'})}${fld('wp_price','Продажная цена, ₽',o.price,{type:'number'})}${fld('wp_min','Порог остатка',o.min,{type:'number'})}
  ${p?`<div class="fld"><label>Текущий остаток</label><div class="wh-static">${whFq(p.qty)} ${esc(whUnit(p))}</div><div class="wh-sm mut">Меняется приходом, списанием или корректировкой</div></div>`:fld('wp_qty','Начальный остаток',o.qty,{type:'number'})}</div>`,
  foot:[{label:'Отмена',fn:()=>{closeModal();if(back)whCard(+back)}},{label:p?'Сохранить':'Добавить',cls:'pri',fn:()=>{
    const name=val('wp_name');let sku=val('wp_sku');
    if(!name){toast('Укажите название');return}
    if(!sku)sku='WH-'+String(nid+1);
    if(whSkuTaken(sku,p)){toast('Товар с таким артикулом уже есть');return}
    const nums={};for(const [k,l] of [['wp_cost','закупочная цена'],['wp_price','продажная цена'],['wp_min','порог']]){const raw=val(k);const n=raw===''?0:whNum(raw);if(!(n>=0)){toast('Некорректно: '+l);return}nums[k]=n}
    let q0=0;if(!p){const raw=val('wp_qty');q0=raw===''?0:whNum(raw);if(!(q0>=0)){toast('Некорректный начальный остаток');return}}
    const sup=+val('wp_sup')||0;
    const data={name,sku,cat:val('wp_cat'),unit:val('wp_unit'),cost:nums.wp_cost,price:nums.wp_price,min:nums.wp_min};
    if(p){
      const wasLow=p.qty<=whMin(p);Object.assign(p,data);if(sup)p.sup=sup;else delete p.sup;whAfter(p,wasLow);
      log(`изменил(а) товар «${p.name}»`,{ent:'product',id:p.id});toast('Товар сохранён');
    }else{
      const np={id:++nid,...data,qty:0,lowNotified:false};if(sup)np.sup=sup;
      products.unshift(np);
      if(q0>0)whMove(np,'in',q0,{note:'Начальный остаток',cost:data.cost,sup:sup||undefined});
      log(`добавил(а) товар «${np.name}» (${np.sku})`,{ent:'product',id:np.id});toast('Товар добавлен');
    }
    persist();closeModal();V.products();if(back)whCard(+back);
  }}]});
}
A.whDel=b=>{
  if(!whCan()){toast('Недостаточно прав для удаления');return}
  const p=whById(+b.dataset.id);if(!p)return;
  confirmBox(`Удалить товар «${esc(p.name)}»? Он попадёт в корзину, историю движений можно будет восстановить вместе с товаром.`,()=>{closeModal();trashPut('product',p);persist();toast('Товар перенесён в корзину');V.products()});
};

/* ----- таблица движений ----- */
function whMvRows(list){
  return list.map(m=>{
    const p=whById(m.pid),t=WH_MT[m.type]||[m.type,''],sign=m.type==='in'?'+':m.type==='adjust'?(m.qty>=0?'+':'−'):'−';
    const amt=m.cost!=null?Math.abs(m.qty)*m.cost:null;
    return `<tr><td class="wh-nw">${esc(fdt(m.at))}</td><td>${p?`<button class="wh-link" data-act="whCard" data-id="${p.id}">${esc(p.name)}</button>`:`<span class="mut">Удалённый товар №${esc(m.pid)}</span>`}</td><td><span class="pill ${t[1]}">${t[0]}</span></td>
    <td class="r wh-nw wh-q ${sign==='+'?'pos':'neg'}">${sign}${whFq(Math.abs(m.qty))}${p?' '+esc(whUnit(p)):''}</td><td class="r">${m.cost!=null?rub(m.cost):'<span class="mut">—</span>'}</td><td class="r">${amt!=null?rub(amt):'<span class="mut">—</span>'}</td>
    <td>${esc(m.by||'—')}</td><td class="wh-note">${esc(m.note||'')}${m.sup&&whSup(m.sup)?`<div class="mut wh-sm">${esc(whSup(m.sup).name)}</div>`:''}</td></tr>`}).join('');

const whMvHead=`<thead><tr><th>Дата</th><th>Товар</th><th>Тип</th><th class="r">Кол-во</th><th class="r">Цена / себест.</th><th class="r">Сумма</th><th>Кто</th><th>Заметка</th></tr></thead>`;
const whSorted=l=>l.slice().sort((a,b)=>(b.at-a.at)||(b.id-a.id));
function whMovesTab(type){

  <select id="wh_pid" aria-label="Товар"><option value="">Все товары</option>${products.map(p=>`<option value="${p.id}" ${WH.pid==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
  ${type===''?`<select id="wh_mt" aria-label="Тип">${[['','Все типы'],['in','Приход'],['out','Продажа'],['writeoff','Списание'],['adjust','Корректировка']].map(o=>`<option value="${o[0]}" ${WH.mt===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`:''}
  <button class="btn" data-act="whMvReset">Сбросить</button></div><div id="whMoves"></div>`;

  $('#wh_pid').onchange=e=>{WH.pid=e.target.value;redraw()};if($('#wh_mt'))$('#wh_mt').onchange=e=>{WH.mt=e.target.value;redraw()};
  WH._t=titles;redraw();
}
A.whMvReset=()=>{WH.from=WH.to=WH.pid=WH.mt='';V.products()};
function whDrawMoves(type){
  const t=type||WH.mt;
  const l=whSorted(moves.filter(m=>(!t||m.type===t)&&(!WH.pid||m.pid==WH.pid)&&(!WH.from||dayOf(m.at)>=WH.from)&&(!WH.to||dayOf(m.at)<=WH.to)));
  const el=$('#whMoves');if(!el)return;

}

/* ----- карточка товара ----- */
A.whCard=b=>whCard(+b.dataset.id);
function whCard(id){
  const p=whById(id);if(!p)return;
  const st=whStatus(p),mk=whMarkup(p),ms=whSorted(moves.filter(m=>m.pid==id)).slice(0,60),can_=whCan();
  const inSum=sum(moves.filter(m=>m.pid==id&&m.type==='in'),m=>m.qty),outSum=sum(moves.filter(m=>m.pid==id&&m.type==='out'),m=>m.qty);
  modal({wide:1,title:esc(p.name),body:`<div class="wh-card">
    <div class="wh-cgrid"><div><div class="mut wh-sm">Артикул</div><b>${esc(p.sku||'—')}</b></div><div><div class="mut wh-sm">Категория</div><b>${esc(p.cat||'—')}</b></div><div><div class="mut wh-sm">Поставщик</div><b>${esc(whSupName(p))}</b></div>
    <div><div class="mut wh-sm">Остаток</div><b class="wh-big">${whFq(p.qty)} ${esc(whUnit(p))}</b> <span class="pill ${st[0]}">${st[1]}</span></div><div><div class="mut wh-sm">Порог</div><b>${whFq(whMin(p))} ${esc(whUnit(p))}</b></div>
    <div><div class="mut wh-sm">Закупка (средневзв.)</div><b>${whCost(p)?rub(whCost(p)):'—'}</b></div><div><div class="mut wh-sm">Продажа</div><b>${rub(p.price)}</b></div><div><div class="mut wh-sm">Наценка</div><b>${mk==null?'—':mk+'%'}</b></div>
    <div><div class="mut wh-sm">Стоимость остатка</div><b>${rub(p.qty*whCost(p))}</b> <span class="mut wh-sm">/ ${rub(p.qty*p.price)}</span></div><div><div class="mut wh-sm">Всего приходов / продаж</div><b>${whFq(inSum)} / ${whFq(outSum)}</b></div></div>
    <h4 style="margin:18px 0 8px">История движений</h4>
    ${ms.length?`<div class="tw"><table class="wh-tbl">${whMvHead}<tbody>${whMvRows(ms)}</tbody></table></div>`:emptyState('log','Движений нет','Приход, списание или продажа появятся здесь.')}</div>`,
  foot:[{label:'Закрыть',fn:closeModal},...(can_?[{label:'Изменить',fn:()=>{closeModal();whForm(id,id)}},{label:'Корректировка',fn:()=>whOpForm('adjust',id,id)},{label:'Списание',fn:()=>whOpForm('writeoff',id,id)},{label:'Приход',cls:'pri',fn:()=>whOpForm('in',id,id)}]:[])]});
}

/* ----- операции ----- */
A.whOp=b=>whOpForm(b.dataset.type,b.dataset.id?+b.dataset.id:0,0);
function whOpForm(type,pid,back){
  if(!whCan()){toast('Недостаточно прав для изменения склада');return}
  if(!products.length){toast('Сначала добавьте товар в каталог');return}
  const p=pid?whById(pid):null,first=p||products[0];
  const T={in:'Приход товара',writeoff:'Списание товара',adjust:'Корректировка остатка'}[type];
  const prodSel=fld('wo_pid','Товар',first.id,{type:'select',opts:products.map(x=>[x.id,`${x.name} · ${x.sku||''}`]),full:1});
  const hint=`<div class="wh-hint full" id="wo_hint"></div>`;
  let fields;
  if(type==='in')fields=`${prodSel}${hint}${fld('wo_qty','Количество','',{type:'number'})}${fld('wo_cost','Закупочная цена за ед., ₽',whCost(first)||'',{type:'number'})}${fld('wo_sup','Поставщик',first.sup||'',{type:'select',opts:[['','— не указан —'],...suppliers.map(s=>[s.id,s.name])],full:1})}${fld('wo_note','Заметка (накладная, комментарий)','',{full:1})}`;
  else if(type==='writeoff')fields=`${prodSel}${hint}${fld('wo_qty','Количество','',{type:'number'})}${fld('wo_reason','Причина',WH_REASONS[0],{type:'select',opts:WH_REASONS})}${fld('wo_note','Комментарий','',{full:1})}`;
  else fields=`${prodSel}${hint}${fld('wo_qty','Фактический остаток',first.qty,{type:'number'})}${fld('wo_note','Причина расхождения','',{full:1})}`;
  modal({title:T,body:`<div class="form wh-opform" data-type="${type}">${fields}</div>`,foot:[
    {label:'Отмена',fn:()=>{closeModal();if(back)whCard(back)}},
    {label:{in:'Оприходовать',writeoff:'Списать',adjust:'Зафиксировать'}[type],cls:'pri',fn:()=>whOpSave(type,back)}]});
  whOpHint();
  if(p&&type!=='adjust')$('#wo_qty')?.focus();
}
function whOpHint(){
  const f=$('.wh-opform');if(!f)return;const p=whById(+val('wo_pid')),h=$('#wo_hint');if(!p||!h)return;
  const t=f.dataset.type;
  h.innerHTML=`Сейчас на складе: <b>${whFq(p.qty)} ${esc(whUnit(p))}</b>`+(t==='in'&&whCost(p)?` · средняя закупка ${rub(whCost(p))}`:'')+(t==='adjust'?` · введите фактическое количество, разница будет записана`:'');
}
document.addEventListener('change',e=>{
  if(e.target.id!=='wo_pid')return;const f=$('.wh-opform'),p=whById(+e.target.value);if(!f||!p)return;
  if(f.dataset.type==='in'){$('#wo_cost').value=whCost(p)||'';$('#wo_sup').value=p.sup||''}
  if(f.dataset.type==='adjust')$('#wo_qty').value=p.qty;
  whOpHint();
});
function whOpSave(type,back){
  const p=whById(+val('wo_pid'));if(!p){toast('Выберите товар');return}
  const q=whNum(val('wo_qty')),note=val('wo_note'),u=whUnit(p);
  if(type==='adjust'){
    if(!(q>=0)){toast('Укажите фактический остаток (0 или больше)');return}
    const diff=whR3(q-p.qty);if(diff===0){toast('Остаток совпадает с учётным — менять нечего');return}
    whMove(p,'adjust',diff,{note:'Корректировка: было '+whFq(p.qty)+', стало '+whFq(q)+(note?' — '+note:'')});
    log(`скорректировал(а) остаток «${p.name}»: ${diff>0?'+':''}${whFq(diff)} ${u}`,{ent:'product',id:p.id});
    toast('Остаток скорректирован');
  }else{
    if(!(q>0)){toast('Укажите количество больше нуля');return}
    if(type==='writeoff'){
      if(q>p.qty){toast(`Нельзя списать больше остатка: на складе ${whFq(p.qty)} ${u}`);return}
      const r=val('wo_reason');
      whMove(p,'writeoff',q,{note:r+(note?': '+note:'')});
      log(`списал(а) «${p.name}»: ${whFq(q)} ${u} (${r})`,{ent:'product',id:p.id});toast('Товар списан');
    }else{
      const raw=val('wo_cost'),c=raw===''?whCost(p):whNum(raw);
      if(!(c>=0)){toast('Некорректная закупочная цена');return}
      const sid=+val('wo_sup')||0;
      whMove(p,'in',q,{note,cost:c,sup:sid||undefined});
      if(sid&&!p.sup)p.sup=sid;
      log(`оприходовал(а) «${p.name}»: +${whFq(q)} ${u} по ${rub(c)}`,{ent:'product',id:p.id});toast('Приход оформлен');
    }
  }
  closeModal();V.products();if(back)whCard(back);
}

/* ----- поставщики ----- */
function whSuppliers(){
  const el=$('#whPane');
  if(!suppliers.length){el.innerHTML=`<div class="card">${emptyState('team','Поставщиков пока нет','Добавьте поставщиков, чтобы указывать их в товарах и приходах.',whCan()?`<button class="btn pri" data-act="whSupNew">${ico('plus')}Добавить поставщика</button>`:'')}</div>`;return}

    <td>${can_?`<span class="cell wh-acts"><button class="ibtn" data-act="whSupEdit" data-id="${s.id}" aria-label="Изменить">${ico('edit')}</button><button class="ibtn" data-act="whSupDel" data-id="${s.id}" aria-label="Удалить">${ico('trash')}</button></span>`:''}</td></tr>`}).join('')}</tbody></table></div>`;

A.whSupNew=()=>whSupForm();
A.whSupEdit=b=>whSupForm(+b.dataset.id);
function whSupForm(id){
  if(!whCan()){toast('Недостаточно прав');return}
  const s=id?whSup(id):{name:'',phone:'',email:'',note:''};
  modal({title:id?'Редактирование поставщика':'Новый поставщик',body:`<div class="form">${fld('ws_name','Название',s.name,{full:1})}${fld('ws_phone','Телефон',s.phone,{type:'tel'})}${fld('ws_email','Почта',s.email,{type:'email'})}${fld('ws_note','Заметка',s.note,{type:'textarea',full:1})}</div>`,
  foot:[{label:'Отмена',fn:closeModal},{label:id?'Сохранить':'Добавить',cls:'pri',fn:()=>{
    const name=val('ws_name');if(!name){toast('Укажите название');return}
    if(suppliers.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase())){toast('Поставщик с таким названием уже есть');return}
    const o={name,phone:val('ws_phone'),email:val('ws_email'),note:val('ws_note')};
    if(id){Object.assign(s,o);log(`изменил(а) поставщика «${name}»`,{ent:'supplier',id})}
    else{const ns={id:++nid,...o};suppliers.push(ns);log(`добавил(а) поставщика «${name}»`,{ent:'supplier',id:ns.id})}
    persist();closeModal();toast('Поставщик сохранён');V.products();
  }}]});
}
A.whSupDel=b=>{
  if(!whCan()){toast('Недостаточно прав');return}
  const s=whSup(+b.dataset.id);if(!s)return;
  const used=products.filter(p=>p.sup==s.id);
  const drop=(to)=>{used.forEach(p=>{if(to)p.sup=to;else delete p.sup});suppliers.splice(suppliers.indexOf(s),1);
    log(`удалил(а) поставщика «${s.name}»${used.length?` (товаров переназначено: ${used.length})`:''}`,{ent:'supplier',id:s.id});persist();toast('Поставщик удалён');V.products()};
  if(!used.length){confirmBox(`Удалить поставщика «${esc(s.name)}»?`,()=>drop(0));return}
  modal({title:'Поставщик используется',body:`<p>На «${esc(s.name)}» ссылаются товары: <b>${used.length}</b>. Чтобы удалить поставщика, выберите, кому их передать.</p><div class="form">${fld('ws_to','Новый поставщик',0,{type:'select',opts:[[0,'— без поставщика —'],...suppliers.filter(x=>x!==s).map(x=>[x.id,x.name])],full:1})}</div>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Переназначить и удалить',cls:'pri',fn:()=>{const to=+val('ws_to')||0;closeModal();drop(to)}}]});
};
