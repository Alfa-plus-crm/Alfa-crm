  const act=M.activeDeals(),stalled=act.filter(d=>d.moved&&d.moved<addDays(t,-14));
  const lossC={};M.dealsLost(cur).forEach(d=>lossC[d.lossReason||'Не указана']=(lossC[d.lossReason||'Не указана']||0)+1);
  return {
    date:t,currency:'RUB',
    period30:{revenue:M.revenue(cur),expenses:M.expenses(cur),profit:M.profit(cur),dealsWon:M.dealsWon(cur).length,dealsLost:M.dealsLost(cur).length,dealsCreated:deals.filter(d=>inR(d.created,cur)).length,newClients:M.newClients(cur)},
    prev30:{revenue:M.revenue(prev),expenses:M.expenses(prev),profit:M.profit(prev),dealsWon:M.dealsWon(prev).length,dealsLost:M.dealsLost(prev).length,dealsCreated:deals.filter(d=>inR(d.created,prev)).length,newClients:M.newClients(prev)},
    pendingIncome:M.pending(),pendingExpenses:M.pendingOut(),

    funnel:STAGES.map(s=>({stage:s.name,count:deals.filter(d=>d.stage===s.id).length,sum:sum(deals.filter(d=>d.stage===s.id),d=>d.sum)})),
    activeDeals:act.length,activeDealsSum:sum(act,d=>d.sum),weightedForecast:Math.round(sum(act,dWeighted)),stalledDeals:stalled.length,
    lossReasons:lossC,overdueTasks:M.overdueTasks().length,openTasks:tasks.filter(x=>!tkDone(x)).length,clients:clients.length,
    staff:staff.map((s,i)=>({n:'Сотрудник '+(i+1),won30:M.dealsWon(cur).filter(d=>d.mgr===s.id).length,sum30:sum(M.dealsWon(cur).filter(d=>d.mgr===s.id),d=>d.sum),active:act.filter(d=>d.mgr===s.id).length,overdueTasks:tasks.filter(x=>x.mgr===s.id&&tkLate(x)).length}))
  };
}

/* ---------- Локальные обработчики ---------- */
const aiHave=()=>deals.length||fin.length||clients.length;
function aiSalesDrop(){
  const d=aiDigest(),c=d.period30,p=d.prev30,why=[],facts=[];
  facts.push(`Выручка (оплачено): ${rub(c.revenue)} за последние 30 дней против ${rub(p.revenue)} за предыдущие 30 (${aiChg(c.revenue,p.revenue)})`);
  if(p.revenue===0&&c.revenue===0)return {t:'За оба периода нет оплаченных поступлений от продаж, поэтому сравнивать нечего. Отметьте оплаты в разделе «Финансы» — выручка считается только по фактически полученным платежам.',facts};
  const dn=c.revenue<p.revenue;
  const head=dn?`Выручка за последние 30 дней ниже предыдущих 30 на ${Math.abs(aiPct(c.revenue,p.revenue)??100)}%.`:`Выручка за последние 30 дней не ниже предыдущих 30 (${aiChg(c.revenue,p.revenue)}), снижения по данным нет.`;
  if(c.dealsWon<p.dealsWon)why.push(`Меньше выигранных сделок: ${c.dealsWon} против ${p.dealsWon}.`);
  const avgC=c.dealsWon?sum(M.dealsWon(aiR(addDays(d.date,-29),d.date)),x=>x.sum)/c.dealsWon:0,avgP=p.dealsWon?sum(M.dealsWon(aiR(addDays(d.date,-59),addDays(d.date,-30))),x=>x.sum)/p.dealsWon:0;
  if(avgP&&avgC&&avgC<avgP*.9)why.push(`Средний чек снизился: ${rub(Math.round(avgC))} против ${rub(Math.round(avgP))}.`);
  if(c.dealsCreated<p.dealsCreated)why.push(`Создано меньше новых сделок (приток): ${c.dealsCreated} против ${p.dealsCreated}.`);
  if(c.newClients<p.newClients)why.push(`Пришло меньше новых клиентов: ${c.newClients} против ${p.newClients}.`);
  if(c.dealsLost>p.dealsLost)why.push(`Больше отказов: ${c.dealsLost} против ${p.dealsLost}${Object.keys(d.lossReasons).length?'. Причины: '+Object.entries(d.lossReasons).map(([k,v])=>`${esc(k)} — ${v}`).join(', '):''}.`);
  if(d.stalledDeals)why.push(`${d.stalledDeals} активных сделок без движения более 14 дней на сумму ${rub(sum(M.activeDeals().filter(x=>x.moved&&x.moved<addDays(d.date,-14)),x=>x.sum))}.`);
  if(d.overduePayments)why.push(`Есть ${d.overduePayments} просроченных ожидаемых платежей на ${rub(sum(fin.filter(f=>f.type==='in'&&!isPaid(f)&&f.due&&f.due<d.date),f=>f.sum))}: деньги по сделкам есть, но не получены, поэтому в выручку не попадают.`);
  facts.push(`Выиграно сделок: ${c.dealsWon} (было ${p.dealsWon}); создано сделок: ${c.dealsCreated} (было ${p.dealsCreated}); новых клиентов: ${c.newClients} (было ${p.newClients}); отказов: ${c.dealsLost} (было ${p.dealsLost})`);
  return {t:head+(why.length?` Что видно в данных:${aiL(why)}`:dn?' Явных причин в данных CRM не найдено — возможно, они вне системы.':''),facts};
}
function aiForecast(){
  const d=aiDigest(),t=d.date,r30=aiR(addDays(t,-29),t),r90=aiR(addDays(t,-89),t);
  const run30=M.revenue(r30),run90=Math.round(M.revenue(r90)/3);
  const due=fin.filter(f=>f.type==='in'&&!isPaid(f)&&f.due&&f.due<=addDays(t,30));
  const dueS=sum(due,f=>f.sum),w=d.weightedForecast;
  const facts=[`Выручка за последние 30 дней: ${rub(run30)}; среднее за 30 дней по последним 90: ${rub(run90)}`,`Ожидаемые платежи со сроком до 30 дней: ${rub(dueS)} (${due.length} шт.)`,`Активные сделки: ${d.activeDeals} на ${rub(d.activeDealsSum)}, с учётом вероятности: ${rub(w)}`];
  if(!run90&&!dueS&&!d.activeDeals)return {t:'Для прогноза пока нет данных: нет оплаченных поступлений, ожидаемых платежей и активных сделок.',facts};
  const lo=Math.round(Math.min(run30,run90||run30)*.8+dueS*.5),hi=Math.round(Math.max(run30,run90)+dueS+w*.3);
  return {t:`Ориентир выручки на следующие 30 дней: от ${rub(lo)} до ${rub(hi)}. Это оценка, а не гарантия: нижняя граница — 80% от прошлых темпов плюс половина ожидаемых платежей; верхняя — прошлые темпы плюс все ожидаемые платежи и 30% взвешенного потенциала сделок. Вероятности сделок вы задаёте сами, поэтому точность зависит от их качества.`,facts};
}
function aiProblems(){
  const t=iso(0),st=M.activeDeals().filter(d=>d.moved&&d.moved<addDays(t,-14)),late=M.activeDeals().filter(d=>d.exp&&d.exp<t),noOwner=M.activeDeals().filter(d=>!staff.find(s=>s.id===d.mgr)),over=fin.filter(f=>f.type==='in'&&!isPaid(f)&&f.due&&f.due<t);
  const L=[];
  st.slice(0,6).forEach(d=>L.push(`«${esc(d.title)}» (${rub(d.sum)}) — без движения с ${fd(d.moved)}, этап «${esc(dStage(d.stage).name)}»`));
  late.filter(d=>!st.includes(d)).slice(0,4).forEach(d=>L.push(`«${esc(d.title)}» — ожидаемая дата закрытия ${fd(d.exp)} прошла`));
  over.slice(0,4).forEach(f=>L.push(`Просрочен платёж ${rub(f.sum)}: ${esc(f.t)} (ожидался ${fd(f.due)})`));
  noOwner.forEach(d=>L.push(`«${esc(d.title)}» — ответственный не найден`));
  return {t:L.length?`Нашёл ${L.length} проблемных позиций:${aiL(L)}`:'Проблемных сделок по правилам проверки не найдено: нет сделок без движения более 14 дней, с просроченной датой закрытия, без ответственного и с просроченными платежами.',facts:[`Критерии: без изменений 14+ дней; дата закрытия в прошлом; платёж просрочен; нет ответственного`,`Активных сделок: ${M.activeDeals().length}`]};
}
function aiTasks(){
  const o=M.overdueTasks();
  if(!o.length)return {t:'Просроченных задач нет.',facts:[`Открытых задач: ${tasks.filter(x=>!tkDone(x)).length}`]};
  const by={};o.forEach(x=>by[x.mgr]=(by[x.mgr]||0)+1);
  return {t:`Просрочено задач: ${o.length}. По сотрудникам: ${Object.entries(by).map(([k,v])=>`${esc(mgrOf(+k).name)} — ${v}`).join(', ')}.${aiL(o.sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6).map(x=>`«${esc(x.title)}» — срок ${fd(x.due)}, ${esc(mgrOf(x.mgr).name)}`))}`,facts:[`Открытых задач всего: ${tasks.filter(x=>!tkDone(x)).length}`]};
}
function aiClients(){
  const t=iso(0),inact=clients.filter(c=>cLast(c)<addDays(t,-30)&&deals.some(d=>d.cid===c.id&&!['won','lost'].includes(d.stage))),noDeal=clients.filter(c=>!deals.some(d=>d.cid===c.id)),top=[...clients].sort((a,b)=>cPaid(b)-cPaid(a)).filter(c=>cPaid(c)>0).slice(0,5);
  const src={};clients.forEach(c=>src[c.source||'Не указан']=(src[c.source||'Не указан']||0)+1);
  const L=[`Клиентов: ${clients.length}; без сделок: ${noDeal.length}`,`С активной сделкой, но без контактов более 30 дней: ${inact.length}${inact.length?' ('+inact.slice(0,4).map(c=>esc(c.name)).join(', ')+')':''}`,
   top.length?`Больше всего оплачено: ${top.map(c=>`${esc(c.name)} — ${rub(cPaid(c))}`).join('; ')}`:'Оплаченных покупок пока нет',`Источники: ${Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} — ${v}`).join(', ')}`];
  return {t:`Анализ клиентской базы:${aiL(L)}`,facts:[]};
}
function aiStaff(){
  const d=aiDigest();if(!staff.length)return {t:'Сотрудников нет.',facts:[]};
  const cur=aiR(addDays(d.date,-29),d.date),rows=staff.map(s=>{const w=M.dealsWon(cur).filter(x=>x.mgr===s.id),l=M.dealsLost(cur).filter(x=>x.mgr===s.id);return {s,w:w.length,sum:sum(w,x=>x.sum),conv:pct(w.length,w.length+l.length),act:deals.filter(x=>x.mgr===s.id&&!['won','lost'].includes(x.stage)).length,od:tasks.filter(x=>x.mgr===s.id&&tkLate(x)).length,l:l.length}}).sort((a,b)=>b.sum-a.sum);

function aiMessage(q){

  if(!c)return {t:'Укажите клиента по имени, например: «Напиши сообщение клиенту Павел Громов». Я составлю текст по шаблону с учётом его сделки.',facts:[]};
  const d=deals.filter(x=>x.cid===c.id&&!['won','lost'].includes(x.stage)).sort((a,b)=>b.sum-a.sum)[0],pay=fin.find(f=>f.type==='in'&&!isPaid(f)&&(f.cid===c.id||deals.find(x=>x.id===f.deal)?.cid===c.id));
  const key=pay?'оплат':d?(d.stage==='offer'?'предложение':d.stage==='new'||d.stage==='contact'?'первый':'предложение'):'первый';
  const tpl=templates.find(x=>norm(x.name).includes(key))||templates[0];

}
function aiAdvice(){
  const d=aiDigest(),L=[];

  if(d.overduePayments)L.push(`Напомните клиентам про ${d.overduePayments} просроченных платежей (шаблон «Напоминание об оплате» в «Сообщениях»).`);
  const due=typeof contactDue==='function'?contactDue():[];if(due.length)L.push(`Пора повторно связаться с клиентами: ${due.length}.`);
  const low=typeof stockLow==='function'?stockLow():[];if(low.length)L.push(`Низкий остаток у ${low.length} товаров — проверьте закупку.`);
  return {t:L.length?`Что стоит сделать в первую очередь:${aiL(L)}`:'По данным CRM срочных действий нет.',facts:['Рекомендации строятся по правилам из ваших данных, а не по «чутью» модели']};
}
const aiProviders=[
  {id:'drop',k:/(почему|причин).*(снизил|упал|меньше|паден)|снижен|падени/,fn:aiSalesDrop},
  {id:'forecast',k:/прогноз|ожида.*выруч|сколько.*зарабо/,fn:aiForecast},

function aiLocal(q){
  if(!aiHave())return {t:'В CRM пока нет данных для анализа. Добавьте клиентов, сделки и платежи — и я смогу считать по ним.',facts:[]};
  const n=norm(q),p=aiProviders.find(x=>x.k.test(n));
  if(!p)return {t:'Локальная аналитика понимает вопросы по продажам, прогнозу, проблемным сделкам, задачам, клиентам, сотрудникам, отчётам, рекомендациям и черновикам сообщений. Попробуйте один из примеров ниже. Для вопросов в свободной форме подключите языковую модель (см. «Режим работы»).',facts:[]};
  return p.fn(q);
}

/* ---------- Удалённый режим (Edge Function) ---------- */
async function aiRemote(q){
  const r=await sb.functions.invoke('alfa-ai',{body:{question:q,digest:aiDigest()}});
  if(r.error){let m=r.error.message||'ошибка вызова';try{const j=await r.error.context?.json?.();if(j?.error)m=j.error}catch(e){}throw new Error(m)}
  if(!r.data||!r.data.answer)throw new Error('пустой ответ функции');
  return r.data.answer;
}

    catch(e){AI.log.pop();AI.log.push({t:'Не удалось получить ответ модели: '+e.message+'. Проверьте, что функция alfa-ai развёрнута и секрет ANTHROPIC_API_KEY задан (docs/AI.md). Можно переключиться на локальную аналитику.',err:1,mode:'remote'})}

A.askClear=()=>{
  if(!can('settings.manage'))return toast('Недостаточно прав');
  modal({title:'Очистить все данные?',body:`<p>Будут удалены клиенты, сделки, задачи, товары, финансы, переписка и остальные данные рабочего пространства. Аккаунт останется. <b>Это действие нельзя отменить</b> (облачные версии могут помочь, если применена миграция 001).</p><p>Для подтверждения введите слово <b>ОЧИСТИТЬ</b>.</p><div class="form">${fld('cl_w','Подтверждение','',{full:1})}</div><div class="err" id="clerr"></div>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Скачать копию',fn:()=>A.backup()},{label:'Очистить',cls:'dng',fn:()=>{if(val('cl_w').trim().toUpperCase()!=='ОЧИСТИТЬ'){$('#clerr').textContent='Введите слово ОЧИСТИТЬ';return}
     emptyWorkspace();persist();closeModal();paintShell();drawNav();toast('Данные очищены');go('home')}}]});
};

/* ---------- Облачные версии (таблица crm_workspace_history из миграции 001) ---------- */
A.snapList=async()=>{
  modal({title:'Облачные версии',body:'<div id="snapBox">'+skeleton(3,48)+'</div>',foot:[{label:'Закрыть',cls:'pri',fn:closeModal}]});
  try{
    const r=await sb.from('crm_workspace_history').select('id,saved_at,bytes,reason').order('saved_at',{ascending:false}).limit(30);
    if(r.error)throw r.error;
    $('#snapBox').innerHTML=r.data.length?`<div class="list">${r.data.map(s=>`<div class="row"><div class="grow"><b>${esc(fdt(Date.parse(s.saved_at)))}</b><small>${s.reason==='before_restore'?'Перед восстановлением':'Автоснимок'} · ${fileSize(s.bytes)}</small></div><button class="btn sm" data-act="snapRestore" data-id="${s.id}">Восстановить</button></div>`).join('')}</div>`:emptyState('clock','Снимков пока нет','Первый снимок создаётся при очередном изменении данных, не чаще раза в час.');
  }catch(e){$('#snapBox').innerHTML=emptyState('alert','Версии недоступны',(e.message||'Ошибка запроса')+'. Вероятно, миграция 001 ещё не применена в вашем проекте Supabase.')}
};
A.snapRestore=b=>confirmBox('Заменить текущие данные выбранной версией? Текущее состояние будет сохранено как отдельный снимок «Перед восстановлением». Страница перезагрузится.',async()=>{
  try{const r=await sb.rpc('restore_workspace_from_history',{history_id:+b.dataset.id});if(r.error)throw r.error;
    try{localStorage.removeItem('vexon-ws:'+CUR)}catch(e){}
    toast('Версия восстановлена. Перезагрузка…');setTimeout(()=>location.reload(),900)}
  catch(e){toast('Не удалось восстановить: '+(e.message||'ошибка'))}},'Восстановить');

</script>
<script>
/* Встроенный файл: assets/js/boot.js */
/* boot.js — запуск приложения (загружается последним) */
(function(){
  try{theme=localStorage.getItem('vexon-theme')||'system'}catch(e){theme='system'}
  const mac=/Mac|iPhone|iPad/i.test(navigator.platform||navigator.userAgent||'');
  const k=document.getElementById('kbdHint');if(k)k.textContent=mac?'⌘K':'Ctrl K';
  init();
  /* Переопределяем обработчики, назначенные в init() синхронно до первого await */
  $('#themeBtn').onclick=()=>setTheme(effTheme()==='dark'?'light':'dark');
  const gs=$('#gs');gs.oninput=null;gs.onfocus=null;gs.onclick=()=>openPalette();
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal')?closePalette():openPalette()}});
  /* Временные триггеры автоматизации: при входе и каждые 5 минут, пока приложение открыто */
  let tickedFor=null;
  const tick=()=>{try{if(CUR&&!$('#app').hidden&&typeof autoTick==='function'){autoTick();tickedFor=CUR}}catch(e){console.error('autoTick',e)}};
  setInterval(()=>{if(CUR&&tickedFor!==CUR)setTimeout(tick,1500)},2000);
  setInterval(tick,300000);
})();

</script>
</body>
</html>
