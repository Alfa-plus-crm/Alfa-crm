<script>
/* Встроенный файл: assets/js/foundation.js */
/* ==========================================================================
   foundation.js — общие сервисы alfa+ (загружается после core.js)
   Здесь: новые списки данных, корзина, уведомления, роли/права, метрики
   выручки и прибыли, период, помощники UI. Контракт — docs/CONTRACT.md
   ========================================================================== */

/* ---------- Новые списки (сохраняются в рабочем пространстве вместе со старыми) ---------- */
const trash=[],moves=[],suppliers=[],templates=[],nlog=[],files=[];
Object.assign(LISTS,{trash,moves,suppliers,templates,nlog,files});

/* ---------- Мелкие помощники ---------- */
function download(name,data,mime='text/plain'){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime+';charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const relTime=ts=>{
  if(!ts)return '';const s=Math.max(0,Math.round((Date.now()-ts)/1000));
  if(s<45)return 'только что';if(s<3600)return Math.round(s/60)+' мин назад';
  if(s<86400)return Math.round(s/3600)+' ч назад';
  const d=Math.round(s/86400);if(d<7)return d+' дн. назад';
  return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
};
const fdt=ts=>new Date(ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const emptyState=(icon,title,text='',btn='')=>`<div class="empty"><div class="em-ic">${ico(icon)}</div><b>${esc(title)}</b>${text?`<div>${esc(text)}</div>`:''}${btn?`<div style="margin-top:14px">${btn}</div>`:''}</div>`;
const skeleton=(n=3,h=64)=>Array.from({length:n},()=>`<i class="sk card" style="height:${h}px;margin-bottom:12px"></i>`).join('');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const sum=(arr,f=x=>x)=>arr.reduce((a,x)=>a+(+f(x)||0),0);
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=new Date(s.slice(0,10)+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const dayOf=ts=>isoOf(new Date(ts));

/* ---------- Период (общий для дашборда, финансов, аналитики и ИИ) ---------- */
const PERIODS=[['today','Сегодня'],['7d','7 дней'],['30d','30 дней'],['90d','90 дней'],['year','Год'],['all','Всё время']];
function periodRange(key){
  const to=iso(0);
  const m={today:0,'7d':6,'30d':29,'90d':89};
  if(key in m)return {from:iso(-m[key]),to};
  if(key==='year')return {from:to.slice(0,4)+'-01-01',to};
  return {from:'0000-01-01',to};
}
const prevRange=r=>{
  if(r.from==='0000-01-01')return null;
  const a=new Date(r.from+'T12:00:00'),b=new Date(r.to+'T12:00:00'),days=Math.round((b-a)/864e5)+1;
  return {from:addDays(r.from,-days),to:addDays(r.from,-1)};
};
const inR=(d,r)=>!!d&&d.slice(0,10)>=r.from&&d.slice(0,10)<=r.to;

/* ---------- Финансы: единые правила расчёта ----------
   Выручка  = фактически полученные поступления от продаж (статус «Оплачен»).
   Прибыль  = выручка минус фактически оплаченные расходы.
   Ожидаемые платежи считаются отдельно и никогда не входят в выручку.        */
const FINCATS={
  in:[['Оплата по сделке',true],['Продажа товаров',true],['Услуги',true],['Прочие поступления',false]],
  out:['Закупка','Зарплата','Аренда','Налоги','Маркетинг','Прочее']
};
const finCats=t=>t==='in'?FINCATS.in.map(c=>c[0]):FINCATS.out;
const isSale=f=>f.type==='in'&&(!!f.deal||(FINCATS.in.find(c=>c[0]===f.cat)||[0,false])[1]===true);
const isPaid=f=>f.st==='Оплачен';
const paidDate=f=>f.paid||f.date;
const M={
  revenue:r=>sum(fin.filter(f=>isSale(f)&&isPaid(f)&&inR(paidDate(f),r)),f=>f.sum),
  income:r=>sum(fin.filter(f=>f.type==='in'&&isPaid(f)&&inR(paidDate(f),r)),f=>f.sum),
  expenses:r=>sum(fin.filter(f=>f.type==='out'&&isPaid(f)&&inR(paidDate(f),r)),f=>f.sum),
  profit:r=>M.revenue(r)-M.expenses(r),
  pending:()=>sum(fin.filter(f=>f.type==='in'&&!isPaid(f)),f=>f.sum),
  pendingOut:()=>sum(fin.filter(f=>f.type==='out'&&!isPaid(f)),f=>f.sum),
  newClients:r=>clients.filter(c=>inR(c.added,r)).length,
  dealsWon:r=>deals.filter(d=>d.stage==='won'&&inR(d.closed||d.created,r)),
  dealsLost:r=>deals.filter(d=>d.stage==='lost'&&inR(d.closed||d.moved||d.created,r)),
  activeDeals:()=>deals.filter(d=>!['won','lost'].includes(d.stage)),
  overdueTasks:()=>tasks.filter(t=>t.status!=='Выполнена'&&t.due<iso(0)),
  todayTasks:()=>tasks.filter(t=>t.status!=='Выполнена'&&t.due===iso(0)),
  /* Долги клиентов: ожидаемые поступления, сгруппированные по клиенту */
  debts:()=>{const g={};fin.filter(f=>f.type==='in'&&!isPaid(f)).forEach(f=>{const cid=f.cid||deals.find(d=>d.id===f.deal)?.cid||0;(g[cid]=g[cid]||{cid,sum:0,items:[]}).sum+=f.sum;g[cid].items.push(f)});return Object.values(g).sort((a,b)=>b.sum-a.sum)}
};
/* Ряд «по дням» для графиков: [{d:'2026-11-01',v:число}] */
function seriesByDay(r,fn){
  const out=[];let d=r.from<'1990'?(fin.map(paidDate).concat(deals.map(x=>x.created)).sort()[0]||iso(0)).slice(0,10):r.from;
  for(let g=0;g<800&&d<=r.to;g++,d=addDays(d,1))out.push({d,v:fn(d)});
  return out;
}
/* Сжатие ряда в N корзин (для длинных периодов) */
function bucket(ser,n=12){
  if(ser.length<=n)return ser.map(x=>({l:x.d,v:x.v}));
  const step=Math.ceil(ser.length/n),o=[];
  for(let i=0;i<ser.length;i+=step){const ch=ser.slice(i,i+step);o.push({l:ch[0].d,v:sum(ch,x=>x.v)})}
  return o;
}

/* ---------- Роли и права ----------
   ВАЖНО: сейчас в систему входит только владелец аккаунта; остальные сотрудники — записи
   в справочнике без собственных учётных записей. Проверка can() скрывает недоступные действия
   в интерфейсе. Принудительная проверка на сервере (RLS по ролям) требует многопользовательской
   схемы — supabase/migrations/002_team_workspaces.sql (этап 2, не подключено к интерфейсу). */
const ROLES={
  owner:{n:'Владелец',d:'Полный доступ, включая удаление рабочего пространства и управление ролями'},
  admin:{n:'Администратор',d:'Всё, кроме управления владельцем и удаления рабочего пространства'},
  head:{n:'Руководитель',d:'Видит данные всей команды, финансы и аналитику; не меняет настройки пространства'},
  manager:{n:'Менеджер',d:'Работает со своими клиентами, сделками и задачами'},
  staff:{n:'Сотрудник',d:'Ограниченный доступ: свои задачи и просмотр клиентов'}
};
const PERMS={
  'clients.view':['owner','admin','head','manager','staff'],
  'clients.edit':['owner','admin','head','manager'],
  'clients.delete':['owner','admin','head'],
  'deals.edit':['owner','admin','head','manager'],
  'tasks.edit':['owner','admin','head','manager','staff'],
  'finance.view':['owner','admin','head'],
  'finance.edit':['owner','admin'],
  'stock.edit':['owner','admin','head','manager'],
  'staff.manage':['owner','admin'],
  'settings.manage':['owner','admin'],
  'export':['owner','admin','head'],
  'ai.use':['owner','admin','head','manager'],
  'audit.view':['owner','admin','head'],
  'trash.purge':['owner','admin']
};
const actor=()=>staff.find(s=>s.id===1)||staff[0]||{id:1,access:'owner'};
const can=(perm,who=actor())=>(PERMS[perm]||[]).includes(who.access||(who.id===1?'owner':'manager'));
const accessName=a=>(ROLES[a]||ROLES.manager).n;

/* ---------- Корзина (мягкое удаление, восстановление) ---------- */
const TRASHMAP={client:clients,deal:deals,task:tasks,product:products,fin:fin,staff:staff,auto:autos};
const TRASHKIND={client:'Клиент',deal:'Сделка',task:'Задача',product:'Товар',fin:'Операция',staff:'Сотрудник',auto:'Сценарий'};
const trashLabel=(k,x)=>({client:()=>x.name,deal:()=>x.title,task:()=>x.title,product:()=>x.name,fin:()=>x.t,staff:()=>x.name,auto:()=>x.name}[k]?.()||'Запись');
/* Убирает запись из рабочего списка и кладёт в корзину. extra — связанные данные (для клиента). */
function trashPut(kind,item,extra){
  const arr=TRASHMAP[kind];if(!arr||!item)return;
  const i=arr.indexOf(item);if(i<0)return;
  arr.splice(i,1);
  trash.unshift({id:++nid,kind,label:trashLabel(kind,item),at:Date.now(),by:actor().name,data:JSON.parse(JSON.stringify(item)),extra:extra?JSON.parse(JSON.stringify(extra)):null});
  if(trash.length>300)trash.length=300;
  log(`удалил(а): ${TRASHKIND[kind].toLowerCase()} «${trashLabel(kind,item)}»`,{ent:kind});
}
function trashRestore(id){
  const i=trash.findIndex(t=>t.id===id);if(i<0)return false;
  const t=trash[i],arr=TRASHMAP[t.kind];if(!arr)return false;
  if(arr.some(x=>x.id===t.data.id)){toast('Запись с таким номером уже существует');return false}
  arr.unshift(t.data);
  if(t.kind==='client'&&t.extra){
    (t.extra.deals||[]).forEach(d=>{if(!deals.some(x=>x.id===d.id))deals.push(d)});
    (t.extra.hist||[]).forEach(h=>hist.push(h));(t.extra.notes||[]).forEach(n=>notes.push(n));
    (t.extra.dialogs||[]).forEach(d=>dialogs.push(d));(t.extra.calls||[]).forEach(c=>calls.push(c));
    (t.extra.taskLinks||[]).forEach(id2=>{const tk=tasks.find(x=>x.id===id2);if(tk)tk.cid=t.data.id});
    (t.extra.files||[]).forEach(f=>files.push(f));
  }
  if(t.kind==='deal')(t.extra?.fin||[]).forEach(f=>{if(!fin.some(x=>x.id===f.id))fin.push(f)});
  trash.splice(i,1);
  log(`восстановил(а): ${TRASHKIND[t.kind].toLowerCase()} «${t.label}»`,{ent:t.kind});
  return true;
}
const trashPurge=id=>{const i=trash.findIndex(t=>t.id===id);if(i>=0)trash.splice(i,1)};

/* ---------- Уведомления (история событий; вычисляемые оповещения — в notifications.js) ---------- */
function notify({type='system',text,go:to=null,ent=null}){
  if(!text)return;
  nlog.unshift({id:'n'+(++nid),type,t:text,at:Date.now(),go:to,ent,read:false});
  if(nlog.length>300)nlog.length=300;
  const dot=document.getElementById('bellDot');if(dot)dot.hidden=false;
}


/* ---------- Этапы воронки по ТЗ (id не меняются — совместимость с существующими сделками) ---------- */
[['new','Новый лид','#8e8e93',10],['contact','Первый контакт','#0a84ff',20],['talk','Переговоры','#5e5ce6',40],
 ['offer','Предложение отправлено','#ff9f0a',60],['agree','Ожидание оплаты','#64d2ff',80],['won','Успешно завершено','#30d158',100],['lost','Отказ','#ff453a',0]]
 .forEach(([id,name,c])=>{const st=STAGES.find(x=>x.id===id);if(st){st.name=name;st.c=c}});

/* ---------- Нормализация данных после загрузки (обратная совместимость со старыми аккаунтами) ---------- */
const PROB={new:10,contact:20,talk:40,offer:60,agree:80,won:100,lost:0};
function afterLoad(){
  staff.forEach(s=>{if(!s.access)s.access=s.id===1?'owner':'manager'});
  deals.forEach(d=>{
    if(d.prob==null)d.prob=PROB[d.stage]??20;
    if(!d.moved)d.moved=(d.closed||d.created);
    if(!Array.isArray(d.comments))d.comments=[];
    if(!Array.isArray(d.items))d.items=[];
  });
  clients.forEach(c=>{if(!Array.isArray(c.tags))c.tags=[]});
  tasks.forEach(t=>{if(!Array.isArray(t.comments))t.comments=[]});
  products.forEach(p=>{if(p.min==null)p.min=20;if(p.cost==null)p.cost=0});
  fin.forEach(f=>{if(isPaid(f)&&!f.paid)f.paid=f.date});
  if(typeof migrateAutos==='function')migrateAutos();
  if(!templates.length)templates.push(
    {id:++nid,name:'Первый контакт',text:'Здравствуйте, {имя}! Меня зовут {менеджер}, компания «{моя_компания}». Вы оставляли заявку — подскажите, удобно сейчас обсудить детали?'},
    {id:++nid,name:'Предложение отправлено',text:'{имя}, добрый день! Отправил(а) вам коммерческое предложение. Когда сможем созвониться, чтобы ответить на вопросы?'},
    {id:++nid,name:'Напоминание об оплате',text:'{имя}, добрый день! Напоминаем про оплату по сделке. Если нужны реквизиты или закрывающие документы — пришлю.'});
}
const fillTpl=(text,c)=>String(text||'').replace(/\{имя\}/g,(c?.name||'').split(' ')[0]||'').replace(/\{компания\}/g,c?.company||'').replace(/\{менеджер\}/g,(mgrOf(c?.mgr||1).name||'').split(' ')[0]).replace(/\{моя_компания\}/g,ME.company||'');

</script>
<script>
/* Встроенный файл: assets/js/shell.js */
/* ==========================================================================
   shell.js — оболочка: навигация по группам, маршрутизация, тема, мобильная панель
   ========================================================================== */
const NAVGROUPS=[
 ['Рабочее пространство',[['home','Главная','home'],['clients','Клиенты','users'],['deals','Сделки','deal'],['tasks','Задачи','tasks'],['calendar','Календарь','cal']]],
 ['Управление',[['finance','Финансы','wallet'],['products','Склад и товары','box'],['staff','Сотрудники','team'],['messages','Сообщения','msg'],['phone','Звонки','phone'],['automation','Автоматизация','zap']]],
 ['Интеллект',[['ai','Alfa AI','spark'],['analytics','Аналитика','chart']]],
 ['Система',[['notifications','Уведомления','bell'],['activity','Журнал действий','log'],['trash','Корзина','trash'],['settings','Настройки','set']]]
];
const NAVFLAT=NAVGROUPS.flatMap(g=>g[1]);
const TITLES=Object.fromEntries(NAVFLAT.map(n=>[n[0],n[1]]));

function navBadge(id){
  if(id==='messages'){const n=dialogs.reduce((a,d)=>a+d.unread,0);return n?`<span class="badge">${n}</span>`:''}
  if(id==='tasks'){const n=M.overdueTasks().length;return n?`<span class="badge" title="Просроченные задачи">${n}</span>`:''}
  if(id==='notifications'){const n=typeof unreadCount==='function'?unreadCount():0;return n?`<span class="badge">${n>99?'99+':n}</span>`:''}
  return '';
}
function drawNav(){
  $('#nav').innerHTML=NAVGROUPS.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(n=>`<button data-go="${n[0]}" class="${n[0]===cur?'on':''}" ${n[0]===cur?'aria-current="page"':''}>${ico(n[2])}<span>${n[1]}</span>${navBadge(n[0])}</button>`).join('')).join('');
  const tabs=[['home','Главная','home'],['clients','Клиенты','users'],['deals','Сделки','deal'],['tasks','Задачи','tasks']];
  $('#tabbar').innerHTML=tabs.map(n=>`<button data-go="${n[0]}" class="${n[0]===cur?'on':''}" aria-label="${n[1]}">${ico(n[2])}<span>${n[1]}</span>${navBadge(n[0])?`<i class="badge">${M.overdueTasks().length}</i>`:''}</button>`).join('')
    +`<button data-act="openMenu" aria-label="Все разделы" class="${tabs.some(t=>t[0]===cur)?'':'on'}">${ico('menu')}<span>Ещё</span></button>`;
  const pu=$('#planU');if(pu)pu.textContent=staff.length;
  const dot=$('#bellDot');if(dot&&typeof unreadCount==='function')dot.hidden=!unreadCount();
}
A.openMenu=()=>openSide();

const errorState=(e,retry)=>`<div class="card">${emptyState('alert','Не удалось открыть раздел','Произошла ошибка при отображении. Остальные разделы работают, данные не затронуты.',`<button class="btn pri" data-act="retryView">Повторить</button>`)}<details style="text-align:center;color:var(--dim);font-size:12px"><summary>Подробности</summary>${esc(e?.message||e)}</details></div>`;
A.retryView=()=>go(cur);

function go(name){
  if(!V[name])name='home';
  cur=name;
  if(location.hash!=='#'+name)history.replaceState(null,'','#'+name);
  $$('#nav button,#tabbar button[data-go]').forEach(b=>{const on=b.dataset.go===name;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  $('#main').innerHTML='<div class="view" id="view"></div>';
  try{const r=V[name]();if(r&&typeof r.catch==='function')r.catch(e=>{console.error('view',name,e);$('#view').innerHTML=errorState(e)})}
  catch(e){console.error('view',name,e);$('#view').innerHTML=errorState(e)}
  $('#main').scrollTop=0;closeSide();
  document.title=(TITLES[name]||'alfa+')+' · alfa+ CRM';
  drawNav();
}

/* ---------- Тема: система / светлая / тёмная ---------- */
const effTheme=()=>theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;
function setTheme(t){
  if(!['system','light','dark'].includes(t))t='system';
  theme=t;
  if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  $('#themeIc')?.setAttribute('href',effTheme()==='dark'?'#i-sun':'#i-moon');
  try{localStorage.setItem('vexon-theme',t)}catch(e){}
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')setTheme('system')});

function hideSplash(){const s=document.getElementById('splash');if(!s)return;s.classList.add('out');setTimeout(()=>s.remove(),350)}

/* ---------- paintShell: добавляем название пространства в боковую карточку ---------- */
const _paintShell=paintShell;
paintShell=function(){_paintShell();const c=$('#coName2');if(c)c.textContent=ME.company||'Моя компания'};

</script>
<script>
/* Встроенный файл: assets/js/palette.js */
/* ==========================================================================
   palette.js — глобальный поиск и команды (Ctrl+K / Cmd+K)
   Ищет по: клиентам, сделкам, задачам, сотрудникам, товарам, документам (файлы клиентов и заметки).
   ========================================================================== */
const PAL={sel:0,items:[]};
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
const hit=(hay,q)=>{const h=norm(hay);return q.split(/\s+/).filter(Boolean).every(w=>h.includes(w))};

function paletteCommands(){
  const c=[
    ['Создать клиента','plus',()=>go('clients')||clientForm()],
    ['Создать сделку','plus',()=>dealForm()],
    ['Создать задачу','plus',()=>taskForm()],
    ['Добавить операцию','wallet',()=>{go('finance');A.newFin()}],
    ['Открыть Alfa AI','spark',()=>go('ai')],
    ['Переключить тему','sun',()=>setTheme(effTheme()==='dark'?'light':'dark')]
  ].map(([t,i,run])=>({g:'Команды',icon:i,t,s:'',run}));
  NAVFLAT.forEach(n=>c.push({g:'Разделы',icon:n[2],t:n[1],s:'Перейти',run:()=>go(n[0])}));
  return c;
}
function paletteSearch(q){
  q=norm(q).trim();
  const out=[],push=(a,n=5)=>a.slice(0,n).forEach(x=>out.push(x));
  if(!q){push(paletteCommands().filter(x=>x.g==='Команды'),6);push(paletteCommands().filter(x=>x.g==='Разделы'),6);return out}
  push(clients.filter(c=>hit([c.name,c.company,c.email,c.phone,(c.tags||[]).join(' ')].join(' '),q)).map(c=>({g:'Клиенты',icon:'users',t:c.name,s:c.company,run:()=>openClient(c.id)})));
  push(deals.filter(d=>hit([d.title,cliOf(d.cid)?.name].join(' '),q)).map(d=>({g:'Сделки',icon:'deal',t:d.title,s:rub(d.sum),run:()=>openDeal(d.id)})));
  push(tasks.filter(t=>hit(t.title+' '+(t.desc||''),q)).map(t=>({g:'Задачи',icon:'tasks',t:t.title,s:fd(t.due),run:()=>openTask(t.id)})));
  push(staff.filter(s=>hit([s.name,s.role,s.email].join(' '),q)).map(s=>({g:'Сотрудники',icon:'team',t:s.name,s:s.role,run:()=>go('staff')})));
  push(products.filter(p=>hit(p.name+' '+p.sku,q)).map(p=>({g:'Товары',icon:'box',t:p.name,s:p.sku,run:()=>go('products')})));
  push([
    ...files.filter(f=>hit(f.name,q)).map(f=>({g:'Документы',icon:'file',t:f.name,s:'Файл · '+(cliOf(f.cid)?.name||''),run:()=>openClient(f.cid,'files')})),
    ...notes.filter(n=>hit(n.t,q)).map(n=>({g:'Документы',icon:'file',t:n.t.slice(0,70),s:'Заметка · '+(cliOf(n.cid)?.name||''),run:()=>openClient(n.cid,'notes')}))
  ],5);
  push(paletteCommands().filter(x=>hit(x.t,q)),5);
  return out;
}
function paletteDraw(){
  const box=$('#pl');if(!box)return;
  const items=PAL.items;
  if(!items.length){box.innerHTML=emptyState('search','Ничего не найдено','Попробуйте другое слово: имя клиента, название сделки, артикул.');return}
  let last='',h='';
  items.forEach((x,i)=>{if(x.g!==last){h+=`<div class="pal-g">${x.g}</div>`;last=x.g}
    h+=`<button role="option" id="po${i}" class="pal-it ${i===PAL.sel?'on':''}" data-i="${i}" aria-selected="${i===PAL.sel}"><span class="pal-ic">${ico(x.icon)}</span><span class="pal-t">${esc(x.t)}</span><small>${esc(x.s)}</small></button>`});
  box.innerHTML=h;
  $('#pq')?.setAttribute('aria-activedescendant','po'+PAL.sel);
  $('.pal-it.on',box)?.scrollIntoView({block:'nearest'});
}
function paletteRun(i){const x=PAL.items[i];if(!x)return;closePalette();setTimeout(()=>x.run(),10)}
function closePalette(){const o=$('#pal');if(o){o.classList.add('out');setTimeout(()=>o.remove(),160)}}
function openPalette(q=''){
  if($('#pal')||$('#app').hidden)return;
  const ov=document.createElement('div');ov.className='pal-ov';ov.id='pal';
  ov.innerHTML=`<div class="palette" role="dialog" aria-modal="true" aria-label="Поиск и команды"><div class="pal-in">${ico('search')}<input id="pq" placeholder="Поиск клиентов, сделок, задач, товаров или команда…" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="pl" aria-label="Поиск"><kbd>Esc</kbd></div><div class="pal-list" id="pl" role="listbox"></div><div class="pal-ft"><span><kbd>↑</kbd><kbd>↓</kbd> выбор</span><span><kbd>↵</kbd> открыть</span><span><kbd>Esc</kbd> закрыть</span></div></div>`;
  document.body.appendChild(ov);
  const inp=$('#pq');inp.value=q;
  const upd=()=>{PAL.items=paletteSearch(inp.value);PAL.sel=0;paletteDraw()};
  inp.oninput=upd;upd();inp.focus();
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closePalette()});
  $('#pl').addEventListener('click',e=>{const b=e.target.closest('.pal-it');if(b)paletteRun(+b.dataset.i)});
  $('#pl').addEventListener('mousemove',e=>{const b=e.target.closest('.pal-it');if(b&&+b.dataset.i!==PAL.sel){PAL.sel=+b.dataset.i;paletteDraw()}});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();PAL.sel=Math.min(PAL.items.length-1,PAL.sel+1);paletteDraw()}
    else if(e.key==='ArrowUp'){e.preventDefault();PAL.sel=Math.max(0,PAL.sel-1);paletteDraw()}
    else if(e.key==='Enter'){e.preventDefault();paletteRun(PAL.sel)}
    else if(e.key==='Escape'){e.preventDefault();closePalette()}
  });
}
/* Старый поиск в верхней панели заменён палитрой */
function gsearch(q){openPalette(q)}

</script>
<script>
/* Встроенный файл: assets/js/dashboard.js */
/* ==========================================================================
   dashboard.js — Главная (14 виджетов, период, перестановка, скрытие) и Аналитика.
   Все цифры считаются из реальных данных через M.* (foundation.js).
   Настройка хранится в ME.dash = {period, order[], hidden[]} и сохраняется вместе с рабочим пространством.
   ========================================================================== */
const kfmt=v=>{v=+v||0;const a=Math.abs(v);return a>=1e6?(+(v/1e6).toFixed(1)+'').replace('.',',')+' млн':a>=1e3?Math.round(v/1e3)+' тыс':Math.round(v)+''};
const monthStart=()=>iso(0).slice(0,8)+'01';
const DSH={edit:false};
const dshCfg=()=>{const d=ME.dash=ME.dash&&typeof ME.dash==='object'?ME.dash:{};if(!d.period)d.period='30d';if(!Array.isArray(d.order))d.order=[];if(!Array.isArray(d.hidden))d.hidden=[];return d};
const dltHtml=(cur,prev,good=1)=>{if(!prev||prev<=0)return '';const p=Math.round((cur-prev)/prev*100);if(!p)return '<div class="d mut">без изменений к прошлому периоду</div>';const up=p>0;return `<div class="d ${(up?good:-good)>0?'up':'down'}">${up?'▲':'▼'} ${Math.abs(p)}% <span class="mut">к прошлому периоду</span></div>`};
const periodName=k=>(PERIODS.find(p=>p[0]===k)||[0,''])[1].toLowerCase();

/* Ряд «по дням» → корзины для графика */
function dshSeries(r,fn){
  const ser=bucket(seriesByDay(r,fn),12);
  return {vals:ser.map(x=>x.v),labels:ser.map(x=>fd(x.l))};
}
const dshChart=(r,fn,color)=>{
  const s=dshSeries(r,fn);
  if(!s.vals.some(v=>v>0))return emptyState('chart','Нет данных за период','Данные появятся, когда будут оплаченные операции.');
  return areaChart(s.vals,s.labels,{fmt:kfmt,color,unit:' ₽'});
};
const dkpi=(l,v,ic,extra='',go_)=>`<div class="card kpi ${go_?'click':''}" ${go_?`data-go="${go_}"`:''}><div class="ic">${ico(ic)}</div><div class="l">${l}</div><div class="v">${v}</div>${extra}</div>`;

/* ---------- Виджеты ---------- */
const DW=[
 {id:'revToday',t:'Выручка сегодня',s:1,r:()=>{const r=periodRange('today');return dkpi('Выручка сегодня',rub(M.revenue(r)),'wallet','<div class="d mut">получено оплатами</div>','finance')}},
 {id:'revWeek',t:'Выручка за неделю',s:1,r:()=>{const r=periodRange('7d');return dkpi('Выручка за 7 дней',rub(M.revenue(r)),'wallet',(prevRange(r)?dltHtml(M.revenue(r),M.revenue(prevRange(r))):''),'finance')}},
 {id:'revMonth',t:'Выручка за месяц',s:1,r:()=>{const r={from:monthStart(),to:iso(0)};return dkpi('Выручка с начала месяца',rub(M.revenue(r)),'wallet',`<div class="d mut">ожидается ещё ${rub(M.pending())}</div>`,'finance')}},
 {id:'profit',t:'Прибыль',s:1,r:(r)=>dkpi('Чистая прибыль · '+periodName(DSHP()),rub(M.profit(r)),'trend',(prevRange(r)?dltHtml(M.profit(r),M.profit(prevRange(r))):''),'finance')},
 {id:'clients',t:'Клиентов всего',s:1,r:()=>dkpi('Клиентов',clients.length,'users','','clients')},
 {id:'newClients',t:'Новые клиенты',s:1,r:(r)=>{const n=M.newClients(r),p=prevRange(r);return dkpi('Новые клиенты · '+periodName(DSHP()),n,'user',p?dltHtml(n,M.newClients(p)):'','clients')}},
 {id:'activeDeals',t:'Активные сделки',s:1,r:()=>{const a=M.activeDeals();return dkpi('Активные сделки',a.length,'deal',`<div class="d mut">на ${rub(sum(a,d=>d.sum))}</div>`,'deals')}},
 {id:'overdue',t:'Просроченные задачи',s:1,r:()=>{const n=M.overdueTasks().length;return dkpi('Просроченные задачи',n,'alert',`<div class="d ${n?'down':'up'}">${n?'Требуют внимания':'Всё в срок'}</div>`,'tasks')}},
 {id:'income',t:'График доходов',s:2,r:(r)=>`<div class="card"><h3>Доходы <small class="mut">${periodName(DSHP())}</small></h3>${dshChart(r,d=>M.income({from:d,to:d}),'--c1')}</div>`},
 {id:'expenses',t:'График расходов',s:2,r:(r)=>`<div class="card"><h3>Расходы <small class="mut">${periodName(DSHP())}</small></h3>${dshChart(r,d=>M.expenses({from:d,to:d}),'--c4')}</div>`},
 {id:'funnel',t:'Воронка продаж',s:2,r:()=>{
   const st=STAGES.filter(s=>s.id!=='lost'),cnt=st.map(s=>deals.filter(d=>d.stage===s.id)),base=Math.max(1,...cnt.map(c=>c.length));
   return `<div class="card"><h3>Воронка продаж<button class="btn sm" data-go="deals">Открыть</button></h3>${deals.length?`<div class="funnel">${st.map((s,i)=>`<div><span>${esc(s.name)}</span><div class="b" style="width:${Math.max(Math.round(cnt[i].length/base*100),8)}%;background:${s.c}">${cnt[i].length} · ${kfmt(sum(cnt[i],d=>d.sum))} ₽</div></div>`).join('')}</div>`:emptyState('deal','Сделок пока нет','Создайте первую сделку, чтобы увидеть воронку.')}</div>`}},
 {id:'activity',t:'Последние действия',s:2,r:()=>`<div class="card"><h3>Последние действия сотрудников<button class="btn sm" data-go="activity">Журнал</button></h3><div class="list">${activity.length?activity.slice(0,7).map(a=>`<div class="row">${av(a.mgr)}<div class="grow" style="white-space:normal"><b style="white-space:normal;font-weight:400"><b style="display:inline">${esc(mgrOf(a.mgr).name.split(' ')[0])}</b> ${esc(a.t)}</b><small>${a.at?esc(relTime(a.at)):esc(a.ago||'')}</small></div></div>`).join(''):emptyState('log','Пока тихо','Здесь появятся действия команды.')}</div></div>`},
 {id:'todayTasks',t:'Задачи на сегодня',s:2,r:()=>{const l=[...M.overdueTasks(),...M.todayTasks()].slice(0,7);
   return `<div class="card"><h3>Задачи на сегодня<button class="btn sm" data-go="tasks">Все</button></h3><div class="list">${l.length?l.map(t=>`<div class="row"><button class="chk" data-act="tcheck" data-id="${t.id}" aria-label="Выполнить"></button><div class="grow"><b>${esc(t.title)}</b><small class="${t.due<iso(0)?'down':''}">${t.due<iso(0)?'Просрочено · ':''}${tkDate(t.due)} · ${esc(mgrOf(t.mgr).name)}</small></div>${ppill(t.prio)}</div>`).join(''):emptyState('check','На сегодня задач нет','Просроченных тоже нет.')}</div></div>`}},
 {id:'recentClients',t:'Новые клиенты (список)',s:2,r:()=>{const l=[...clients].sort((a,b)=>(b.added||'').localeCompare(a.added||'')||b.id-a.id).slice(0,6);
   return `<div class="card"><h3>Последние добавленные клиенты<button class="btn sm" data-go="clients">Все</button></h3><div class="list">${l.length?l.map(c=>`<div class="row click" data-act="client" data-id="${c.id}"><span class="av s" style="background:${COLORS[c.id%8]}">${ini(c.name)}</span><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.company||'')} · ${fd(c.added)}</small></div>${cpill(c.status)}</div>`).join(''):emptyState('users','Клиентов пока нет','',`<button class="btn pri" data-act="newClient">Добавить клиента</button>`)}</div></div>`}}
];
const DSHP=()=>dshCfg().period;
function dshOrder(){
  const c=dshCfg(),ids=DW.map(w=>w.id),o=c.order.filter(i=>ids.includes(i));ids.forEach(i=>{if(!o.includes(i))o.push(i)});return o;
}

V.home=()=>{
  const c=dshCfg(),r=periodRange(c.period),hr=new Date().getHours();
  const order=dshOrder(),vis=order.filter(i=>!c.hidden.includes(i)),hid=order.filter(i=>c.hidden.includes(i));
  const wrap=id=>{const w=DW.find(x=>x.id===id);let h;try{h=w.r(r)}catch(e){console.error('widget',id,e);h=`<div class="card">${emptyState('alert','Не удалось построить блок «'+w.t+'»')}</div>`}
    return `<div class="dw dw-${w.s} ${DSH.edit?'edit':''}" data-w="${id}" ${DSH.edit?'draggable="true"':''}>${DSH.edit?`<div class="dw-bar"><span class="dw-grip">${ico('grip')}</span><b>${esc(w.t)}</b><button class="ibtn" data-act="dwMove" data-w="${id}" data-d="-1" aria-label="Выше">↑</button><button class="ibtn" data-act="dwMove" data-w="${id}" data-d="1" aria-label="Ниже">↓</button><button class="ibtn" data-act="dwHide" data-w="${id}" aria-label="Скрыть">${ico('eyeoff')}</button></div>`:''}${h}</div>`};
  $('#view').innerHTML=`<div class="ph"><div><h1>${hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер'}, ${esc((ME.name||'').split(' ')[0])}</h1><p>Сводка на ${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})} · период графиков и прибыли: ${periodName(c.period)}</p></div>
   <div class="acts"><select id="dper" aria-label="Период">${PERIODS.map(p=>`<option value="${p[0]}" ${c.period===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select><button class="btn ${DSH.edit?'pri':''}" data-act="dwEdit">${ico('sliders')}${DSH.edit?'Готово':'Настроить'}</button><button class="btn" data-act="newTask">${ico('plus')}Задача</button><button class="btn pri" data-act="newDeal">${ico('plus')}Сделка</button></div></div>
   ${!clients.length&&!deals.length&&!tasks.length?firstSteps():''}
   ${DSH.edit?`<div class="card dw-help">Перетаскивайте блоки или используйте стрелки, скрывайте ненужные. Настройка сохраняется для вашего рабочего пространства.${hid.length?`<div class="dw-hid">Скрыто: ${hid.map(i=>`<button class="btn sm" data-act="dwShow" data-w="${i}">${ico('plus')}${esc(DW.find(w=>w.id===i).t)}</button>`).join('')}</div>`:''}<button class="btn sm" data-act="dwReset" style="margin-top:8px">Сбросить расположение</button></div>`:''}
   <div class="dgrid" id="dgrid">${vis.map(wrap).join('')||`<div class="card" style="grid-column:1/-1">${emptyState('layout','Все блоки скрыты','Нажмите «Настроить», чтобы вернуть нужные.')}</div>`}</div>`;
  $('#dper').onchange=e=>{c.period=e.target.value;persist();V.home()};
  if(DSH.edit){
    let drag=null;
    $$('.dw').forEach(el=>{el.ondragstart=e=>{drag=el.dataset.w;el.classList.add('drag');e.dataTransfer.setData('text/plain',drag);e.dataTransfer.effectAllowed='move'};el.ondragend=()=>el.classList.remove('drag');
      el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');
      el.ondrop=e=>{e.preventDefault();const to=el.dataset.w;if(!drag||drag===to)return;const o=dshOrder();o.splice(o.indexOf(drag),1);o.splice(o.indexOf(to),0,drag);c.order=o;persist();V.home()}});
  }
};
A.dwEdit=()=>{DSH.edit=!DSH.edit;V.home()};
A.dwHide=b=>{const c=dshCfg();if(!c.hidden.includes(b.dataset.w))c.hidden.push(b.dataset.w);persist();V.home()};
A.dwShow=b=>{const c=dshCfg();c.hidden=c.hidden.filter(x=>x!==b.dataset.w);persist();V.home()};
A.dwReset=()=>{const c=dshCfg();c.order=[];c.hidden=[];persist();V.home()};
A.dwMove=b=>{const c=dshCfg(),vis=dshOrder().filter(i=>!c.hidden.includes(i)),id=b.dataset.w,i=vis.indexOf(id),j=i+(+b.dataset.d);if(j<0||j>=vis.length)return;
  const full=dshOrder();full.splice(full.indexOf(id),1);full.splice(full.indexOf(vis[j])+(+b.dataset.d>0?1:0),0,id);c.order=full;persist();V.home()};

/* ==========================================================================
   Аналитика (реальные данные; план продаж не показываем — планов в системе нет)
   ========================================================================== */
V.analytics=()=>{
  const c=dshCfg(),r=periodRange(c.period),pr=prevRange(r);
  const won=M.dealsWon(r),lost=M.dealsLost(r),rev=M.revenue(r),exp=M.expenses(r);
  const created=deals.filter(d=>inR(d.created,r));
  const conv=pct(won.length,won.length+lost.length);
  const per=dshSeries(r,d=>M.revenue({from:d,to:d})),per2=dshSeries(r,d=>M.expenses({from:d,to:d}));
  const hasFin=per.vals.some(v=>v>0)||per2.vals.some(v=>v>0);
  const src={};clients.filter(x=>inR(x.added,r)).forEach(x=>src[x.source||'Не указан']=(src[x.source||'Не указан']||0)+1);
  const lr={};lost.forEach(d=>lr[d.lossReason||'Не указана']=(lr[d.lossReason||'Не указана']||0)+1);
  const mg=staff.map(s=>{const w=won.filter(d=>d.mgr===s.id);const l=lost.filter(d=>d.mgr===s.id);return {s,won:w.length,sum:sum(w,d=>d.sum),lost:l.length,act:deals.filter(d=>d.mgr===s.id&&!['won','lost'].includes(d.stage)).length,od:tasks.filter(t=>t.mgr===s.id&&tkLate(t)).length,conv:pct(w.length,w.length+l.length)}}).filter(m=>m.won||m.lost||m.act||m.od);
  const st=STAGES.filter(s=>s.id!=='lost'),base=Math.max(1,deals.length);
  $('#view').innerHTML=`<div class="ph"><div><h1>Аналитика</h1><p>Период: ${periodName(c.period)}. Данные считаются из ваших сделок, клиентов и оплаченных операций.</p></div><div class="acts"><select id="aper" aria-label="Период">${PERIODS.map(p=>`<option value="${p[0]}" ${c.period===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>${typeof exportButtons==='function'?exportButtons('finance'):''}</div></div>
  <div class="grid g4" style="margin-bottom:16px">
   ${dkpi('Выручка',rub(rev),'wallet',dltHtml(rev,pr?M.revenue(pr):0))}${dkpi('Прибыль',rub(rev-exp),'trend','<div class="d mut">выручка − расходы</div>')}
   ${dkpi('Средний чек',won.length?rub(Math.round(sum(won,d=>d.sum)/won.length)):'—','chart',`<div class="d mut">по ${won.length} выигранным сделкам</div>`)}${dkpi('Конверсия',won.length+lost.length?conv+'%':'—','deal',`<div class="d mut">выиграно ${won.length}, отказов ${lost.length}</div>`)}</div>
  <div class="grid g2">
   <div class="card"><h3>Выручка и расходы по периодам, ₽</h3>${hasFin?barChart([{n:'Выручка',v:per.vals},{n:'Расходы',v:per2.vals}],per.labels.map(l=>l.slice(0,5)),{fmt:kfmt,colors:['--c1','--c4']}):emptyState('chart','Нет оплаченных операций','За выбранный период ничего не оплачено.')}</div>
   <div class="card"><h3>Воронка сейчас</h3><div class="funnel">${st.map(s=>{const n=deals.filter(d=>d.stage===s.id).length;return `<div><span>${esc(s.name)}</span><div class="b" style="width:${Math.max(Math.round(n/base*100),8)}%;background:${s.c}">${n} · ${pct(n,base)}%</div></div>`}).join('')}</div></div>
   <div class="card"><h3>Источники новых клиентов</h3>${Object.keys(src).length?donut(Object.entries(src),0,{center:'клиентов'}):emptyState('users','Новых клиентов нет','За выбранный период клиенты не добавлялись.')}</div>
   <div class="card"><h3>Причины отказов</h3>${Object.keys(lr).length?donut(Object.entries(lr),0,{center:'отказов'}):emptyState('x','Отказов нет','Причины появятся, когда сделки будут отмечены как отказ.')}</div>
   <div class="card" style="grid-column:1/-1"><h3>Результаты сотрудников</h3>${mg.length?`<div class="tw"><table><thead><tr><th>Сотрудник</th><th class="r">Выиграно</th><th class="r">Сумма</th><th class="r">Отказов</th><th class="r">Конверсия</th><th class="r">В работе</th><th class="r">Просрочено задач</th></tr></thead><tbody>${mg.map(m=>`<tr><td>${person(m.s.id)}</td><td class="r">${m.won}</td><td class="r">${rub(m.sum)}</td><td class="r">${m.lost}</td><td class="r">${m.won+m.lost?m.conv+'%':'—'}</td><td class="r">${m.act}</td><td class="r ${m.od?'down':''}">${m.od}</td></tr>`).join('')}</tbody></table></div>`:emptyState('user','Нет данных по сотрудникам')}</div>
  </div><p class="nt-note">Новых сделок создано за период: ${created.length}. План продаж в системе не ведётся, поэтому сравнение «план — факт» не показывается.</p>`;
  $('#aper').onchange=e=>{c.period=e.target.value;persist();V.analytics()};
};

</script>
<script>
/* Встроенный файл: assets/js/finance.js */
/* ==========================================================================
   finance.js — раздел «Финансы» (V.finance)
   Вкладки: Обзор · Транзакции · Долги клиентов · Категории · Аналитика.
   Все итоговые цифры берутся из M (foundation.js): M.revenue/expenses/profit/income/
   pending/pendingOut/debts. Здесь формулы выручки и прибыли НЕ дублируются; группировки
   по клиентам/источникам строятся на тех же признаках isSale/isPaid/paidDate.
   Пользовательские категории: ME.fcats={in:[{n,sale}],out:[{n}]}; для учёта в M.revenue
   они синхронизируются в FINCATS (см. fnSyncCats), запись дополнительно получает f.sale.
   ========================================================================== */
const FNS={tab:'ov',period:'30d',from:'',to:'',q:'',type:'',cat:'',st:'',cid:'',sort:'date',dir:-1,loaded:false};
const FN_TABS=[['ov','Обзор'],['tx','Транзакции'],['debts','Долги клиентов'],['cats','Категории'],['an','Аналитика']];
const FN_BASE={in:FINCATS.in.slice(),out:FINCATS.out.slice()};
const fnCanEdit=()=>can('finance.edit');
const fnCid=f=>f.cid||deals.find(d=>d.id===f.deal)?.cid||0;
const fnDate=f=>isPaid(f)?paidDate(f):f.date;
const fnISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(new Date(s+'T12:00:00'));
const fnNum=s=>{const n=parseFloat(String(s??'').replace(',','.').replace(/\s/g,''));return Number.isFinite(n)?n:NaN};
const fnShort=v=>v>=1e6?(v/1e6).toFixed(v>=1e7?0:1).replace('.',',')+' млн':v>=1e3?Math.round(v/1e3)+' тыс':String(Math.round(v));
const fnDaysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

/* ---------- Категории ---------- */
function fnCustom(){if(!ME.fcats||typeof ME.fcats!=='object')ME.fcats={in:[],out:[]};['in','out'].forEach(t=>{if(!Array.isArray(ME.fcats[t]))ME.fcats[t]=[]});return ME.fcats}
/* Приводим FINCATS (его читает M.revenue через isSale) к базовые + пользовательские */
function fnSyncCats(){
  const c=fnCustom();
  FINCATS.in.splice(0,FINCATS.in.length,...FN_BASE.in,...c.in.map(x=>[x.n,!!x.sale]));
  FINCATS.out.splice(0,FINCATS.out.length,...FN_BASE.out,...c.out.map(x=>x.n));
}
const _fnAfterLoad=typeof afterLoad==='function'?afterLoad:null;
if(_fnAfterLoad)afterLoad=function(){_fnAfterLoad();fnSyncCats();fin.forEach(fnApplySale)};
const fnBaseNames=t=>t==='in'?FN_BASE.in.map(c=>c[0]):FN_BASE.out.slice();
const fnCustomNames=t=>fnCustom()[t].map(x=>x.n);
const fnUsed=(t,n)=>fin.filter(f=>f.type===t&&f.cat===n).length;
/* Все категории типа: базовые, пользовательские и «сироты» из записей */
function fnAllCats(t){
  const l=[...fnBaseNames(t),...fnCustomNames(t)];
  fin.forEach(f=>{if(f.type===t&&f.cat&&!l.includes(f.cat))l.push(f.cat)});
  return l;
}
const fnCatSale=(t,n)=>t==='in'&&((FINCATS.in.find(c=>c[0]===n)||[0,false])[1]===true);
function fnApplySale(f){const c=fnCustom().in.find(x=>x.n===f.cat);if(f.type==='in'&&c&&c.sale)f.sale=true;else delete f.sale}

/* ---------- Период ---------- */
function fnRange(){
  if(FNS.period==='custom'&&fnISO(FNS.from)&&fnISO(FNS.to))return {from:FNS.from,to:FNS.to};
  return periodRange(FNS.period==='custom'?'30d':FNS.period);
}
const fnRangeLabel=r=>r.from==='0000-01-01'?'за всё время':fdf(r.from)+' — '+fdf(r.to);
function fnPeriodBar(){
  const r=fnRange(),all=r.from==='0000-01-01';
  return `<div class="tools fn-period"><select data-fn="period" aria-label="Период">${PERIODS.map(p=>`<option value="${p[0]}" ${FNS.period===p[0]?'selected':''}>${p[1]}</option>`).join('')}<option value="custom" ${FNS.period==='custom'?'selected':''}>Свой период</option></select>
  <input type="date" data-fn="from" value="${all?'':r.from}" aria-label="С даты"><span class="mut">—</span><input type="date" data-fn="to" value="${all?'':r.to}" aria-label="По дату"><span class="mut fn-rl">${esc(fnRangeLabel(r))}</span></div>`;
}

/* ---------- Раздел ---------- */
V.finance=()=>{
  if(!can('finance.view')){
    $('#view').innerHTML=`<div class="ph"><div><h1>Финансы</h1></div></div><div class="card">${emptyState('lock','Нет доступа','Раздел «Финансы» доступен владельцу, администратору и руководителю. Обратитесь к владельцу пространства.')}</div>`;
    return;
  }
  fnSyncCats();
  $('#view').innerHTML=`<div class="ph"><div><h1>Финансы</h1><p>Выручка — это фактически полученные оплаты от продаж. Ожидаемые платежи учитываются отдельно.</p></div>
    <div class="acts">${typeof exportButtons==='function'?exportButtons('finance'):''}${fnCanEdit()?`<button class="btn pri" data-act="newFin">${ico('plus')}Добавить операцию</button>`:''}</div></div>
    <div class="tabs fn-tabs" role="tablist" id="fnTabs"></div><div id="fnBody" class="fn">${skeleton(4,110)}</div>`;
  fnTabs();
  if(FNS.loaded)fnDraw();else setTimeout(()=>{FNS.loaded=true;if($('#fnBody'))fnDraw()},60);
};
function fnTabs(){
  const n=M.debts().length;
  $('#fnTabs').innerHTML=FN_TABS.map(([k,l])=>`<button role="tab" data-act="fnTab" data-k="${k}" class="${FNS.tab===k?'on':''}" aria-selected="${FNS.tab===k}">${l}${k==='debts'&&n?` <span class="pill warn fn-cnt">${n}</span>`:''}</button>`).join('');
}
A.fnTab=b=>{FNS.tab=b.dataset.k;fnTabs();fnDraw()};
function fnDraw(){
  const el=$('#fnBody');if(!el)return;
  try{el.innerHTML={ov:fnOverview,tx:fnTx,debts:fnDebts,cats:fnCatsTab,an:fnAnalytics}[FNS.tab]()}
  catch(e){console.error('finance',e);el.innerHTML=errorState(e)}
  if(FNS.tab==='tx')fnDrawList();
  fnTabs();
}
const fnRefresh=()=>{if($('#fnBody'))fnDraw()};

/* ---------- Обзор ---------- */
function fnDelta(cur,prev,inv){
  if(prev==null)return '';
  if(!prev&&!cur)return `<span class="mut">без изменений</span>`;
  if(!prev)return `<span class="mut">в прошлом периоде: 0</span>`;
  const d=Math.round((cur-prev)/Math.abs(prev)*100),good=inv?d<=0:d>=0;
  return `<span class="${d===0?'mut':good?'up':'down'}">${d>0?'+':d<0?'−':''}${Math.abs(d)}%</span><span class="mut">к пред. периоду</span>`;
}
function fnKpi(l,v,d,ic,cls=''){return `<div class="kpi card ${cls}"><div class="ic">${ico(ic)}</div><div class="l">${l}</div><div class="v num">${v}</div><div class="d">${d}</div></div>`}
function fnOverview(){
  const r=fnRange(),pr=prevRange(r),rev=M.revenue(r),exp=M.expenses(r),prof=M.profit(r);
  const P=pr?{rev:M.revenue(pr),exp:M.expenses(pr),prof:M.profit(pr)}:null;
  const pend=M.pending(),pendOut=M.pendingOut(),other=M.income(r)-rev;
  const sr=seriesByDay(r,d=>M.revenue({from:d,to:d})),se=seriesByDay(r,d=>M.expenses({from:d,to:d}));
  const br=bucket(sr,12),be=bucket(se,12),has=br.some(x=>x.v)||be.some(x=>x.v);
  const g={};fin.filter(f=>f.type==='out'&&isPaid(f)&&inR(paidDate(f),r)).forEach(f=>g[f.cat||'Без категории']=(g[f.cat||'Без категории']||0)+f.sum);
  const rows=Object.entries(g).sort((a,b)=>b[1]-a[1]),top=rows.slice(0,5),rest=sum(rows.slice(5),x=>x[1]);
  if(rest)top.push(['Остальные',rest]);
  const mx=Math.max(1,...top.map(x=>x[1]));
  return fnPeriodBar()+`
  <div class="grid g4 fn-kpis">
    ${fnKpi('Выручка (получено от продаж)',rub(rev),fnDelta(rev,P&&P.rev),'in')}
    ${fnKpi('Расходы (оплачено)',rub(exp),fnDelta(exp,P&&P.exp,true),'out')}
    ${fnKpi('Чистая прибыль',`<span class="${prof<0?'down':''}">${prof<0?'−':''}${rub(Math.abs(prof))}</span>`,fnDelta(prof,P&&P.prof),'trend')}
    ${fnKpi('Маржа',rev?pct(prof,rev)+'%':'—',`<span class="mut">${rev?'прибыль / выручка':'нет выручки за период'}</span>`,'chart')}
  </div>
  <div class="grid g2 fn-pend">
    ${fnKpi('Ожидается к получению',rub(pend),`<span class="mut">не входит в выручку и прибыль</span>`,'clock','fn-soft')}
    ${fnKpi('Ожидается к оплате',rub(pendOut),`<span class="mut">не вычтено из прибыли до оплаты</span>`,'clock','fn-soft')}
  </div>
  ${other>0?`<p class="fn-note">${ico('alert')}Прочие поступления за период: <b class="num">${rub(other)}</b> — это не продажи, в выручку они не входят.</p>`:''}
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Доходы и расходы</h3><p class="mut fn-sub">Фактически полученное и оплаченное, ${esc(fnRangeLabel(r))}</p>
      ${has?`${barChart([{n:'Выручка',v:br.map(x=>x.v)},{n:'Расходы',v:be.map(x=>x.v)}],br.map(x=>fd(x.l)),{fmt:fnShort,colors:['--c3','--c5']})}<div class="legend"><span><i style="background:var(--c3)"></i>Выручка</span><span><i style="background:var(--c5)"></i>Расходы</span></div>`:emptyState('chart','Нет движений за период','Оплаченных поступлений и расходов в выбранном периоде нет.')}</div>
    <div class="card"><h3>Структура расходов</h3><p class="mut fn-sub">По категориям, оплаченные расходы</p>
      ${top.length?`<div class="fn-cats">${top.map((x,i)=>`<div class="fn-cat"><div class="fn-ch"><span><i class="fn-dot" style="background:var(--c${i%5+1})"></i>${esc(x[0])}</span><b class="num">${rub(x[1])} <small class="mut">${pct(x[1],exp)}%</small></b></div><div class="bar"><i style="width:${Math.max(3,x[1]/mx*100)}%;background:var(--c${i%5+1})"></i></div></div>`).join('')}</div>`:emptyState('wallet','Расходов нет','За выбранный период оплаченных расходов не было.')}</div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Сравнение с предыдущим периодом</h3>${pr?`<p class="mut fn-sub">${esc(fnRangeLabel(r))} и ${esc(fnRangeLabel(pr))}</p>
    <div class="tw fn-tw"><table class="fn-tbl"><thead><tr><th>Показатель</th><th>Сейчас</th><th>Раньше</th><th>Изменение</th></tr></thead><tbody>
    ${[['Выручка',rev,P.rev,false],['Расходы',exp,P.exp,true],['Чистая прибыль',prof,P.prof,false]].map(x=>`<tr><td data-label="Показатель">${x[0]}</td><td data-label="Сейчас" class="num">${rub(x[1])}</td><td data-label="Раньше" class="num">${rub(x[2])}</td><td data-label="Изменение"><span class="cell">${fnDelta(x[1],x[2],x[3])}</span></td></tr>`).join('')}</tbody></table></div>`
    :`<p class="mut fn-sub">Для периода «Всё время» предыдущего периода нет.</p>`}</div>`;
}

/* ---------- Транзакции ---------- */
function fnTx(){
  const clientsUsed=[...new Set(fin.map(fnCid).filter(Boolean))].map(id=>cliOf(id)).filter(Boolean);
  const cats=[...new Set([...fnAllCats('in'),...fnAllCats('out')])];
  return fnPeriodBar()+`<div class="tools fn-filters">
    <input class="grow" data-fn="q" type="search" placeholder="Поиск: описание, категория, клиент, сделка" value="${esc(FNS.q)}" aria-label="Поиск">

function fnMonths(){
  const o=[];
  for(let i=11;i>=0;i--){
    const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
    const r={from:isoOf(d),to:isoOf(e)};
    o.push({l:months[d.getMonth()]+' '+String(d.getFullYear()).slice(2),r,rev:M.revenue(r),exp:M.expenses(r),prof:M.profit(r)});
  }
  return o;
}
function fnRank(map,total,fmtName=x=>esc(x)){
  const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...rows.map(x=>x[1]));
  return rows.map((x,i)=>`<div class="fn-cat"><div class="fn-ch"><span>${fmtName(x[0])}</span><b class="num">${rub(x[1])} <small class="mut">${pct(x[1],total)}%</small></b></div><div class="bar"><i style="width:${Math.max(3,x[1]/mx*100)}%;background:var(--c${i%5+1})"></i></div></div>`).join('');
}
function fnAnalytics(){
  const r=fnRange(),rev=M.revenue(r),sales=fnSales(r),mo=fnMonths(),hasMo=mo.some(m=>m.rev||m.exp);
  const byC={},byS={};
  sales.forEach(f=>{const id=fnCid(f);byC[id]=(byC[id]||0)+f.sum;const s=(id&&cliOf(id)?.source)||'Без источника';byS[s]=(byS[s]||0)+f.sum});
  const rows=Object.fromEntries(Object.entries(byC).map(([id,v])=>[id,v]));
  return fnPeriodBar()+`<div class="grid g4 fn-kpis">${fnKpi('Выручка за период',rub(rev),`<span class="mut">${sales.length} ${sales.length===1?'оплата':'оплат'} от продаж</span>`,'in')}
    ${fnKpi('Средний чек',sales.length?rub(rev/sales.length):'—',`<span class="mut">выручка / число оплат</span>`,'chart')}
    ${fnKpi('Клиентов с оплатами',String(Object.keys(byC).filter(x=>x!=='0').length),`<span class="mut">за выбранный период</span>`,'users')}</div>
  <div class="card" style="margin-top:16px"><h3>По месяцам</h3><p class="mut fn-sub">Последние 12 месяцев: получено от продаж, расходы, прибыль</p>
  ${hasMo?`${barChart([{n:'Выручка',v:mo.map(m=>m.rev)},{n:'Расходы',v:mo.map(m=>m.exp)}],mo.map(m=>m.l),{fmt:fnShort,colors:['--c3','--c5']})}<div class="legend"><span><i style="background:var(--c3)"></i>Выручка</span><span><i style="background:var(--c5)"></i>Расходы</span></div>
  <div class="tw fn-tw" style="margin-top:14px"><table class="fn-tbl"><thead><tr><th>Месяц</th><th>Получено</th><th>Расходы</th><th>Прибыль</th></tr></thead><tbody>${mo.slice().reverse().map(m=>`<tr><td data-label="Месяц">${m.l}</td><td data-label="Получено" class="num">${rub(m.rev)}</td><td data-label="Расходы" class="num">${rub(m.exp)}</td><td data-label="Прибыль" class="num ${m.prof<0?'down':m.prof>0?'up':''}">${m.prof<0?'−':''}${rub(Math.abs(m.prof))}</td></tr>`).join('')}</tbody></table></div>`:emptyState('chart','Данных за 12 месяцев нет','Здесь появится динамика, когда будут оплаченные операции.')}</div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Топ клиентов</h3><p class="mut fn-sub">По полученной выручке за период</p>${sales.length?fnRank(rows,rev,id=>{const c=cliOf(+id);return id==='0'||!c?'<span class="mut">Без клиента</span>':`<a href="#" class="link" data-act="fnOpenClient" data-id="${c.id}">${esc(c.name)}</a>`}):emptyState('users','Нет оплат от продаж','За выбранный период выручки нет.')}</div>
  <div class="card"><h3>По источникам</h3><p class="mut fn-sub">Откуда пришла полученная выручка</p>${sales.length?fnRank(byS,rev):emptyState('chart','Нет данных','За выбранный период выручки нет.')}</div></div>`;
}

/* ---------- Делегированные события фильтров ---------- */
if(!window.__fnBound){
  window.__fnBound=true;
  document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.fn==='q'){FNS.q=t.value;fnDrawList()}});
  document.addEventListener('change',e=>{
    const t=e.target,k=t.dataset&&t.dataset.fn;
    if(t.id==='x_type'){const c=$('#x_cat');if(c)c.innerHTML=fnCatOpts(t.value).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');return}
    if(t.id==='c_t'){const s=$('#c_sw');if(s)s.style.display=t.value==='in'?'':'none';return}
    if(!k||!$('#fnBody'))return;
    if(['type','cat','st','cid'].includes(k)){FNS[k]=t.value;fnDrawList();return}
    if(k==='period'){
      if(t.value==='custom'){const r=fnRange();FNS.from=r.from==='0000-01-01'?iso(-29):r.from;FNS.to=r.to}
      FNS.period=t.value;fnDraw();return;
    }
    if(k==='from'||k==='to'){
      const r=fnRange(),v=t.value;if(!fnISO(v))return fnDraw();
      const a=k==='from'?v:(r.from==='0000-01-01'?iso(-29):r.from),b=k==='to'?v:r.to;
      if(a>b){toast('Начало периода позже конца');return fnDraw()}
      FNS.from=a;FNS.to=b;FNS.period='custom';fnDraw();
    }
  });
}
