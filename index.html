<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)">
<title>alfa+ CRM</title>
<script>
/* Тема применяется до отрисовки, чтобы не было вспышки неверной темы */
(function(){try{var t=localStorage.getItem('vexon-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<style>
/* Встроенный файл: assets/css/legacy.css */
/* Исходные стили проекта (сохранены без изменений). Новая дизайн-система переопределяет их в design-system.css */
/* Макет: фиксированный сайдбар + верхняя панель + прокручиваемая рабочая область; на телефоне сайдбар становится выдвижным */
:root{
 --bg:#0e0f14;--bg2:#13151c;--card:#181a23;--card2:#1e2130;--line:#272b3b;--fg:#eceef6;--mut:#9094aa;--dim:#666b82;
 --acc:#8b6cff;--acc2:#4f8cff;--accsoft:rgba(139,108,255,.16);--grad:linear-gradient(135deg,#8b6cff,#4f8cff);
 --ok:#35c98b;--warn:#f2b24a;--bad:#f0607a;--info:#4f8cff;--shadow:0 8px 30px rgba(0,0,0,.35);
 --c1:#8b6cff;--c2:#4f8cff;--c3:#35c98b;--c4:#f2b24a;--c5:#f0607a;
 --fd:'Space Grotesk','Inter',system-ui,sans-serif;--fb:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --bg:#f3f4f9;--bg2:#eceef6;--card:#fff;--card2:#f6f7fc;--line:#e2e5f0;--fg:#171a29;--mut:#5d627a;--dim:#8d92a8;
 --acc:#6d4cf0;--acc2:#2f6fe8;--accsoft:rgba(109,76,240,.1);--grad:linear-gradient(135deg,#6d4cf0,#2f6fe8);
 --ok:#12935f;--warn:#b7791f;--bad:#d1334f;--info:#2f6fe8;--shadow:0 8px 24px rgba(40,50,100,.1);
 --c1:#6d4cf0;--c2:#2f6fe8;--c3:#12935f;--c4:#d99016;--c5:#d1334f;color-scheme:light}}
:root[data-theme="light"]{
 --bg:#f3f4f9;--bg2:#eceef6;--card:#fff;--card2:#f6f7fc;--line:#e2e5f0;--fg:#171a29;--mut:#5d627a;--dim:#8d92a8;
 --acc:#6d4cf0;--acc2:#2f6fe8;--accsoft:rgba(109,76,240,.1);--grad:linear-gradient(135deg,#6d4cf0,#2f6fe8);
 --ok:#12935f;--warn:#b7791f;--bad:#d1334f;--info:#2f6fe8;--shadow:0 8px 24px rgba(40,50,100,.1);
 --c1:#6d4cf0;--c2:#2f6fe8;--c3:#12935f;--c4:#d99016;--c5:#d1334f;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--fb);padding-left:0;padding-right:0;overflow:hidden}
h1,h2,h3,h4{font-family:var(--fd);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font:700 19px var(--fd)}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 14px rgba(139,108,255,.4)}
.logo svg{width:18px;height:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--mut);text-align:left;transition:.18s}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--accsoft);color:var(--fg)}
.nav button.on{background:var(--accsoft);color:var(--fg);box-shadow:inset 3px 0 0 var(--acc)}
.nav button.on svg{color:var(--acc)}
.nav .badge{margin-left:auto;background:var(--grad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.plan{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:12px;color:var(--mut)}
.plan b{display:block;color:var(--fg);font:600 13px var(--fd);margin-bottom:6px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:nowrap}
.ibtn.menu-btn{display:none}
.company{font:600 15px var(--fd);display:flex;align-items:center;gap:8px;white-space:nowrap}
.company small{color:var(--mut);font:400 12px var(--fb)}
.search{flex:1;max-width:460px;position:relative;min-width:0}
.search input{width:100%;padding:9px 12px 9px 36px;background:var(--card);border:1px solid var(--line);border-radius:12px;outline:0}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--dim)}
.sres{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40;max-height:60vh;overflow:auto}
.sres button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left}
.sres button:hover{background:var(--accsoft)}
.sres small{color:var(--mut);margin-left:auto}
.spacer{flex:1}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;position:relative;color:var(--mut);flex:none;transition:.18s}
.ibtn:hover{color:var(--fg);border-color:var(--acc)}
.ibtn svg{width:18px;height:18px}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.me{display:flex;align-items:center;gap:10px;padding:3px 10px 3px 3px;border:1px solid var(--line);background:var(--card);border-radius:99px}
.me span{font-size:13px;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--fd);color:#fff;flex:none}
.av.s{width:24px;height:24px;font-size:10px}
.pop{position:absolute;right:0;top:46px;width:340px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:50;padding:8px}
.pop h4{padding:8px 10px;font-size:14px}
.pop .it{display:flex;gap:10px;padding:10px;border-radius:10px;font-size:13px}.pop .it:hover{background:var(--accsoft)}
.pop .it small{display:block;color:var(--mut)}
.rel{position:relative}
main{flex:1;overflow:auto;padding:24px;min-height:0;scroll-behavior:smooth}
.view{max-width:1400px;margin:0 auto;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:26px}.ph p{margin:2px 0 0;color:var(--mut)}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--fg);transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(110,90,255,.35)}
.btn.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.dng{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.g32{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .btn{margin-left:auto}
.kpi{position:relative;overflow:hidden}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .v{font:600 28px var(--fd);margin:6px 0;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;display:flex;gap:6px;align-items:center}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi .ic{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center}
.kpi .ic svg{width:19px;height:19px}
.kpi .spark{position:absolute;right:0;bottom:0;width:46%;height:42px;opacity:.9}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:500 12px var(--fb);color:var(--mut);text-align:left;padding:11px 14px;background:var(--card2);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--accsoft)}
tr.click{cursor:pointer}
.cell{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--accsoft);color:var(--acc);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.pill.gray{background:var(--card2);color:var(--mut)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input,.tools select,.fld input,.fld select,.fld textarea{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:0;min-width:0;max-width:100%}
.tools input:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.tools .grow{flex:1;min-width:180px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1;min-width:0}.row .grow b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small,.mut{color:var(--mut)}.row small{font-size:12px}
.ov{position:fixed;inset:0;background:rgba(5,6,12,.6);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;width:560px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow);animation:in .25s}
.modal.wide{width:820px}
.mh{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.mh h3{font-size:18px}.mh .x{margin-left:auto;border:0;background:none;color:var(--mut);font-size:22px;line-height:1}
.mb{padding:20px}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--mut)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);padding:11px 18px;border-radius:12px;z-index:200;box-shadow:var(--shadow);animation:in .25s;max-width:calc(100vw - 32px)}
.kan{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 280px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:200px;transition:.15s}
.col.over{border-color:var(--acc);background:var(--accsoft)}
.col h4{font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.col h4 i{width:9px;height:9px;border-radius:50%}
.col .sum{font-size:12px;color:var(--mut);margin-bottom:10px}
.deal{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;cursor:grab;transition:.15s}
.deal:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--shadow)}
.deal.drag{opacity:.4}
.deal b{display:block;font-weight:500;margin-bottom:4px}
.deal .amt{font:600 16px var(--fd);margin:6px 0}
.deal .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mut);font:11px var(--fb)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--acc)}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:18px;display:flex;flex-direction:column;gap:16px}
.tl div{position:relative}.tl div::before{content:"";position:absolute;left:-25px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.chk{width:20px;height:20px;border-radius:7px;border:2px solid var(--dim);background:none;flex:none;display:grid;place-items:center;padding:0;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done{text-decoration:line-through;color:var(--dim)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{text-align:center;color:var(--mut);font-size:12px;padding:4px}
.cal .d{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px;overflow:hidden}
.cal .d.t{border-color:var(--acc)}.cal .d.o{opacity:.4}
.cal .d>span{font-size:12px;color:var(--mut)}
.cal .ev{display:block;width:100%;text-align:left;border:0;font-size:11px;background:var(--accsoft);color:var(--fg);border-radius:6px;padding:2px 6px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.hi{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.chat{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 190px);min-height:480px;padding:0;overflow:hidden}
.chat .dl{border-right:1px solid var(--line);overflow:auto}
.chat .dlg{display:flex;gap:10px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.chat .dlg:hover,.chat .dlg.on{background:var(--accsoft)}
.chat .dlg .grow{min-width:0;flex:1}.chat .dlg .grow>div{display:flex;gap:6px}
.chat .dlg p{margin:2px 0 0;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .win{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.chat .ms{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;padding:10px 14px;border-radius:16px;background:var(--card2);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff}
.msg small{display:block;opacity:.7;font-size:11px;margin-top:3px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat form input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:0}
.chb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;flex:none}
.back{display:none}
.callbtn{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60}
.dial{text-align:center;padding:10px}
.dial .big{font:600 26px var(--fd);margin:14px 0 4px}
.pulse{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(139,108,255,.5)}100%{box-shadow:0 0 0 28px rgba(139,108,255,0)}}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.node{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.node.t{border-color:var(--acc2)}.node.a{border-color:var(--acc)}
.arrow{color:var(--dim)}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel div{display:flex;align-items:center;gap:10px;font-size:13px}
.funnel .b{white-space:nowrap;overflow:hidden;min-width:96px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;padding-left:10px;color:#fff;font-size:12px;min-width:46px}
.funnel span{width:130px;flex:none;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.scrim{display:none}
@media (max-width:1100px){.g32{grid-template-columns:1fr}.company small{display:none}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:90;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}
 .side.open{transform:none}
 .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80}
 .ibtn.menu-btn{display:grid}
 .top{padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));gap:8px}
 .company span{display:none}.me span{display:none}.me{padding:3px}
 main{padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px))}
 .chat{grid-template-columns:1fr;height:calc(100vh - 170px)}
 .chat .win{display:none}.chat.open .dl{display:none}.chat.open .win{display:flex}
 .back{display:grid}
 .form{grid-template-columns:1fr}
 .msg{max-width:88%}
 .ph h1{font-size:22px}
}
@media (max-width:520px){.company{display:none}.cal .d{min-height:62px;padding:3px}.cal .ev{font-size:0;height:6px;padding:0}.kan .col{flex-basis:84vw}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.me{cursor:pointer;color:var(--fg)}

<style>
/* Встроенный файл: assets/css/m-automation.css */
/* Автоматизация: карточки сценариев и визуальный конструктор «Когда → Если → Тогда» */
.au-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.au-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.au-card{padding:18px 20px;display:flex;flex-direction:column;gap:14px;animation-delay:calc(var(--i,0)*45ms);transition:opacity .25s,transform .3s var(--spring)}
.au-card.off{opacity:.62}
.au-card.off .au-chip{filter:grayscale(.7)}
.au-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.au-ttl{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.au-ttl h3{font:600 17px/1.25 var(--fd);overflow-wrap:anywhere}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}

/* Цепочка из трёх чипов */
.au-flow{display:flex;align-items:stretch;gap:0;min-width:0}
.au-chip{flex:1 1 0;min-width:0;padding:9px 12px;border-radius:12px;background:var(--fill);display:flex;flex-direction:column;gap:1px;border:1px solid transparent}
.au-chip b{font:600 13px/1.3 var(--fb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.au-k{font:600 10.5px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.au-chip.w{background:color-mix(in srgb,var(--c2) 11%,transparent)}.au-chip.w .au-k{color:var(--c2)}
.au-chip.i{background:color-mix(in srgb,var(--c4) 13%,transparent)}.au-chip.i .au-k{color:var(--warn)}
.au-chip.t{background:color-mix(in srgb,var(--c3) 13%,transparent)}.au-chip.t .au-k{color:var(--ok)}
.au-link{flex:none;width:14px;align-self:center;height:2px;background:var(--line2);position:relative}
.au-link::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:5px solid var(--line2);border-right:0}
.au-desc{margin:0;color:var(--mut);font-size:13.5px;line-height:1.5}
.au-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.au-btns{display:flex;gap:8px;flex-wrap:wrap}
.au-btns .btn[aria-expanded="true"]{background:var(--accsoft);color:var(--acc)}

/* Журнал: плавное раскрытие без JS-высоты */
.au-logw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.au-logw.open{grid-template-rows:1fr}
.au-logi{overflow:hidden;min-height:0}
.au-logw.open .au-logi{border-top:1px solid var(--line);padding-top:12px}
.au-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;max-height:260px;overflow:auto}
.au-log li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.au-lt{color:var(--dim);font-size:12px;grid-row:span 2;white-space:nowrap;padding-top:1px}
.au-lr{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.au-nolog{color:var(--mut);font-size:13px;padding:2px 0 4px}

/* Готовые сценарии */
.au-h2{font:700 20px var(--fd);margin:34px 0 4px;letter-spacing:-.02em}
.au-sub{margin:0 0 14px;color:var(--mut);font-size:14px}
.au-pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.au-pre{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:18px;animation-delay:calc(var(--i,0)*45ms)}
.au-pic{width:38px;height:38px;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center}
.au-pic svg{width:20px;height:20px}
.au-pb{flex:1;min-width:0}.au-pb b{display:block;font:600 15px var(--fd);margin-bottom:4px}
.au-pb p{margin:0;color:var(--mut);font-size:13px;line-height:1.5}

/* Конструктор */
.au-modal{width:min(720px,100%)}
.au-b{display:flex;flex-direction:column;gap:16px}

:root[data-theme="dark"] .au-blk{background:rgba(255,255,255,.04)}

.au-blk.au-w{border-left:3px solid var(--c2)}.au-blk.au-i{border-left:3px solid var(--c4)}.au-blk.au-t{border-left:3px solid var(--c3)}
.au-bh{display:flex;align-items:center;gap:12px}
.au-bh>div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.au-bh small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.au-bh b{font:700 16px var(--fd)}
.au-bi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--fill);flex:none}
.au-bi svg{width:17px;height:17px}
.au-w .au-bi{background:color-mix(in srgb,var(--c2) 16%,transparent);color:var(--c2)}
.au-i .au-bi{background:color-mix(in srgb,var(--c4) 18%,transparent);color:var(--warn)}
.au-t .au-bi{background:color-mix(in srgb,var(--c3) 18%,transparent);color:var(--ok)}
.au-add{margin-left:auto}

.au-con{height:26px;display:flex;justify-content:center}

.au-con i::after{content:"";position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top:6px solid var(--acc);border-bottom:0}
.au-fl,.au-params{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.au-pf{display:flex;flex-direction:column;gap:4px;min-width:0}
.au-pf.wide{grid-column:1/-1}
.au-pf>span{font:500 12px var(--fb);color:var(--mut)}
.au-b select,.au-b input:not([type=checkbox]){width:100%;min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:8px 11px;font-size:14px;color:var(--fg);outline:0;transition:border-color var(--dur),box-shadow var(--dur)}
.au-b select:focus,.au-b input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.au-row{display:grid;gap:8px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;animation:rise .3s var(--ease) both}
.au-cond{grid-template-columns:auto minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.2fr) auto}
.au-step{grid-template-columns:auto 1fr}
.au-step>.au-sh{display:flex;gap:8px;align-items:center}.au-step>.au-params{grid-column:1/-1}
.au-n{width:22px;height:22px;border-radius:50%;background:var(--fill);color:var(--mut);font:600 11px var(--fr);display:grid;place-items:center}
.au-mv{display:flex;gap:4px}.au-mv .ibtn{width:30px;height:30px}.au-mv .ibtn svg{width:15px;height:15px}.au-mv .ibtn[disabled]{opacity:.35;pointer-events:none}
.au-none,.au-hint{font-size:12.5px;color:var(--mut)}
.au-none{padding:10px 12px;border:1px dashed var(--line2);border-radius:12px;text-align:center}
.au-live{padding:14px 16px;border-radius:16px;background:var(--accsoft);display:flex;flex-direction:column;gap:4px}
.au-lk{display:flex;align-items:center;gap:6px;font:600 12px var(--fb);color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.au-lk svg{width:14px;height:14px}.au-live p{margin:0;font-size:14px;line-height:1.5}
.au-err{margin:0;padding:12px 16px 12px 30px;border-radius:12px;background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad);font-size:13px}
@media (max-width:640px){
  .au-flow{flex-direction:column;gap:0}.au-link{width:2px;height:12px;margin-left:24px}
  .au-link::after{right:auto;left:-3px;top:auto;bottom:-1px;border:4px solid transparent;border-top:5px solid var(--line2);border-bottom:0}
  .au-cond{grid-template-columns:auto 1fr}.au-cond>*:nth-child(n+3){grid-column:1/-1}
  .au-fl,.au-params{grid-template-columns:1fr}

  const head=`<div class="ph"><div><h1>Сообщения</h1><p>Единое окно переписки: Telegram, WhatsApp и почта. История сохраняется в карточке клиента.</p></div><div class="acts"><button class="btn pri" data-act="newDlg">${ico('plus')}Новый диалог</button></div></div>${chList().length?'':'<div class="card" style="margin-bottom:16px">Каналы связи не подключены. <button class="link" data-act="toInteg">Подключить Telegram, WhatsApp или почту</button></div>'}`;
  if(!dialogs.length){$('#view').innerHTML=head+'<div class="card empty">Диалогов пока нет. Добавьте диалог с клиентом, чтобы вести переписку в одном окне.</div>';return}
  if(!dialogs.find(d=>d.id===curDlg))curDlg=dialogs[0].id;
  $('#view').innerHTML=head+`<div class="card chat" id="chat"><div class="dl" id="dl"></div><div class="win" id="win"></div></div>`;
  drawDlg();
};
A.newDlg=()=>{if(!clients.length){toast('Сначала добавьте клиента');clientForm();return}
  if(!chList().length){toast('Сначала подключите канал связи');A.toInteg();return}
  modal({title:'Новый диалог',body:`<form class="form">${fld('m_c','Клиент',clients[0].id,{type:'select',full:1,opts:clients.map(c=>[c.id,c.name+' — '+c.company])})}${fld('m_ch','Канал',chList()[0],{type:'select',opts:chList().map(k=>[k,CH[k].n])})}${fld('m_t','Первое сообщение клиента','',{type:'textarea',full:1})}</form>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Создать',cls:'pri',fn:()=>{const d={id:++nid,cid:+val('m_c'),ch:val('m_ch'),unread:0,msgs:[]};if(val('m_t'))d.msgs.push({me:0,t:val('m_t'),time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});dialogs.unshift(d);curDlg=d.id;closeModal();drawNav();V.messages()}}]})};
const chb=k=>`<span class="chb" style="background:${CH[k].c}" title="${CH[k].n}">${CH[k].l}</span>`;
function drawDlg(){
  $('#dl').innerHTML=dialogs.map(d=>{const c=cliOf(d.cid),m=d.msgs[d.msgs.length-1]||{me:0,t:'Нет сообщений',time:''};return `<button class="dlg ${d.id===curDlg?'on':''}" data-act="dlg" data-id="${d.id}"><span class="av" style="background:${COLORS[c.id%8]}">${ini(c.name)}</span><span class="grow"><div><b style="font-weight:500">${esc(c.name)}</b><span style="margin-left:auto" class="mut">${m.time}</span></div><p>${m.me?'Вы: ':''}${esc(m.t)}</p></span>${chb(d.ch)}${d.unread?`<span class="pill" style="height:fit-content;background:var(--grad);color:#fff">${d.unread}</span>`:''}</button>`}).join('');
  const d=dialogs.find(x=>x.id===curDlg),c=cliOf(d.cid);
  $('#win').innerHTML=`<div class="hd"><button class="ibtn back" data-act="dback" aria-label="Назад">${ico('back')}</button><span class="av" style="background:${COLORS[c.id%8]}">${ini(c.name)}</span><div><b>${esc(c.name)}</b><div class="mut" style="font-size:12px">${esc(c.company)} · ${CH[d.ch].n}</div></div><button class="btn sm" style="margin-left:auto" data-act="inMsg">Входящее</button><button class="btn sm" data-act="client" data-id="${c.id}">Карточка</button></div><div class="ms" id="ms">${d.msgs.map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.t)}<small>${m.time}</small></div>`).join('')}</div><form id="mf"><input id="mi" placeholder="Написать сообщение…" autocomplete="off" aria-label="Сообщение"><button class="btn pri" aria-label="Отправить">${ico('send')}</button></form>`;
  const ms=$('#ms');ms.scrollTop=ms.scrollHeight;
  $('#mf').onsubmit=e=>{e.preventDefault();const v=$('#mi').value.trim();if(!v)return;const t=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});d.msgs.push({me:1,t:v,time:t});addHist(d.cid,'Сообщение',`${CH[d.ch].n}: ${v.slice(0,80)}`);drawDlg();$('#mi').focus()};
}
A.dlg=b=>{curDlg=+b.dataset.id;const d=dialogs.find(x=>x.id===curDlg);d.unread=0;drawNav();drawDlg();$('#chat').classList.add('open')};
A.dback=()=>$('#chat').classList.remove('open');
/* ===== Телефония ===== */
let PF='all',callT=null;
V.phone=()=>{
  const inn=calls.filter(c=>c.type==='in').length,out=calls.filter(c=>c.type==='out').length,mi=calls.filter(c=>c.type==='miss').length,talk=calls.reduce((a,c)=>a+c.dur,0);
  $('#view').innerHTML=`<div class="ph"><div><h1>Телефония</h1><p>Журнал звонков компании. Фиксируйте звонки и их длительность.</p></div><div class="acts"><button class="btn" data-act="logCall">${ico('plus')}Записать звонок</button><button class="btn pri" data-act="dial">${ico('phone')}Позвонить</button></div></div>
  <div class="grid g4" style="margin-bottom:16px"><div class="card kpi"><div class="l">Входящие</div><div class="v">${inn}</div></div><div class="card kpi"><div class="l">Исходящие</div><div class="v">${out}</div></div><div class="card kpi"><div class="l">Пропущенные</div><div class="v down">${mi}</div></div><div class="card kpi"><div class="l">Время разговоров</div><div class="v">${Math.round(talk/60)} мин</div></div></div>
  <div class="tools"><div class="seg">${[['all','Все'],['in','Входящие'],['out','Исходящие'],['miss','Пропущенные']].map(x=>`<button data-act="pf" data-f="${x[0]}" class="${PF===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div>
  <div class="tw"><table><thead><tr><th>Тип</th><th>Клиент</th><th>Сотрудник</th><th>Длительность</th><th>Дата и время</th><th></th></tr></thead><tbody>${calls.length?'':'<tr><td colspan="6"><div class="empty">Звонков пока нет. Нажмите «Записать звонок» или «Позвонить».</div></td></tr>'}${calls.filter(c=>PF==='all'||c.type===PF).map(c=>{const cl=cliOf(c.cid),T={in:['in','Входящий','ok'],out:['out','Исходящий','info'],miss:['miss','Пропущенный','bad']}[c.type];return `<tr><td><span class="pill ${T[2]}">${ico(T[0])}${T[1]}</span></td><td><a href="#" data-act="client" data-id="${cl.id}" style="color:var(--fg)">${esc(cl.name)}</a><br><small class="mut">${esc(cl.phone)}</small></td><td>${person(c.mgr)}</td><td>${dur(c.dur)}</td><td>${fd(c.at)}, ${c.at.slice(11)}</td><td><button class="btn sm" data-act="dial" data-id="${cl.id}">${ico('phone')}Перезвонить</button></td></tr>`}).join('')}</tbody></table></div>`;
};
A.pf=b=>{PF=b.dataset.f;V.phone()};
A.dial=b=>{
  if(!clients.length){toast('Сначала добавьте клиента');return}
  const pre=b?.dataset?.id;
  modal({title:'Звонок клиенту',body:`<div class="dial" id="dialbox"><div class="fld" style="text-align:left"><label for="dc">Кому звонить</label><select id="dc">${clients.map(c=>`<option value="${c.id}" ${pre==c.id?'selected':''}>${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}</select></div><p class="mut">Наберите номер на телефоне или в вашей IP-телефонии. Здесь фиксируется длительность разговора и запись в журнал.</p></div>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Начать разговор',cls:'pri',fn:()=>{
    const c=cliOf(+val('dc'));let s=0;
    $('#dialbox').innerHTML=`<div class="pulse">${ico('phone')}</div><div class="big">${esc(c.name)}</div><div class="mut">${esc(c.phone)}</div><div class="big" id="tm">0:00</div><div class="mut">Идёт разговор</div>`;
    $('.mf').innerHTML='';const e=document.createElement('button');e.className='btn pri';e.style.background='var(--bad)';e.textContent='Завершить';$('.mf').appendChild(e);
    callT=setInterval(()=>{s++;const t=$('#tm');t?t.textContent=dur(s):clearInterval(callT)},1000);
    e.onclick=()=>{clearInterval(callT);calls.unshift({id:++nid,type:'out',cid:c.id,mgr:1,dur:s,at:iso(0)+' '+new Date().toTimeString().slice(0,5)});addHist(c.id,'Звонок',`Исходящий звонок, ${dur(s)}`);closeModal();toast('Звонок записан в журнал');if(cur==='phone')V.phone()}}}]});
};

A.logCall=()=>{if(!clients.length){toast('Сначала добавьте клиента');clientForm();return}
  modal({title:'Записать звонок',body:`<form class="form">${fld('k_c','Клиент',clients[0].id,{type:'select',full:1,opts:clients.map(c=>[c.id,c.name+' — '+c.phone])})}${fld('k_t','Тип','out',{type:'select',opts:[['in','Входящий'],['out','Исходящий'],['miss','Пропущенный']]})}${fld('k_m','Сотрудник',1,{type:'select',opts:staff.map(s=>[s.id,s.name])})}${fld('k_min','Минуты','0',{type:'number'})}${fld('k_sec','Секунды','0',{type:'number'})}</form>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Записать',cls:'pri',fn:()=>{const t=val('k_t'),d=t==='miss'?0:(+val('k_min')||0)*60+(+val('k_sec')||0),cid=+val('k_c');
     calls.unshift({id:++nid,type:t,cid,mgr:+val('k_m'),dur:d,at:iso(0)+' '+new Date().toTimeString().slice(0,5)});addHist(cid,'Звонок',({in:'Входящий',out:'Исходящий',miss:'Пропущенный'})[t]+' звонок'+(d?', '+dur(d):''));
     if(t==='miss')fire('Пропущенный звонок',{cid,mgr:+val('k_m'),what:cliOf(cid).name});closeModal();toast('Звонок записан');V.phone()}}]})};
A.inMsg=()=>{const d=dialogs.find(x=>x.id===curDlg);if(!d)return;
  modal({title:'Входящее сообщение',body:`<p class="mut" style="margin-top:0">Внесите сообщение, которое клиент прислал в ${CH[d.ch].n}. Автоматический приём из мессенджера появится вместе с серверной частью.</p><div class="form">${fld('i_t','Текст сообщения','',{type:'textarea',full:1})}</div>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Добавить',cls:'pri',fn:()=>{const v=val('i_t');if(!v)return;d.msgs.push({me:0,t:v,time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})});addHist(d.cid,'Сообщение',`${CH[d.ch].n}: ${v.slice(0,80)}`);fire('Новое сообщение',{cid:d.cid,what:cliOf(d.cid)?.name});closeModal();drawNav();drawDlg()}}]})};
A.toInteg=()=>{SET.tab='integr';go('settings')};
/* ===== Товары и склад ===== */
const PFl={q:'',cat:''};
V.products=()=>{
  const val_=products.reduce((a,p)=>a+p.price*p.qty,0),low=products.filter(p=>p.qty<20).length;
  $('#view').innerHTML=`<div class="ph"><div><h1>Товары и склад</h1><p>Остатки и цены номенклатуры</p></div><div class="acts"><button class="btn pri" data-act="newProd">${ico('plus')}Добавить товар</button></div></div>
  <div class="grid g4" style="margin-bottom:16px"><div class="card kpi"><div class="l">Позиций</div><div class="v">${products.length}</div></div><div class="card kpi"><div class="l">Стоимость остатков</div><div class="v">${mln(val_)}</div></div><div class="card kpi"><div class="l">Заканчиваются</div><div class="v ${low?'down':''}">${low}</div></div></div>
  <div class="tools"><input class="grow" id="pq" placeholder="Название или артикул" value="${esc(PFl.q)}" aria-label="Поиск товаров"><select id="pc" aria-label="Категория"><option value="">Все категории</option>${CATS.map(c=>`<option ${PFl.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="tw"><table><thead><tr><th>Название</th><th>Артикул</th><th>Категория</th><th>Цена</th><th>Количество</th><th>Наличие</th><th></th></tr></thead><tbody id="ptb"></tbody></table></div>`;
  $('#pq').oninput=e=>{PFl.q=e.target.value;drawProd()};$('#pc').onchange=e=>{PFl.cat=e.target.value;drawProd()};drawProd();
};
function drawProd(){const q=PFl.q.toLowerCase(),l=products.filter(p=>(!q||(p.name+p.sku).toLowerCase().includes(q))&&(!PFl.cat||p.cat===PFl.cat));
  $('#ptb').innerHTML=l.map(p=>`<tr><td>${esc(p.name)}</td><td class="mut">${esc(p.sku)}</td><td>${esc(p.cat)}</td><td>${rub(p.price)}</td><td>${new Intl.NumberFormat('ru-RU').format(p.qty)} шт.</td><td><span class="pill ${p.qty===0?'bad':p.qty<20?'warn':'ok'}">${p.qty===0?'Нет в наличии':p.qty<20?'Мало':'В наличии'}</span></td><td><span class="cell"><button class="ibtn" style="width:32px;height:32px" data-act="editProd" data-id="${p.id}" aria-label="Изменить">${ico('edit')}</button><button class="ibtn" style="width:32px;height:32px" data-act="delProd" data-id="${p.id}" aria-label="Удалить">${ico('trash')}</button></span></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">Товары не найдены</div></td></tr>'}
A.newProd=()=>prodForm();A.editProd=b=>prodForm(+b.dataset.id);
A.delProd=b=>{const p=products.find(x=>x.id==b.dataset.id);confirmBox(`Удалить товар «${esc(p.name)}»?`,()=>{products.splice(products.indexOf(p),1);toast('Товар удалён');V.products()})};
function prodForm(id){const p=id?products.find(x=>x.id===id):{name:'',sku:'',cat:CATS[0],price:'',qty:''};
  modal({title:id?'Редактирование товара':'Новый товар',body:`<form class="form">${fld('p_name','Название',p.name,{full:1})}${fld('p_sku','Артикул',p.sku,{ph:'EL-0000'})}${fld('p_cat','Категория',p.cat,{type:'select',opts:CATS})}${fld('p_price','Цена, ₽',p.price,{type:'number'})}${fld('p_qty','Количество, шт.',p.qty,{type:'number'})}</form>`,
   foot:[{label:'Отмена',fn:closeModal},{label:id?'Сохранить':'Добавить',cls:'pri',fn:()=>{if(!val('p_name')){toast('Укажите название');return}
    const o={name:val('p_name'),sku:val('p_sku')||'NEW-'+(nid+1),cat:val('p_cat'),price:+val('p_price')||0,qty:+val('p_qty')||0};
    if(id)Object.assign(p,o);else{o.id=++nid;products.unshift(o)}closeModal();toast('Сохранено');V.products()}}]})}
/* ===== Финансы ===== */
let FF='all';
V.finance=()=>{
  const inc=fin.filter(f=>f.type==='in'&&f.st==='Оплачен').reduce((a,f)=>a+f.sum,0),out=fin.filter(f=>f.type==='out'&&f.st==='Оплачен').reduce((a,f)=>a+f.sum,0),wait=fin.filter(f=>f.type==='in'&&f.st!=='Оплачен').reduce((a,f)=>a+f.sum,0);
  const s0=Math.max(0,MO-6),lb=months.slice(s0,MO);let incS=revenue.slice(s0,MO),ex=[2.9,3.1,3.3,3.2,3.9,3.7],expD=[['Закупка',318],['Зарплата',520],['Аренда',210],['Налоги',274],['Маркетинг',95]];
  if(!demo){const byM=t=>Array.from({length:MO-s0},(_,i)=>s0+i).map(m=>fin.filter(f=>f.type===t&&f.st==='Оплачен'&&+f.date.slice(5,7)-1===m).reduce((a,f)=>a+f.sum,0)/1e6);incS=byM('in');ex=byM('out');const g={};fin.filter(f=>f.type==='out'&&f.st==='Оплачен').forEach(f=>g[f.cat]=(g[f.cat]||0)+f.sum/1000);expD=Object.entries(g).map(([k,v])=>[k,Math.round(v)])}
  $('#view').innerHTML=`<div class="ph"><div><h1>Финансы</h1><p>Поступления и расходы компании</p></div><div class="acts"><button class="btn pri" data-act="newFin">${ico('plus')}Добавить операцию</button></div></div>
  <div class="grid g4" style="margin-bottom:16px"><div class="card kpi"><div class="l">Поступления</div><div class="v up">${mln(inc)}</div></div><div class="card kpi"><div class="l">Расходы</div><div class="v down">${mln(out)}</div></div><div class="card kpi"><div class="l">Прибыль за период</div><div class="v">${mln(inc-out)}</div></div><div class="card kpi"><div class="l">Ожидаемые оплаты</div><div class="v">${mln(wait)}</div></div></div>
  <div class="grid g32"><div class="card"><h3>Доходы и расходы, млн ₽</h3>${barChart([{n:'Доходы',v:incS},{n:'Расходы',v:ex}],lb,{fmt:v=>(+v.toFixed(1)).toString().replace('.',','),colors:['--c3','--c5']})}<div class="legend"><span><i style="background:var(--c3)"></i>Доходы</span><span><i style="background:var(--c5)"></i>Расходы</span></div></div>
  <div class="card"><h3>Структура расходов</h3>${donut(expD,0,{center:'тыс. ₽'})}</div></div>
  <div class="tools" style="margin-top:16px"><div class="seg">${[['all','Все'],['in','Доходы'],['out','Расходы']].map(x=>`<button data-act="ff" data-f="${x[0]}" class="${FF===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div>
  <div class="tw"><table><thead><tr><th>Дата</th><th>Операция</th><th>Категория</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody>${[...fin].sort((a,b)=>b.date.localeCompare(a.date)).filter(f=>FF==='all'||f.type===FF).map(f=>`<tr><td>${fd(f.date)}</td><td>${esc(f.t)}</td><td>${esc(f.cat)}</td><td class="${f.type==='in'?'up':'down'}">${f.type==='in'?'+':'−'}${rub(f.sum)}</td><td><span class="pill ${f.st==='Оплачен'?'ok':'warn'}">${f.st}</span></td><td><span class="cell"><button class="btn sm" data-act="finPay" data-id="${f.id}">${f.st==='Оплачен'?'Вернуть в ожидание':'Отметить оплаченным'}</button><button class="ibtn" style="width:32px;height:32px" data-act="finDel" data-id="${f.id}" aria-label="Удалить">${ico('trash')}</button></span></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Операций пока нет. Закрытые сделки попадают сюда автоматически.</div></td></tr>'}</tbody></table></div>`;
};
A.finPay=b=>{const f=fin.find(x=>x.id==b.dataset.id);f.st=f.st==='Оплачен'?'Ожидается':'Оплачен';V.finance()};

A.ff=b=>{FF=b.dataset.f;V.finance()};
A.newFin=()=>modal({title:'Новая операция',body:`<form class="form">${fld('x_t','Описание','',{full:1,ph:'Например: Оплата счёта №2050'})}${fld('x_type','Тип','in',{type:'select',opts:[['in','Доход'],['out','Расход']]})}${fld('x_sum','Сумма, ₽','',{type:'number'})}${fld('x_cat','Категория','Оплата по сделке',{type:'select',opts:['Оплата по сделке','Закупка','Зарплата','Аренда','Налоги','Маркетинг']})}${fld('x_st','Статус','Оплачен',{type:'select',opts:['Оплачен','Ожидается']})}</form>`,

/* ===== Автоматизация ===== */

const ACTS=['Создать задачу','Уведомить руководителя','Изменить статус клиента','Назначить менеджера'];
V.automation=()=>{
  $('#view').innerHTML=`<div class="ph"><div><h1>Автоматизация</h1><p>Сценарии срабатывают сами, когда в CRM происходит событие</p></div><div class="acts"><button class="btn pri" data-act="newAuto">${ico('plus')}Создать сценарий</button></div></div>

let cloudVersion=null,cloudConflict=false;
async function saveWorkspaceCloud(silent=false){
  if(!CUR||!cloudReady||cloudConflict)return false;
  if(cloudSaveBusy){cloudSaveQueued=true;return true}
  cloudSaveBusy=true;
  const snapshot=JSON.parse(snap());
  const payload={...cloudWorkspaceData,workspace:snapshot,clients:clients.map(c=>({...c}))};
  const now=new Date().toISOString();
  let error=null,saved=null;
  try{
    if(cloudVersion){
      // обновляем только если запись в облаке не менялась с момента нашей загрузки
      const r=await sb.from('crm_workspaces').update({data:payload,updated_at:now}).eq('user_id',CUR).eq('updated_at',cloudVersion).select('updated_at');
      error=r.error;saved=r.data;
      if(!error&&(!saved||!saved.length)){cloudSaveBusy=false;cloudConflict=true;showCloudConflict();return false}
    }else{
      const r=await sb.from('crm_workspaces').upsert({user_id:CUR,data:payload,updated_at:now},{onConflict:'user_id'}).select('updated_at');
      error=r.error;saved=r.data;
    }
  }catch(e){error=e}
  cloudSaveBusy=false;
  if(error){
    console.error('alfa+ cloud workspace save:',error);
    if(!silent)toast('Не удалось сохранить CRM в Supabase: '+(error.message||'ошибка'));
    return false;
  }
  cloudVersion=(saved&&saved[0]&&saved[0].updated_at)||now;
  cloudWorkspaceData=payload;
  if(cloudSaveQueued){cloudSaveQueued=false;scheduleWorkspaceSync()}
  return true;
}

async function loadClientsCloud(){
  if(!CUR)return;
  cloudReady=false;
  const {data,error}=await sb.from('crm_workspaces').select('data,updated_at').eq('user_id',CUR).maybeSingle();cloudVersion=data?.updated_at||null;
  if(error){
    console.error('alfa+ cloud workspace load:',error);
    toast('Не удалось загрузить облачные данные. Проверьте соединение и права Supabase. Автосохранение отключено, чтобы не затереть облако.');
    cloudReady=false;
    return;
  }
  cloudWorkspaceData=data?.data&&typeof data.data==='object'&&!Array.isArray(data.data)?{...data.data}:{};
  if(cloudWorkspaceData.workspace&&typeof cloudWorkspaceData.workspace==='object'){
    // Полная облачная копия — источник истины для всех модулей.
    restore(JSON.stringify(cloudWorkspaceData.workspace));
  }else if(Array.isArray(cloudWorkspaceData.clients)){
    // Совместимость со старой версией: берём клиентов из облака,
    // остальные разделы сохраняем из локальной копии и переносим целиком.
    setList(clients,cloudWorkspaceData.clients);
    flush();
    cloudReady=true;
    await saveWorkspaceCloud(true);
    return;
  }else{
    // Первая миграция: сохраняем существующие локальные разделы целиком.
    cloudReady=true;
    await saveWorkspaceCloud(true);
    return;
  }
  flush();
  cloudReady=true;
}

 privacy:{title:'Политика конфиденциальности и обработки персональных данных',html:`
 <p><b>Дата редакции:</b> 12 ноября 2026 года.</p><p><b>Оператор:</b> [указать полное ФИО физического лица или наименование ИП/организации, адрес и контактный e-mail]. До заполнения этих сведений документ не готов к публикации.</p>
 <h3>1. Общие положения</h3><p>Настоящая Политика описывает обработку персональных данных при использовании сервиса alfa+ CRM (далее — Сервис). Оператор обрабатывает данные в соответствии с применимым законодательством РФ, включая Федеральный закон № 152-ФЗ «О персональных данных».</p><p>Политика относится к данным посетителей и зарегистрированных пользователей. Если пользователь вносит в CRM данные своих клиентов, сотрудников или иных лиц, пользователь самостоятельно определяет законное основание такой обработки и обязан информировать этих лиц. Оператор alfa+ обрабатывает такие сведения в рамках предоставления Сервиса и на условиях отдельного поручения/договора обработки, который должен быть оформлен до промышленного запуска.</p>
 <h3>2. Какие данные обрабатываются</h3><ul><li>Для регистрации и входа: имя, фамилия, номер телефона, адрес электронной почты, идентификатор аккаунта и технические данные аутентификации. Пароль передаётся сервису аутентификации и не должен сохраняться Оператором в открытом виде.</li><li>Для работы CRM: данные, которые пользователь самостоятельно вносит в рабочее пространство, включая сведения о клиентах, сделках, задачах, сотрудниках, товарах и коммуникациях. Пользователь должен вносить только данные, необходимые для его деловой цели.</li><li>Технические сведения: сведения о сессии, настройках интерфейса, событиях безопасности и журналов, если они формируются используемыми компонентами. Браузер также обращается к внешним ресурсам, используемым в коде (Google Fonts и CDN jsDelivr для библиотеки Supabase); их поставщики могут получать технические данные запроса, например IP-адрес и сведения о браузере.</li></ul><p>Не запрашиваются намеренно специальные категории персональных данных (например, сведения о здоровье, политических взглядах или интимной жизни), биометрические данные, паспортные данные и платёжные реквизиты. Не размещайте такие сведения в CRM, если для этого нет отдельного законного основания и согласованного процесса.</p>
 <h3>3. Цели и основания обработки</h3><ul><li>создание аккаунта, аутентификация и обеспечение доступа к Сервису;</li><li>предоставление функций CRM, сохранение рабочего пространства и синхронизация данных;</li><li>обеспечение безопасности, предотвращение злоупотреблений, диагностика ошибок и поддержка;</li><li>исполнение договора с пользователем и соблюдение обязательных требований закона.</li></ul><p>Основания: заключение и исполнение договора, обязанности по закону, а для тех операций, где это требуется, отдельное согласие субъекта персональных данных.</p>
 <h3>4. Действия с данными и минимизация</h3><p>Оператор может осуществлять сбор, запись, систематизацию, накопление, хранение, уточнение, использование, передачу уполномоченным обработчикам, блокирование и удаление данных. Состав данных ограничивается целями Сервиса. Пользователю не следует вносить избыточные сведения.</p>
 <h3>5. Хранение, обработчики и трансграничная передача</h3><p>В текущей версии Сервиса используется инфраструктура Supabase (аутентификация и облачное хранение рабочего пространства). Конкретное юридическое лицо-поставщик, регион размещения проекта, место первичного сбора и хранения данных, условия поручения обработки и наличие/отсутствие трансграничной передачи должны быть проверены и указаны Оператором до запуска для пользователей из РФ. Пока эти сведения не подтверждены, нельзя считать вопрос локализации и трансграничной передачи урегулированным.</p><p>Оператор не должен передавать данные третьим лицам, кроме привлечённых обработчиков, случаев, необходимых для работы Сервиса, исполнения закона или защиты прав. Список обработчиков и их роли подлежит заполнению после выбора инфраструктуры и интеграций.</p>
 <h3>6. Сроки хранения и удаление</h3><p>Данные хранятся не дольше, чем это необходимо для указанных целей, срока действия аккаунта и исполнения обязательных требований закона. После прекращения целей данные удаляются или обезличиваются, если их дальнейшее хранение не требуется законом. Конкретные сроки резервного копирования и удаления должны быть установлены в инфраструктуре и регламенте Оператора до запуска.</p>
 <h3>7. Права субъекта</h3><p>Субъект вправе запросить сведения об обработке, потребовать уточнения, блокирования или удаления данных, а также отозвать согласие, если обработка основана на согласии. Запрос направляется на [указать рабочий e-mail Оператора]. Отзыв согласия не влияет на законность обработки до его получения и не исключает обработку на иных законных основаниях.</p>
 <h3>8. Защита данных</h3><p>Оператор обязан принимать необходимые правовые, организационные и технические меры защиты. Фактические меры, ответственные лица, порядок реагирования на инциденты и уровень защищённости должны быть определены и документированы отдельно. Наличие этой Политики само по себе не подтверждает выполнение таких мер.</p>
 <h3>9. Контакты и изменения</h3><p>Контакт Оператора: [указать e-mail и почтовый адрес]. Политика может обновляться; актуальная редакция публикуется на странице Сервиса с датой изменения.</p>`},
 terms:{title:'Условия использования alfa+ CRM',html:`
 <p><b>Дата редакции:</b> 12 ноября 2026 года. <b>Правообладатель/исполнитель:</b> [указать полное ФИО или наименование, адрес и контакты].</p>
 <h3>1. Предмет</h3><p>alfa+ CRM — программный сервис для организации работы с клиентами, сделками, задачами и иными бизнес-данными. Условия регулируют доступ к Сервису и его использование.</p>
 <h3>2. Аккаунт</h3><p>Пользователь обязан предоставлять достоверные регистрационные данные, обеспечивать конфиденциальность учётных данных и незамедлительно сообщать о подозрении на несанкционированный доступ. Пользователь отвечает за действия, совершённые через его аккаунт, если иное не установлено законом.</p>
 <h3>3. Допустимое использование</h3><p>Запрещается использовать Сервис для нарушения закона, прав третьих лиц, рассылки спама, загрузки вредоносного кода, попыток обхода защиты или несанкционированного доступа. Пользователь обязуется иметь законное основание для внесения и обработки персональных данных третьих лиц.</p>
 <h3>4. Данные пользователя</h3><p>Пользователь сохраняет права на загружаемые им данные и отвечает за их законность, точность, наличие необходимых уведомлений и согласий. Пользователь должен вносить только данные, необходимые для конкретной деловой цели, и не загружать специальные категории или биометрические данные без отдельной правовой оценки.</p>
 <h3>5. Доступность и поддержка</h3><p>Сервис предоставляется в текущем виде. Возможны технические перерывы, обновления и ограничения, необходимые для безопасности и обслуживания. Условия тарифа, стоимость, сроки поддержки и гарантии доступности должны быть опубликованы отдельно до начала платного предоставления.</p>
 <h3>6. Интеллектуальные права</h3><p>Права на программный код, интерфейс, обозначения и материалы принадлежат их правообладателям. Пользователю предоставляется ограниченное, неисключительное, непередаваемое право использовать Сервис по назначению в течение срока доступа.</p>
 <h3>7. Ограничение и прекращение доступа</h3><p>Доступ может быть временно ограничен при угрозе безопасности, нарушении настоящих Условий или требований закона. Пользователь может прекратить использование Сервиса и направить запрос об удалении данных Оператору.</p>
 <h3>8. Ответственность</h3><p>Стороны несут ответственность в соответствии с применимым законодательством РФ. Ничто в настоящих Условиях не ограничивает права потребителя или иные права, которые не могут быть ограничены законом.</p>
 <h3>9. Претензии и контакты</h3><p>Претензии направляются: [указать адрес и e-mail Оператора]. Применимое право — право Российской Федерации, если иное не предусмотрено императивными нормами.</p>
 <h3>10. Заключительные положения</h3><p>До публикации Оператор должен заполнить сведения о себе, определить тарифы и порядок оплаты (если применимо), а также проверить согласованность Условий с фактической работой Сервиса.</p>`},
 cookies:{title:'Политика использования Cookie и локального хранилища',html:`
 <p><b>Дата редакции:</b> 12 ноября 2026 года. Оператор: [указать сведения Оператора и контакт].</p>
 <h3>1. Что используется сейчас</h3><p>По текущему коду alfa+ не подключены рекламные cookie-файлы и сторонние системы веб-аналитики. Для работы интерфейса и входа используются необходимые технологии браузера: localStorage/session storage и механизмы хранения сессии библиотеки Supabase. В localStorage могут храниться выбранная тема интерфейса и локальная копия рабочего пространства (в том числе данные, которые пользователь внёс в CRM); библиотека авторизации может сохранять токен сессии. Это не обязательно cookie-файлы, но относится к технологиям хранения данных на устройстве.</p>
 <h3>2. Цели</h3><p>Эти технологии необходимы для входа в аккаунт, сохранения настроек, поддержания сессии и работы CRM. При отключении необходимого хранения некоторые функции Сервиса могут не работать.</p>
 <h3>3. Необязательные технологии</h3><p>На дату редакции необязательные аналитические и рекламные cookie не заявлены и не должны устанавливаться без отдельного информирования и получения требуемого согласия. Внешние Google Fonts и CDN jsDelivr загружаются как сторонние ресурсы; передача технических данных при их загрузке должна быть отдельно оценена Оператором, в том числе с учётом требований локализации и трансграничной передачи. Если в будущем будут добавлены аналитика, реклама, пиксели или иные необязательные технологии, Политика и интерфейс выбора должны быть обновлены до их включения.</p>
 <h3>4. Управление</h3><p>Пользователь может ограничить хранение в настройках браузера. Удаление локального хранилища может привести к выходу из аккаунта, сбросу темы или потере несинхронизированных локальных изменений. Согласие на необязательные cookie не запрашивается, пока такие технологии не используются.</p>
 <h3>5. Контакты</h3><p>Вопросы по технологиям хранения направляйте Оператору: [указать рабочий e-mail].</p>`},

function authMessage(e){
  const m=(e?.message||'').toLowerCase();
  if(m.includes('already registered')||m.includes('already been registered'))return 'Аккаунт с этой почтой уже существует. Попробуйте войти.';
  if(m.includes('invalid login credentials'))return 'Неверная почта или пароль.';
  if(m.includes('email not confirmed'))return 'Сначала подтвердите почту по ссылке из письма.';
  if(m.includes('password'))return 'Пароль должен содержать не менее 6 символов.';
  return e?.message||'Не удалось выполнить запрос. Проверьте соединение и настройки Supabase.';
}
