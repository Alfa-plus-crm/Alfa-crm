<script>
/* Встроенный файл: assets/js/staff.js */
/* ==========================================================================
   staff.js — Сотрудники: команда, статистика, роли и права.
   ЧЕСТНО: сейчас в систему входит только владелец; остальные сотрудники — записи справочника
   без собственных входов. Права скрывают действия в интерфейсе. Принудительная проверка
   на сервере появится после подключения многопользовательской схемы (миграция 002, этап 2).
   ========================================================================== */
const ST={tab:'team'};
const PERM_NAMES={'clients.view':'Просмотр клиентов','clients.edit':'Изменение клиентов','clients.delete':'Удаление клиентов','deals.edit':'Работа со сделками','tasks.edit':'Работа с задачами','finance.view':'Просмотр финансов','finance.edit':'Изменение финансов','stock.edit':'Изменение склада','staff.manage':'Управление сотрудниками','settings.manage':'Настройки пространства','export':'Экспорт данных','ai.use':'Alfa AI','audit.view':'Журнал действий','trash.purge':'Безвозвратное удаление'};
const stStats=s=>{const m=periodRange('30d');return {act:deals.filter(d=>d.mgr===s.id&&!['won','lost'].includes(d.stage)),won:M.dealsWon(m).filter(d=>d.mgr===s.id),open:tasks.filter(t=>t.mgr===s.id&&t.status!=='Выполнена'),late:tasks.filter(t=>t.mgr===s.id&&tkLate(t)),cl:clients.filter(c=>c.mgr===s.id)}};

V.staff=()=>{
  const tabs=[['team','Команда'],['roles','Роли и права']];
  $('#view').innerHTML=`<div class="ph"><div><h1>Сотрудники</h1><p>${staff.length} в команде</p></div><div class="acts">${can('staff.manage')?`<button class="btn pri" data-act="newStaff">${ico('plus')}Добавить сотрудника</button>`:''}</div></div>
  <div class="tools"><div class="seg">${tabs.map(t=>`<button data-act="stTab" data-t="${t[0]}" class="${ST.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div></div>
  <div class="cm-note">${ico('shield')}<span>Сейчас в систему входит только владелец аккаунта. Остальные сотрудники — записи для назначения клиентов, сделок и задач: собственных входов у них пока нет. Роли скрывают действия в интерфейсе; серверная проверка по ролям появится вместе с командными учётными записями (supabase/migrations/002_team_workspaces.sql, пока не подключена).</span></div>
  <div id="stBody"></div>`;
  stDraw();
};
function stDraw(){
  const b=$('#stBody');
  if(ST.tab==='roles'){
    const roles=Object.keys(ROLES);
    b.innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>Право</th>${roles.map(r=>`<th class="r">${esc(ROLES[r].n)}</th>`).join('')}</tr></thead><tbody>${Object.keys(PERMS).map(p=>`<tr><td>${esc(PERM_NAMES[p]||p)}</td>${roles.map(r=>`<td class="r">${PERMS[p].includes(r)?`<span class="up">${ico('check')}</span>`:'<span class="mut">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
     <div class="grid g2" style="margin-top:16px">${roles.map(r=>`<div class="card"><b>${esc(ROLES[r].n)}</b><p class="mut" style="margin:6px 0 0">${esc(ROLES[r].d)}</p></div>`).join('')}</div>`;
    return;
  }
  if(!staff.length){b.innerHTML=`<div class="card">${emptyState('user','Сотрудников нет')}</div>`;return}
  b.innerHTML=`<div class="st-grid">${staff.map(s=>{const k=stStats(s),pl=s.plan?Math.round(sum(k.won,d=>d.sum)/s.plan*100):0;
   return `<div class="card"><div class="cell" style="margin-bottom:12px">${av(s.id)}<div style="min-width:0"><b>${esc(s.name)}</b><div class="mut" style="font-size:12px">${esc(s.role||'')}</div></div><span class="pill ${s.id===1?'':'gray'}" style="margin-left:auto">${esc(accessName(s.access||'manager'))}</span></div>
   <div class="mut" style="font-size:12.5px;line-height:1.7">${esc(s.dept||'')}${s.email?'<br>'+esc(s.email):''}${s.phone?'<br>'+esc(s.phone):''}</div>
   <div class="st-k"><div><small>Сделок в работе</small><b>${k.act.length}</b></div><div><small>Выиграно за 30 дн.</small><b>${k.won.length}</b></div><div><small>Клиентов</small><b>${k.cl.length}</b></div><div><small>Задач открыто</small><b class="${k.late.length?'down':''}">${k.open.length}${k.late.length?` (${k.late.length} проср.)`:''}</b></div></div>
   ${s.plan?`<div class="mut" style="font-size:12px;margin-top:10px">План на 30 дней: ${rub(sum(k.won,d=>d.sum))} из ${rub(s.plan)} · <b class="${pl>=100?'up':''}">${pl}%</b><div class="bar"><i style="width:${Math.min(pl,100)}%"></i></div></div>`:''}
   <div class="tools" style="margin:12px 0 0"><button class="btn sm" data-act="stLog" data-id="${s.id}">${ico('log')}Действия</button>${can('staff.manage')?`<button class="btn sm" data-act="editStaff" data-id="${s.id}">${ico('edit')}Изменить</button>${s.id!==1?`<button class="ibtn" style="width:32px;height:32px" data-act="delStaff" data-id="${s.id}" aria-label="Удалить">${ico('trash')}</button>`:''}`:''}</div></div>`}).join('')}</div>`;
}
A.stTab=b=>{ST.tab=b.dataset.t;V.staff()};
A.stLog=b=>{AC.mgr=String(b.dataset.id);AC.per='all';go('activity')};
A.newStaff=()=>staffForm();
A.editStaff=b=>staffForm(+b.dataset.id);
function staffForm(id){
  if(!can('staff.manage'))return toast('Недостаточно прав для управления сотрудниками');
  const s=id?staff.find(x=>x.id===id):{name:'',role:'',dept:'Продажи',email:'',phone:'',plan:0,access:'manager'};
  if(!s)return;
  const roleOpts=Object.keys(ROLES).filter(r=>r!=='owner'||s.id===1).map(r=>[r,ROLES[r].n]);
  modal({title:id?'Сотрудник':'Новый сотрудник',body:`<form class="form" onsubmit="return false">${fld('s_n','Имя и фамилия',s.name,{full:1})}${fld('s_r','Должность',s.role)}${fld('s_d','Отдел',s.dept,{type:'select',opts:['Руководство','Продажи','Финансы','Склад','Маркетинг']})}
   ${fld('s_a','Роль',s.access||'manager',{type:'select',opts:roleOpts,dis:s.id===1})}${fld('s_pl','План продаж на 30 дней, ₽',s.plan||0,{type:'number'})}${fld('s_e','Почта',s.email,{type:'email'})}${fld('s_p','Телефон',s.phone)}</form><p class="tk-hint">Для сотрудника не создаётся вход в систему. Роль определяет, какие действия ему доступны в интерфейсе после появления командных учётных записей.</p>`,
   foot:[{label:'Отмена',fn:closeModal},{label:id?'Сохранить':'Добавить',cls:'pri',fn:()=>{
     if(!val('s_n')){toast('Укажите имя');return}
     const o={name:val('s_n'),role:val('s_r')||'Сотрудник',dept:val('s_d'),email:val('s_e'),phone:val('s_p'),plan:Math.max(0,+val('s_pl')||0),access:s.id===1?'owner':val('s_a')};
     if(id){Object.assign(s,o);if(s.id===1){ME.name=o.name;ME.position=o.role;paintShell()}log(`изменил(а) профиль сотрудника «${s.name}»`,{ent:'staff'})}
     else{o.id=++nid;o.sales=0;o.status='В сети';o.color=COLORS[nid%8];staff.push(o);log(`добавил(а) сотрудника «${o.name}»`,{ent:'staff'})}
     persist();closeModal();toast('Сохранено');V.staff()}}]});
}
A.delStaff=b=>{
  if(!can('staff.manage'))return toast('Недостаточно прав');
  const s=staff.find(x=>x.id==b.dataset.id);if(!s||s.id===1)return;
  const k=stStats(s),nc=clients.filter(c=>c.mgr===s.id).length,nd=deals.filter(d=>d.mgr===s.id).length,nt=tasks.filter(t=>t.mgr===s.id&&t.status!=='Выполнена').length;
  confirmBox(`Удалить сотрудника «${esc(s.name)}»? Его клиенты (${nc}), сделки (${nd}) и открытые задачи (${nt}) будут переданы владельцу. Запись можно восстановить из корзины, но назначения не вернутся.`,()=>{
    clients.forEach(c=>{if(c.mgr===s.id)c.mgr=1});deals.forEach(d=>{if(d.mgr===s.id)d.mgr=1});tasks.forEach(t=>{if(t.mgr===s.id&&t.status!=='Выполнена')t.mgr=1});
    trashPut('staff',s);persist();toast('Сотрудник перемещён в корзину');drawNav();V.staff()},'Удалить');
};

</script>
<script>
/* Встроенный файл: assets/js/comms.js */
/* ==========================================================================
   comms.js — коммуникационный центр: «Сообщения» (V.messages) и «Звонки» (V.phone)
   Честная модель: переписка и звонки ВНОСЯТСЯ вручную и сохраняются в CRM/историю клиента.
   Автоматической отправки в Telegram/WhatsApp/почту нет (нужны ключи и сервер).
   Внутреннего чата сотрудников нет: см. supabase/migrations/002_team_workspaces.sql (этап 2).
   ========================================================================== */
if(!CH.other)CH.other={n:'Другое',c:'#8e8e93',l:'•'};
const cm={q:'',flt:'all',ch:'',tab:'dlg',draft:{}};
const cmPh={t:'all',m:'',c:'',p:'all'};
const cmNow=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const cmCh=k=>CH[k]||CH.other;
const cmChb=k=>`<span class="chb" style="background:${cmCh(k).c}" title="${esc(cmCh(k).n)}">${esc(cmCh(k).l)}</span>`;
const cmLast=d=>d.msgs[d.msgs.length-1]||null;
const cmFdate=s=>s?fd(s):'';
const CM_NOTICE='Сообщение сохраняется в CRM; автоматической отправки в мессенджер/почту пока нет — отправьте его вручную.';
function cmCopy(text){
  const ok=()=>toast('Скопировано');
  const fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Не удалось скопировать')}t.remove()};
  try{navigator.clipboard?.writeText?navigator.clipboard.writeText(text).then(ok,fb):fb()}catch(e){fb()}
}

/* ---------- Напоминания о повторном контакте ---------- */
function contactDue(){
  const t=iso(0);
  return clients.filter(c=>c.nextContact&&c.nextContact<=t).sort((a,b)=>a.nextContact<b.nextContact?-1:1);
}
const cmUpcoming=()=>clients.filter(c=>c.nextContact&&c.nextContact>iso(0));
function cmDuePanel(){
  const due=contactDue();
  if(!due.length)return '';
  return `<section class="card cm-due" aria-label="Пора связаться"><div class="cm-dh">${ico('bell')}<b>Пора связаться</b><span class="pill warn">${due.length}</span></div>
   <div class="cm-dl">${due.map(c=>`<div class="cm-dr"><span class="av" style="background:${COLORS[c.id%8]}">${esc(ini(c.name))}</span>
     <div class="cm-dm"><a href="#" data-act="client" data-id="${c.id}">${esc(c.name)}</a><small class="mut">${esc(c.company||'')} · ${c.nextContact<iso(0)?'просрочено с ':'сегодня, '}${esc(fd(c.nextContact))}</small></div>
     <div class="cm-da"><button class="btn sm" data-act="cmWrite" data-id="${c.id}">${ico('msg')}Написать</button><button class="btn sm" data-act="dial" data-id="${c.id}">${ico('phone')}Позвонить</button><button class="btn sm pri" data-act="cmDone" data-id="${c.id}">${ico('check')}Отметить выполненным</button></div></div>`).join('')}</div></section>`;
}
A.cmDone=b=>{
  const c=cliOf(+b.dataset.id);if(!c)return;
  delete c.nextContact;addHist(c.id,'Контакт','Повторный контакт выполнен');
  log(`отметил(а) повторный контакт: «${c.name}»`,{ent:'client',id:c.id});persist();toast('Отмечено выполненным');
  if(cur==='messages')V.messages();else{try{drawNav()}catch(e){}}
};
A.cmRemind=b=>{
  const c=cliOf(+b.dataset.id);if(!c)return;
  modal({title:'Напомнить связаться',body:`<p class="mut" style="margin-top:0">Клиент «${esc(c.name)}» появится в панели «Пора связаться» и в уведомлениях в выбранный день.</p>
   <div class="form">${fld('cm_d','Дата',c.nextContact||addDays(iso(0),3),{type:'date',full:1})}</div>
   <div class="cm-quick">${[[1,'Завтра'],[3,'Через 3 дня'],[7,'Через неделю'],[30,'Через месяц']].map(x=>`<button type="button" class="btn sm" data-act="cmQuick" data-n="${x[0]}">${x[1]}</button>`).join('')}</div>`,
   foot:[{label:'Отмена',fn:closeModal},...(c.nextContact?[{label:'Снять напоминание',fn:()=>{delete c.nextContact;persist();closeModal();toast('Напоминание снято');cmRefresh()}}]:[]),
    {label:'Сохранить',cls:'pri',fn:()=>{const d=val('cm_d');if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast('Укажите дату');return}
      c.nextContact=d;addHist(c.id,'Напоминание','Напомнить связаться: '+fd(d));persist();closeModal();toast('Напоминание сохранено');cmRefresh()}}]});
};
A.cmQuick=b=>{const i=$('#cm_d');if(i)i.value=addDays(iso(0),+b.dataset.n)};
function cmRefresh(){if(cur==='messages')V.messages();drawNav()}

/* ---------- Диалоги ---------- */
function cmFiltered(){
  const q=cm.q.trim().toLowerCase();
  return dialogs.filter(d=>{
    const c=cliOf(d.cid);if(!c)return false;
    if(cm.flt==='unread'&&!d.unread)return false;
    if(cm.ch&&d.ch!==cm.ch)return false;
    if(!q)return true;
    return [c.name,c.company,c.phone,cmCh(d.ch).n,...d.msgs.map(m=>m.t)].some(s=>String(s||'').toLowerCase().includes(q));
  });
}
V.messages=()=>{
  const unread=dialogs.reduce((a,d)=>a+(d.unread||0),0);
  const head=`<div class="ph"><div><h1>Сообщения</h1><p>Переписка с клиентами в одном окне. Входящие вносятся вручную, всё сохраняется в карточке клиента.</p></div><div class="acts"><button class="btn" data-act="cmTab" data-t="${cm.tab==='tpl'?'dlg':'tpl'}">${ico(cm.tab==='tpl'?'msg':'file')}${cm.tab==='tpl'?'Диалоги':'Шаблоны'}</button><button class="btn pri" data-act="newDlg">${ico('plus')}Новый диалог</button></div></div>`;
  const note=`<div class="cm-note">${ico('users')}<span>Командный чат сотрудников появится с многопользовательской схемой (<code>supabase/migrations/002_team_workspaces.sql</code>, этап 2). Сейчас в систему входит только владелец, остальные сотрудники — записи без учётных записей.</span></div>`;
  if(cm.tab==='tpl'){$('#view').innerHTML=head+cmDuePanel()+cmTplView()+note;return}
  if(!dialogs.length){$('#view').innerHTML=head+cmDuePanel()+`<div class="card">${emptyState('msg','Диалогов пока нет','Создайте диалог с клиентом — подключать канал связи не нужно, канал это просто метка. Историю можно вести вручную.',`<button class="btn pri" data-act="newDlg">${ico('plus')}Новый диалог</button>`)}</div>`+note;return}
  if(!dialogs.find(d=>d.id===curDlg))curDlg=dialogs[0].id;
  $('#view').innerHTML=head+cmDuePanel()+`<div class="card chat cm-chat" id="chat"><div class="dl cm-dlp"><div class="cm-lh"><div class="cm-sr">${ico('search')}<input id="cmQ" type="search" placeholder="Поиск по диалогам" value="${esc(cm.q)}" aria-label="Поиск по диалогам" autocomplete="off"></div>
   <div class="cm-fl"><div class="seg"><button data-act="cmFlt" data-f="all" class="${cm.flt==='all'?'on':''}">Все</button><button data-act="cmFlt" data-f="unread" class="${cm.flt==='unread'?'on':''}">Непрочитанные${unread?` · ${unread}`:''}</button></div>
   <select id="cmChSel" aria-label="Канал"><option value="">Все каналы</option>${['tg','wa','mail','other'].map(k=>`<option value="${k}" ${cm.ch===k?'selected':''}>${esc(cmCh(k).n)}</option>`).join('')}</select></div></div><div class="cm-rows" id="cmRows"></div></div><div class="win" id="win"></div></div>`+note;
  cmRows();cmWin();
};
function cmRows(){
  const el=$('#cmRows');if(!el)return;
  const list=cmFiltered();
  el.innerHTML=list.length?list.map(d=>{
    const c=cliOf(d.cid),m=cmLast(d),due=c.nextContact&&c.nextContact<=iso(0);
    return `<button class="dlg cm-dlg ${d.id===curDlg?'on':''}" data-act="dlg" data-id="${d.id}"><span class="av" style="background:${COLORS[c.id%8]}">${esc(ini(c.name))}</span><span class="grow"><div><b>${esc(c.name)}</b><span class="mut cm-tm">${esc(m?.time||'')}</span></div><p>${m?(m.me?'Вы: ':'')+esc(m.t):'Нет сообщений'}</p>${c.nextContact?`<span class="cm-rem ${due?'due':''}">${ico('bell')}${esc(fd(c.nextContact))}</span>`:''}</span>${cmChb(d.ch)}${d.unread?`<span class="pill cm-unr">${d.unread}</span>`:''}</button>`}).join('')
   :emptyState('search',cm.q||cm.flt!=='all'||cm.ch?'Ничего не найдено':'Нет диалогов','Измените поиск или фильтры.',`<button class="btn sm" data-act="cmReset">Сбросить</button>`);
}
function cmWin(){
  const w=$('#win');if(!w)return;
  const d=dialogs.find(x=>x.id===curDlg),c=d&&cliOf(d.cid);
  if(!d||!c){w.innerHTML=emptyState('msg','Выберите диалог','Слева — список диалогов.');return}
  const due=c.nextContact&&c.nextContact<=iso(0);
  w.innerHTML=`<div class="hd cm-hd"><button class="ibtn back" data-act="dback" aria-label="Назад">${ico('back')}</button><span class="av" style="background:${COLORS[c.id%8]}">${esc(ini(c.name))}</span><div class="cm-who"><b>${esc(c.name)}</b><div class="mut" style="font-size:12px">${esc(c.company||'')} · ${esc(cmCh(d.ch).n)}</div></div>
    <div class="cm-ha"><button class="btn sm" data-act="inMsg">${ico('in')}Входящее</button><button class="btn sm" data-act="cmRemind" data-id="${c.id}">${ico('bell')}Напомнить</button><button class="btn sm" data-act="client" data-id="${c.id}">Карточка</button></div></div>
   ${c.nextContact?`<div class="cm-rb ${due?'due':''}">${ico('clock')}<span>${due?'Пора связаться':'Связаться'}: ${esc(fd(c.nextContact))}</span>${due?`<button class="btn sm pri" data-act="cmDone" data-id="${c.id}">Отметить выполненным</button>`:`<button class="btn sm" data-act="cmRemind" data-id="${c.id}">Изменить</button>`}</div>`:''}
   <div class="ms" id="ms">${d.msgs.length?d.msgs.map(m=>`<div class="msg cm-msg ${m.me?'me':''}">${esc(m.t)}<small>${m.me?'сохранено · ':''}${esc(m.time||'')}</small></div>`).join(''):emptyState('msg','Переписка пуста','Внесите входящее сообщение клиента или сохраните своё в историю.')}</div>
   <div class="cm-comp"><div class="cm-warn" role="note">${ico('alert')}<span>${CM_NOTICE}</span></div>
    <div class="cm-tr"><select id="cmTplSel" aria-label="Вставить шаблон"><option value="">Вставить шаблон…</option>${templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="btn sm" data-act="cmCopyInp" type="button">${ico('file')}Копировать</button></div>
    <div class="cm-ir"><textarea id="cmInp" rows="2" placeholder="Текст сообщения…" aria-label="Сообщение">${esc(cm.draft[d.id]||'')}</textarea><button class="btn pri" data-act="cmSave" type="button">${ico('send')}Сохранить в историю</button></div></div>`;
  const ms=$('#ms');ms.scrollTop=ms.scrollHeight;
}
A.dlg=b=>{curDlg=+b.dataset.id;const d=dialogs.find(x=>x.id===curDlg);if(d)d.unread=0;drawNav();$$('.cm-dlg').forEach(e=>e.classList.toggle('on',+e.dataset.id===curDlg));cmRows();cmWin();$('#chat')?.classList.add('open')};
A.dback=()=>$('#chat')?.classList.remove('open');
function drawDlg(){cmRows();cmWin()}
A.cmFlt=b=>{cm.flt=b.dataset.f;V.messages()};
A.cmReset=()=>{cm.q='';cm.flt='all';cm.ch='';V.messages()};
A.cmTab=b=>{cm.tab=b.dataset.t;V.messages()};
A.cmCopyInp=()=>{const v=$('#cmInp')?.value.trim();if(!v){toast('Поле пустое');return}cmCopy(v)};
A.cmSave=()=>{
  const d=dialogs.find(x=>x.id===curDlg),inp=$('#cmInp');if(!d||!inp)return;
  const v=inp.value.trim();if(!v){toast('Введите текст сообщения');return}
  d.msgs.push({me:1,t:v,time:cmNow(),ts:Date.now()});
  dialogs.splice(dialogs.indexOf(d),1);dialogs.unshift(d);
  delete cm.draft[d.id];
  addHist(d.cid,'Сообщение',`Сохранено в историю (${cmCh(d.ch).n}): ${v.slice(0,80)}`);
  log(`сохранил(а) сообщение клиенту «${cliOf(d.cid)?.name||''}»`,{ent:'client',id:d.cid});persist();
  cmRows();cmWin();$('#cmInp')?.focus();toast('Сохранено в историю');
};
A.inMsg=()=>{
  const d=dialogs.find(x=>x.id===curDlg);if(!d)return;
  modal({title:'Входящее сообщение',body:`<p class="mut" style="margin-top:0">Внесите сообщение, которое клиент прислал (${esc(cmCh(d.ch).n)}). Автоматический приём из мессенджера появится вместе с серверной частью.</p><div class="form">${fld('i_t','Текст сообщения','',{type:'textarea',full:1})}</div>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Добавить',cls:'pri',fn:()=>{const v=val('i_t');if(!v){toast('Введите текст');return}
     d.msgs.push({me:0,t:v,time:cmNow(),ts:Date.now()});addHist(d.cid,'Сообщение',`${cmCh(d.ch).n}: ${v.slice(0,80)}`);
     fire('Новое сообщение',{cid:d.cid,what:cliOf(d.cid)?.name});persist();closeModal();drawNav();cmRows();cmWin()}}]});
};
A.newDlg=b=>{
  if(!clients.length){toast('Сначала добавьте клиента');clientForm();return}
  modal({title:'Новый диалог',body:`<form class="form">${fld('m_c','Клиент',clients[0].id,{type:'select',full:1,opts:clients.map(c=>[c.id,c.name+' — '+(c.company||c.phone||'')])})}${fld('m_ch','Канал (метка)','tg',{type:'select',opts:['tg','wa','mail','other'].map(k=>[k,cmCh(k).n])})}${fld('m_t','Первое сообщение клиента (по желанию)','',{type:'textarea',full:1})}</form><p class="mut" style="margin:8px 0 0">Подключать канал не нужно: это только метка. Отправка из CRM не выполняется.</p>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Создать',cls:'pri',fn:()=>{
     const cid=+val('m_c'),ch=val('m_ch'),t=val('m_t');
     let d=dialogs.find(x=>x.cid===cid&&x.ch===ch);
     if(!d){d={id:++nid,cid,ch,unread:0,msgs:[]};dialogs.unshift(d);addHist(cid,'Сообщение',`Создан диалог (${cmCh(ch).n})`)}
     if(t){d.msgs.push({me:0,t,time:cmNow(),ts:Date.now()});addHist(cid,'Сообщение',`${cmCh(ch).n}: ${t.slice(0,80)}`)}
     curDlg=d.id;cm.tab='dlg';persist();closeModal();drawNav();V.messages();$('#chat')?.classList.add('open')}}]});
};
A.cmWrite=b=>{
  const cid=+b.dataset.id;let d=dialogs.find(x=>x.cid===cid);
  if(!d){d={id:++nid,cid,ch:'other',unread:0,msgs:[]};dialogs.unshift(d);persist()}
  curDlg=d.id;cm.tab='dlg';cm.q='';cm.flt='all';cm.ch='';if(cur!=='messages')go('messages');else V.messages();$('#chat')?.classList.add('open');
};
document.addEventListener('input',e=>{
  if(e.target.id==='cmQ'){cm.q=e.target.value;cmRows()}
  else if(e.target.id==='cmInp'){const d=dialogs.find(x=>x.id===curDlg);if(d)cm.draft[d.id]=e.target.value}
});
document.addEventListener('change',e=>{
  if(e.target.id==='cmChSel'){cm.ch=e.target.value;cmRows()}
  else if(e.target.id==='cmTplSel'){
    const t=templates.find(x=>x.id===+e.target.value),d=dialogs.find(x=>x.id===curDlg),inp=$('#cmInp');
    if(t&&d&&inp){const f=fillTpl(t.text,cliOf(d.cid));inp.value=inp.value.trim()?inp.value.replace(/\s*$/,'')+'\n'+f:f;cm.draft[d.id]=inp.value;inp.focus()}
    e.target.value='';
  }else if(e.target.id==='cmPm'){cmPh.m=e.target.value;V.phone()}
  else if(e.target.id==='cmPc'){cmPh.c=e.target.value;V.phone()}
  else if(e.target.id==='cmPp'){cmPh.p=e.target.value;V.phone()}
});
document.addEventListener('keydown',e=>{if(e.target.id==='cmInp'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();A.cmSave()}});

/* ---------- Шаблоны ---------- */
function cmTplView(){
  return `<div class="cm-hint card">${ico('tag')}<span>Плейсхолдеры подставляются из карточки клиента при вставке в сообщение: <code>{имя}</code> <code>{компания}</code> <code>{менеджер}</code> <code>{моя_компания}</code>.</span></div>`+
  (templates.length?`<div class="cm-tpls">${templates.map(t=>`<article class="card cm-tpl"><div class="cm-th"><b>${esc(t.name)}</b><div class="acts"><button class="btn sm" data-act="cmTplCopy" data-id="${t.id}">${ico('file')}Копировать</button><button class="btn sm" data-act="cmTplEdit" data-id="${t.id}">${ico('edit')}Изменить</button><button class="ibtn" data-act="cmTplDel" data-id="${t.id}" aria-label="Удалить шаблон">${ico('trash')}</button></div></div><p>${esc(t.text)}</p></article>`).join('')}</div>`
   :`<div class="card">${emptyState('file','Шаблонов нет','Заготовки ответов экономят время: создайте первую.',`<button class="btn pri" data-act="cmTplEdit">${ico('plus')}Создать шаблон</button>`)}</div>`)+
  (templates.length?`<div style="margin-top:14px"><button class="btn pri" data-act="cmTplEdit">${ico('plus')}Создать шаблон</button></div>`:'');
}
A.cmTplCopy=b=>{const t=templates.find(x=>x.id===+b.dataset.id);if(t)cmCopy(t.text)};
A.cmTplEdit=b=>{
  const t=templates.find(x=>x.id===+b?.dataset?.id);
  modal({title:t?'Изменить шаблон':'Новый шаблон',body:`<div class="form">${fld('tp_n','Название',t?.name||'',{full:1})}${fld('tp_t','Текст',t?.text||'',{type:'textarea',full:1})}</div>
   <div class="cm-quick">${['{имя}','{компания}','{менеджер}','{моя_компания}'].map(p=>`<button type="button" class="btn sm" data-act="cmPhIns" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>
   <p class="mut" style="margin:8px 0 0">Нажмите на плейсхолдер, чтобы вставить его в текст.</p>`,
   foot:[{label:'Отмена',fn:closeModal},{label:'Сохранить',cls:'pri',fn:()=>{
     const n=val('tp_n'),x=val('tp_t');if(!n||!x){toast('Заполните название и текст');return}

     persist();closeModal();toast('Шаблон сохранён');if(cur==='messages')V.messages()}}]});
};
A.cmPhIns=b=>{
  const i=$('#tp_t');if(!i)return;const p=b.dataset.p,s=i.selectionStart??i.value.length,e=i.selectionEnd??s;
  i.value=i.value.slice(0,s)+p+i.value.slice(e);i.focus();i.selectionStart=i.selectionEnd=s+p.length;
};
A.cmTplDel=b=>{
  const t=templates.find(x=>x.id===+b.dataset.id);if(!t)return;
  confirmBox(`Удалить шаблон «${esc(t.name)}»?`,()=>{templates.splice(templates.indexOf(t),1);persist();toast('Шаблон удалён');V.messages()});
};

/* ---------- Звонки ---------- */
const CM_CT={in:['in','Входящий','ok'],out:['out','Исходящий','info'],miss:['miss','Пропущенный','bad']};
function cmCalls(){
  const r=periodRange(cmPh.p);
  return calls.filter(c=>(cmPh.t==='all'||c.type===cmPh.t)&&(!cmPh.m||String(c.mgr)===cmPh.m)&&(!cmPh.c||String(c.cid)===cmPh.c)&&(cmPh.p==='all'||inR(c.at,r)))
    .sort((a,b)=>a.at<b.at?1:a.at>b.at?-1:0);
}
V.phone=()=>{
  const list=cmCalls(),n=t=>list.filter(c=>c.type===t).length,talk=sum(list,c=>c.dur),talked=list.filter(c=>c.dur>0);
  const cids=[...new Set(calls.map(c=>c.cid))].map(id=>cliOf(id)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  const mgrs=[...new Set(calls.map(c=>c.mgr))];
  const filt=cmPh.t!=='all'||cmPh.m||cmPh.c||cmPh.p!=='all';
  $('#view').innerHTML=`<div class="ph"><div><h1>Звонки</h1><p>Журнал звонков компании. Набирайте номер на телефоне или в своей IP-телефонии — здесь фиксируются звонок и его длительность.</p></div><div class="acts"><button class="btn" data-act="logCall">${ico('plus')}Записать звонок</button><button class="btn pri" data-act="dial">${ico('phone')}Таймер звонка</button></div></div>
  <div class="grid g4 cm-kpis"><div class="card kpi"><div class="l">Входящие</div><div class="v">${n('in')}</div></div><div class="card kpi"><div class="l">Исходящие</div><div class="v">${n('out')}</div></div><div class="card kpi"><div class="l">Пропущенные</div><div class="v ${n('miss')?'down':''}">${n('miss')}</div></div><div class="card kpi"><div class="l">Время разговоров</div><div class="v">${Math.round(talk/60)} мин</div><small class="mut">${talked.length?'в среднем '+dur(Math.round(talk/talked.length)):'нет разговоров'} · всего ${list.length}</small></div></div>
  <div class="tools cm-pt"><div class="seg">${[['all','Все'],['in','Входящие'],['out','Исходящие'],['miss','Пропущенные']].map(x=>`<button data-act="pf" data-f="${x[0]}" class="${cmPh.t===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
   <select id="cmPm" aria-label="Сотрудник"><option value="">Все сотрудники</option>${mgrs.map(id=>`<option value="${id}" ${cmPh.m===String(id)?'selected':''}>${esc(mgrOf(id).name)}</option>`).join('')}</select>
   <select id="cmPc" aria-label="Клиент"><option value="">Все клиенты</option>${cids.map(c=>`<option value="${c.id}" ${cmPh.c===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
   <select id="cmPp" aria-label="Период">${PERIODS.map(p=>`<option value="${p[0]}" ${cmPh.p===p[0]?'selected':''}>${esc(p[1])}</option>`).join('')}</select>
   ${filt?`<button class="btn sm" data-act="cmPReset">${ico('x')}Сбросить</button>`:''}</div>
  <div class="tw"><table><thead><tr><th>Тип</th><th>Клиент</th><th>Сотрудник</th><th>Длительность</th><th>Дата и время</th><th></th></tr></thead><tbody>${list.length?list.map(c=>{
    const cl=cliOf(c.cid),T=CM_CT[c.type]||CM_CT.out;
    return `<tr><td><span class="pill ${T[2]}">${ico(T[0])}${T[1]}</span></td><td>${cl?`<a href="#" data-act="client" data-id="${cl.id}" style="color:var(--fg)">${esc(cl.name)}</a><br><small class="mut">${esc(cl.phone||'')}</small>`:'<span class="mut">Клиент удалён</span>'}</td><td>${person(c.mgr)}</td><td>${dur(c.dur)}</td><td>${esc(fd(c.at))}, ${esc(c.at.slice(11))}</td><td>${cl?`<button class="btn sm" data-act="dial" data-id="${cl.id}">${ico('phone')}Перезвонить</button>`:''}</td></tr>`}).join('')
   :`<tr><td colspan="6">${calls.length?emptyState('filter','Нет звонков по фильтрам','Измените фильтры или сбросьте их.',`<button class="btn sm" data-act="cmPReset">Сбросить фильтры</button>`):emptyState('phone','Звонков пока нет','Нажмите «Записать звонок», чтобы внести звонок вручную.')}</td></tr>`}</tbody></table></div>`;
};
A.pf=b=>{cmPh.t=b.dataset.f;V.phone()};
A.cmPReset=()=>{Object.assign(cmPh,{t:'all',m:'',c:'',p:'all'});V.phone()};

</script>
<script>
/* Встроенный файл: assets/js/automation.js */
/* ==========================================================================
   automation.js — сценарии «Когда → Если → Тогда» (контракт: docs/CONTRACT.md)
   auto = {id,name,on,trig,tp?:{days},conds:[{f,op,v}],steps:[{a,p}],runs,last,log:[{at,what,result}],fired:{}}
   Публичное: fire(trig,ctx), autoTick(), migrateAutos(), AU_TRIGS
   ========================================================================== */

/* ---------- Справочники ---------- */
const AU_TRIGS=['Создан клиент','Создана сделка','Смена этапа сделки','Сделка в ожидании оплаты','Сделка успешно завершена','Получена оплата','Пропущенный звонок','Новое сообщение','Нет обратной связи N дней','Просрочена задача'];
const AU_TRIG_NOFB='Нет обратной связи N дней',AU_TRIG_OVER='Просрочена задача';
/* Какие сущности доступны в контексте события: c — клиент, d — сделка, t — задача */
const AU_TRIG_ENT={'Создан клиент':'c','Создана сделка':'cd','Смена этапа сделки':'cd','Сделка в ожидании оплаты':'cd','Сделка успешно завершена':'cd','Получена оплата':'cd','Пропущенный звонок':'c','Новое сообщение':'c',[AU_TRIG_NOFB]:'cd',[AU_TRIG_OVER]:'ct'};
const AU_TRIG_HINT={'Создан клиент':'в CRM добавлен новый клиент','Создана сделка':'создана новая сделка','Смена этапа сделки':'сделка перемещена на другой этап','Сделка в ожидании оплаты':'сделка перешла на этап «Ожидание оплаты»','Сделка успешно завершена':'сделка закрыта успешно','Получена оплата':'зафиксирована оплата','Пропущенный звонок':'клиент звонил, но звонок пропущен','Новое сообщение':'клиент написал сообщение',[AU_TRIG_NOFB]:'у клиента с активной сделкой нет контактов заданное число дней',[AU_TRIG_OVER]:'срок задачи прошёл, а она не выполнена'};
const AU_TRIG_LBL={'Создан клиент':'создан клиент','Создана сделка':'создана сделка','Смена этапа сделки':'сделка сменила этап','Сделка в ожидании оплаты':'сделка ожидает оплаты','Сделка успешно завершена':'сделка успешно завершена','Получена оплата':'получена оплата','Пропущенный звонок':'пропущен звонок','Новое сообщение':'пришло новое сообщение',[AU_TRIG_OVER]:'задача просрочена'};

const auMgrOpts=()=>mgrOpts();
const AU_FIELDS=[
  {k:'c.status',e:'c',l:'Статус клиента',t:'sel',opts:()=>CSTAT},
  {k:'c.source',e:'c',l:'Источник клиента',t:'sel',opts:()=>SOURCES},
  {k:'c.mgr',e:'c',l:'Менеджер клиента',t:'sel',opts:auMgrOpts},
  {k:'c.company',e:'c',l:'Компания клиента',t:'txt'},
  {k:'c.tags',e:'c',l:'Тег клиента',t:'tag'},
  {k:'d.sum',e:'d',l:'Сумма сделки',t:'num'},
  {k:'d.stage',e:'d',l:'Этап сделки',t:'sel',opts:()=>STAGES.map(s=>[s.id,s.name])},
  {k:'d.mgr',e:'d',l:'Менеджер сделки',t:'sel',opts:auMgrOpts},
  {k:'d.prob',e:'d',l:'Вероятность сделки, %',t:'num'},
  {k:'t.prio',e:'t',l:'Приоритет задачи',t:'sel',opts:()=>PRIO},
  {k:'t.status',e:'t',l:'Статус задачи',t:'sel',opts:()=>TSTAT},
  {k:'t.mgr',e:'t',l:'Исполнитель задачи',t:'sel',opts:auMgrOpts}
];
const AU_OPS={sel:['=','≠'],txt:['=','≠','содержит'],tag:['=','содержит'],num:['=','≠','>','<']};
const auField=k=>AU_FIELDS.find(f=>f.k===k);
const auOpts=f=>(f.opts?f.opts():[]).map(o=>Array.isArray(o)?o:[o,o]);

/* ---------- Контекст события ---------- */
let auDepth=0,auStageCtx=null;
const auHead=()=>(staff.find(s=>s.access==='head')||staff.find(s=>s.access==='owner')||staff[0]||{id:1});
function auEnv(trig,ctx){
  const c=ctx.cid?cliOf(ctx.cid):null;
  let d=ctx.did?deals.find(x=>x.id==ctx.did):null;
  if(!d&&auStageCtx&&trig==='Смена этапа сделки'&&auStageCtx.d.cid===ctx.cid)d=auStageCtx.d;
  const t=ctx.tid?tasks.find(x=>x.id==ctx.tid):null;
  const mgr=+(ctx.mgr||(d&&d.mgr)||(t&&t.mgr)||(c&&c.mgr)||1);
  return {trig,ctx,c,d,t,mgr};
}
function auFill(text,env,a){
  const {c,d,t,ctx}=env;
  return String(text||'').replace(/\{имя\}/g,c?(c.name||''):'').replace(/\{компания\}/g,c?(c.company||''):'')
    .replace(/\{сделка\}/g,d?d.title:'').replace(/\{сумма\}/g,d?rub(d.sum):'').replace(/\{задача\}/g,t?t.title:'')
    .replace(/\{менеджер\}/g,mgrOf(env.mgr).name||'').replace(/\{событие\}/g,ctx.what||env.trig)
    .replace(/\{дней\}/g,String((a&&a.tp&&a.tp.days)||3));
}
const auWho=(who,env)=>{if(who==='head')return auHead().id;if(who==='ctx'||who==='mgr'||!who)return env.mgr;return +who||env.mgr};

/* ---------- Условия ---------- */
function auCond(cd,env){
  const f=auField(cd.f);if(!f)return false;
  const ent=env[f.e];if(!ent)return false;
  const key=cd.f.split('.')[1],raw=ent[key],v=cd.v;
  const lc=x=>String(x??'').trim().toLowerCase();
  if(f.t==='tag'){const tags=(raw||[]).map(lc);return cd.op==='='?tags.includes(lc(v)):tags.some(x=>x.includes(lc(v)))}
  if(f.t==='num'){const a=+raw,b=+v;if(isNaN(a)||isNaN(b))return false;return cd.op==='='?a===b:cd.op==='≠'?a!==b:cd.op==='>'?a>b:cd.op==='<'?a<b:false}
  const a=lc(raw),b=lc(v);
  return cd.op==='='?a===b:cd.op==='≠'?a!==b:cd.op==='содержит'?a.includes(b):false;
}
const auCheck=(a,env)=>(a.conds||[]).every(cd=>auCond(cd,env));

/* ---------- Действия ---------- */
const AU_ACTS={
  task:{n:'Создать задачу',ic:'tasks',need:'',def:()=>({title:'Связаться с клиентом {имя}',days:1,who:'ctx'}),
    fields:[{k:'title',l:'Название задачи',t:'text',ph:'Позвонить {имя}'},{k:'days',l:'Срок, через дней',t:'num'},{k:'who',l:'Исполнитель',t:'sel',opts:()=>[['ctx','Ответственный менеджер'],['head','Руководитель'],...auMgrOpts()]}],
    valid:p=>!String(p.title||'').trim()?'Укажите название задачи':(p.days===''||isNaN(+p.days)||+p.days<0)?'Срок задачи — число дней от 0':'',
    run:(p,env,a)=>{const c=env.c,id=++nid;
      tasks.push({id,title:auFill(p.title,env,a)||a.name,desc:'Создано автоматически: сценарий «'+a.name+'»',mgr:auWho(p.who,env),due:iso(Math.max(0,+p.days||0)),prio:'Средний',status:'К выполнению',cid:c?c.id:null,did:env.d?env.d.id:undefined,comments:[]});
      return 'создана задача';},
    say:p=>`создать задачу «${p.title||'…'}» со сроком ${+p.days>0?'через '+p.days+' дн.':'сегодня'} (${p.who==='head'?'руководителю':p.who==='ctx'||!p.who?'ответственному':'для '+mgrOf(p.who).name})`},
  notify:{n:'Отправить уведомление',ic:'bell',need:'',def:()=>({who:'mgr',text:'{событие}'}),
    fields:[{k:'who',l:'Кому',t:'sel',opts:()=>[['mgr','Ответственному менеджеру'],['head','Руководителю']]},{k:'text',l:'Текст',t:'text',ph:'Клиент {имя} ждёт ответа'}],
    valid:p=>!String(p.text||'').trim()?'Укажите текст уведомления':'',
    run:(p,env,a)=>{const to=auWho(p.who,env),txt=auFill(p.text,env,a);
      notify({type:'auto',text:`Для ${mgrOf(to).name}: ${txt} (сценарий «${a.name}»)`,go:env.d?'deals':env.t?'tasks':env.c?'clients':null,ent:env.c?{kind:'client',id:env.c.id}:null});
      return 'уведомление: '+mgrOf(to).name;},
    say:p=>`уведомить ${p.who==='head'?'руководителя':'ответственного'}: «${p.text||'…'}»`},
  status:{n:'Изменить статус клиента',ic:'users',need:'c',def:()=>({status:'В работе'}),
    fields:[{k:'status',l:'Новый статус',t:'sel',opts:()=>CSTAT}],valid:p=>p.status?'':'Выберите статус',
    run:(p,env)=>{env.c.status=p.status;return 'статус → '+p.status},say:p=>`изменить статус клиента на «${p.status||'…'}»`},
  assign:{n:'Назначить менеджера',ic:'user',need:'c',def:()=>({mgr:(auMgrOpts()[0]||[1])[0]}),
    fields:[{k:'mgr',l:'Менеджер',t:'sel',opts:auMgrOpts}],valid:p=>p.mgr?'':'Выберите менеджера',
    run:(p,env)=>{env.c.mgr=+p.mgr;if(env.d&&env.d.cid===env.c.id)env.d.mgr=+p.mgr;return 'менеджер → '+mgrOf(p.mgr).name},say:p=>`назначить менеджера ${p.mgr?mgrOf(p.mgr).name:'…'}`},
  tag:{n:'Добавить тег клиенту',ic:'tag',need:'c',def:()=>({tag:''}),
    fields:[{k:'tag',l:'Тег',t:'text',ph:'Горячий'}],valid:p=>String(p.tag||'').trim()?'':'Укажите тег',
    run:(p,env)=>{const t=String(p.tag).trim();env.c.tags=env.c.tags||[];if(env.c.tags.includes(t))return 'тег уже есть';env.c.tags.push(t);return 'тег «'+t+'»'},say:p=>`добавить тег «${p.tag||'…'}»`},
  stage:{n:'Перенести сделку на этап',ic:'deal',need:'d',def:()=>({stage:'contact'}),
    fields:[{k:'stage',l:'Этап',t:'sel',opts:()=>STAGES.map(s=>[s.id,s.name])}],valid:p=>p.stage?'':'Выберите этап',
    run:(p,env)=>{const d=env.d;if(d.stage===p.stage)return 'сделка уже на этом этапе';setStage(d,p.stage);return 'сделка → '+(STAGES.find(s=>s.id===p.stage)||{}).name},say:p=>`перенести сделку на этап «${(STAGES.find(s=>s.id===p.stage)||{}).name||'…'}»`},
  remind:{n:'Напомнить о повторном контакте',ic:'clock',need:'c',def:()=>({days:3}),
    fields:[{k:'days',l:'Через дней',t:'num'}],valid:p=>(p.days===''||isNaN(+p.days)||+p.days<0)?'Укажите число дней':'',
    run:(p,env)=>{env.c.nextContact=addDays(iso(0),Math.max(0,+p.days||0));return 'повторный контакт '+fdf(env.c.nextContact)},say:p=>`назначить повторный контакт через ${p.days??'…'} дн.`},
  stats:{n:'Обновить статистику продаж',ic:'chart',need:'',def:()=>({}),fields:[],valid:()=>'',
    run:()=>{recompute();if(typeof drawNav==='function')drawNav();return 'статистика пересчитана'},say:()=>'обновить статистику продаж менеджеров'}
};
const auNeedTxt={c:'клиента',d:'сделки',t:'задачи'};

/* ---------- Ядро: выполнение сценария ---------- */
function auPush(a,what,result){
  a.log=Array.isArray(a.log)?a.log:[];a.log.unshift({at:Date.now(),what:String(what||'').slice(0,160),result:String(result||'').slice(0,400)});
  if(a.log.length>20)a.log.length=20;
}
/* Выполняет один сценарий для события. Возвращает true, если условия прошли и шаги запущены. */
function auExec(a,ctx){
  const env=auEnv(a.trig,ctx);
  if(!auCheck(a,env))return false;
  if(auDepth>=3){auPush(a,ctx.what||a.trig,'Остановлено: превышена глубина вложенных запусков (3)');return false}
  auDepth++;
  const res=[];let okN=0;
  try{
    (a.steps||[]).forEach(s=>{
      const def=AU_ACTS[s.a];
      if(!def){res.push('? неизвестное действие «'+s.a+'»');return}
      try{
        if(def.need&&!env[def.need]){res.push(def.n+': пропущено, нет '+auNeedTxt[def.need]);return}
        res.push(def.n+': '+def.run(s.p||{},env,a));okN++;
      }catch(e){console.error('automation step',a.name,s.a,e);res.push(def.n+': ошибка — '+(e&&e.message||e))}
    });
  }finally{auDepth--}
  a.runs=(a.runs||0)+1;a.last=Date.now();
  auPush(a,ctx.what||a.trig,`Выполнено ${okN} из ${(a.steps||[]).length}. `+res.join('; '));
  return true;
}
function fire(trig,ctx={}){
  const list=autos.filter(a=>a.on&&a.trig===trig&&!(trig===AU_TRIG_NOFB||trig===AU_TRIG_OVER&&false));
  let n=0;
  list.forEach(a=>{try{if(auExec(a,ctx))n++}catch(e){console.error('automation',a.name,e)}});
  if(n&&typeof persist==='function')persist();
  if(n&&typeof cur!=='undefined'&&cur==='automation'&&!document.getElementById('ov')&&V.automation)V.automation();
  return n;
}

/* Этапы сделки: оборачиваем setStage, чтобы передавать сделку в контекст и запускать триггеры «ожидание оплаты» / «успешно завершена» */
const auSeen=new Map();
const auSetStage0=setStage;
setStage=function(d,st){
  const was=d.stage,prev=auStageCtx;
  auStageCtx={d,was,st};
  let r;try{r=auSetStage0.apply(this,arguments)}finally{auStageCtx=prev}
  if(d.stage!==was){
    const t=st==='agree'?'Сделка в ожидании оплаты':st==='won'?'Сделка успешно завершена':null;
    if(t){const k=t+d.id;if(!auSeen.has(k)){auSeen.set(k,1);setTimeout(()=>auSeen.delete(k),60);fire(t,{cid:d.cid,mgr:d.mgr,did:d.id,what:`«${d.title}»`})}}
  }
  return r;
};

/* ---------- Временные триггеры ---------- */
const auDays=(a,b)=>Math.round((new Date(b.slice(0,10)+'T12:00:00')-new Date(a.slice(0,10)+'T12:00:00'))/864e5);
function auLastContact(c){
  let m=String(c.added||'0000-00-00').slice(0,10);
  const up=s=>{s=String(s||'').slice(0,10);if(s>m)m=s};
  hist.forEach(h=>{if(h.cid===c.id)up(h.d)});
  calls.forEach(k=>{if(k.cid===c.id)up(k.at)});
  dialogs.forEach(d=>{if(d.cid===c.id)up(d.at||d.last||d.date)});
  return m;
}
function autoTick(){
  if(!Array.isArray(autos)||!autos.length||!clients)return 0;
  const today=iso(0);let ran=0;
  autos.filter(a=>a.on&&a.trig===AU_TRIG_NOFB).forEach(a=>{
    const N=Math.max(1,+(a.tp&&a.tp.days)||3);a.fired=a.fired||{};
    clients.forEach(c=>{
      const act=deals.filter(d=>d.cid===c.id&&!['won','lost'].includes(d.stage));
      if(!act.length)return;
      if(auDays(auLastContact(c),today)<N)return;
      if(a.fired[c.id]&&auDays(a.fired[c.id],today)<N)return;
      const d=act.sort((x,y)=>String(y.created).localeCompare(String(x.created)))[0];
      let ok=false;try{ok=auExec(a,{cid:c.id,mgr:c.mgr,did:d.id,what:`${c.name}: ${N} дн. без обратной связи`})}catch(e){console.error(e)}
      if(ok){a.fired[c.id]=today;ran++}
    });
  });
  autos.filter(a=>a.on&&a.trig===AU_TRIG_OVER).forEach(a=>{
    a.fired=a.fired||{};
    tasks.filter(t=>t.status!=='Выполнена'&&t.due&&t.due<today).forEach(t=>{
      const k='t'+t.id;if(a.fired[k])return;
      let ok=false;try{ok=auExec(a,{cid:t.cid,mgr:t.mgr,did:t.did,tid:t.id,what:`«${t.title}» просрочена`})}catch(e){console.error(e)}
      if(ok){a.fired[k]=today;ran++}
    });
  });
  if(ran){if(typeof persist==='function')persist();if(typeof cur!=='undefined'&&cur==='automation'&&!document.getElementById('ov')&&V.automation)V.automation()}
  return ran;
}

/* ---------- Миграция старого формата {trig,acts:[строки]} ---------- */
function migrateAutos(){
  const MAP={'Создать задачу':a=>({a:'task',p:{title:a.name+': {имя}',days:1,who:'ctx'}}),
    'Уведомить руководителя':a=>({a:'notify',p:{who:'head',text:'Сценарий «'+a.name+'»: {событие}'}}),
    'Изменить статус клиента':()=>({a:'status',p:{status:'В работе'}}),
    'Назначить менеджера':()=>({a:'assign',p:{mgr:1}})};
  (autos||[]).forEach(a=>{
    if(!Array.isArray(a.steps)){a.steps=(Array.isArray(a.acts)?a.acts:[]).map(x=>MAP[x]?MAP[x](a):null).filter(Boolean)}
    if(!Array.isArray(a.conds))a.conds=[];
    if(!Array.isArray(a.log))a.log=[];
    if(!a.fired||typeof a.fired!=='object')a.fired={};
    if(typeof a.runs!=='number')a.runs=+a.runs||0;
    if(a.on===undefined)a.on=true;
    if(a.trig===AU_TRIG_NOFB&&!a.tp)a.tp={days:3};
  });
}

const auValLbl=(f,v)=>{if(f.t==='sel'){const o=auOpts(f).find(x=>String(x[0])===String(v));return o?o[1]:v}return v};
const auTrigTxt=(trig,tp)=>trig===AU_TRIG_NOFB?`у клиента нет обратной связи ${(tp&&tp.days)||3} дн.`:(AU_TRIG_LBL[trig]||trig.toLowerCase());
function auDescribe(d){
  const conds=(d.conds||[]).filter(c=>auField(c.f)&&String(c.v??'')!=='').map(c=>{const f=auField(c.f);return `${f.l.toLowerCase()} ${c.op==='='?'равно':c.op==='≠'?'не равно':c.op==='>'?'больше':c.op==='<'?'меньше':'содержит'} «${auValLbl(f,c.v)}»`});
  const steps=(d.steps||[]).filter(s=>AU_ACTS[s.a]).map(s=>AU_ACTS[s.a].say(s.p||{}));
  return `Когда ${auTrigTxt(d.trig,d.tp)}`+(conds.length?`, и если ${conds.join(' и ')}`:'')+`, тогда ${steps.length?steps.join('; затем '):'…'}.`;
}
function auValidate(d){
  const er=[];
  if(!String(d.name||'').trim())er.push('Дайте сценарию название');
  if(d.trig===AU_TRIG_NOFB&&(!(+d.tp?.days>=1)))er.push('Укажите число дней без обратной связи (от 1)');
  const ent=AU_TRIG_ENT[d.trig]||'c';
  (d.conds||[]).forEach((c,i)=>{const f=auField(c.f);
    if(!f){er.push(`Условие ${i+1}: выберите поле`);return}
    if(String(c.v??'').trim()==='')er.push(`Условие ${i+1}: укажите значение`);
    else if(f.t==='num'&&isNaN(+c.v))er.push(`Условие ${i+1}: значение должно быть числом`);
    if(!ent.includes(f.e))er.push(`Условие ${i+1}: «${f.l}» недоступно для события «${d.trig}» (нет ${auNeedTxt[f.e]})`)});
  if(!(d.steps||[]).length)er.push('Добавьте хотя бы одно действие');
  (d.steps||[]).forEach((s,i)=>{const def=AU_ACTS[s.a];if(!def){er.push(`Действие ${i+1}: выберите тип`);return}
    const m=def.valid(s.p||{});if(m)er.push(`Действие ${i+1}: ${m}`);
    if(def.need&&!ent.includes(def.need))er.push(`Действие ${i+1}: «${def.n}» требует ${auNeedTxt[def.need]}, а в событии «${d.trig}» её нет`)});
  return er;
}

function auSave(){
  auRead();const er=auValidate(auDraft),box=document.getElementById('au_err');
  if(er.length){box.innerHTML=er.map(x=>`<li>${esc(x)}</li>`).join('');box.hidden=false;box.scrollIntoView({block:'nearest',behavior:'smooth'});return}
  const d={name:auDraft.name.trim(),trig:auDraft.trig,conds:auDraft.conds.map(c=>({f:c.f,op:c.op,v:auField(c.f).t==='num'?+c.v:String(c.v).trim()})),steps:auDraft.steps.map(s=>({a:s.a,p:{...s.p}}))};
  if(d.trig===AU_TRIG_NOFB)d.tp={days:+auDraft.tp.days};
  if(auEditId){const a=autos.find(x=>x.id===auEditId);if(a){Object.assign(a,d);if(d.trig!==AU_TRIG_NOFB)delete a.tp;if(a.trig!==AU_TRIG_NOFB&&a.trig!==AU_TRIG_OVER)a.fired={}}}
  else autos.push({id:++nid,...d,on:true,runs:0,last:null,log:[],fired:{}});
  auDraft=null;closeModal();toast(auEditId?'Сценарий сохранён':'Сценарий создан и включён');persist();V.automation();
}

</script>
<script>
/* Встроенный файл: assets/js/notifications.js */
/* ==========================================================================
   notifications.js — «Система»: Центр уведомлений, Журнал действий, Корзина
   Источники уведомлений:
     • журнал событий nlog (пишут модули через notify());
     • вычисляемые оповещения — пересчитываются из реальных данных при каждом открытии.
   Прочитанность: nlog[].read, для вычисляемых — ME.nread[ключ] (сохраняется в рабочем пространстве).
   Уведомления показываются внутри CRM, пока она открыта; push/почта не отправляются.
   ========================================================================== */
const NT_TYPES={
  client:['Клиенты','users'],deal:['Сделки','deal'],task:['Задачи','tasks'],payment:['Платежи','wallet'],
  auto:['Автоматизация','zap'],stock:['Склад','box'],contact:['Контакты','clock'],message:['Сообщения','msg'],system:['Система','bell']
};
const NT={flt:'all',type:''};
const ntType=t=>NT_TYPES[t]||NT_TYPES.system;
const ntNoon=d=>d?new Date(d.slice(0,10)+'T12:00:00').getTime():0;

/* Все уведомления (прочитанные и нет), свежие сверху */
function ntAll(){
  ME.nread=ME.nread&&typeof ME.nread==='object'?ME.nread:{};
  const t0=iso(0),t1=addDays(t0,1),out=[];
  const add=(k,type,t,sub,go,sev,at)=>out.push({k,type,t,sub,go,sev,at:at||Date.now(),read:!!ME.nread[k]});
  nlog.forEach(n=>out.push({k:n.id,type:n.type||'system',t:n.t,sub:'',go:n.go,ent:n.ent,sev:'',at:n.at,read:!!n.read,log:true}));
  tasks.filter(t=>t.status!=='Выполнена').forEach(t=>{
    const who=mgrOf(t.mgr).name;
    if(t.due<t0)add('o'+t.id+t.due,'task',`Просрочена задача «${t.title}»`,`Срок был ${fd(t.due)} · ${who}`,'tasks','bad',ntNoon(t.due));
    else if(t.due===t0)add('d'+t.id+t0,'task',`Дедлайн сегодня: «${t.title}»`,who,'tasks','warn',ntNoon(t0));
    else if(t.due===t1)add('d'+t.id+t1,'task',`Дедлайн завтра: «${t.title}»`,who,'tasks','',ntNoon(t1));
  });
  tasks.filter(t=>!tkDone(t)&&t.due&&t.remind!==''&&t.remind!=null&&t.due>=t0&&addDays(t.due,-(+t.remind))<=t0).forEach(t=>add('r'+t.id+t.due,'task',`Напоминание: «${t.title}»`,`Срок ${tkDate(t.due)}${t.time?' в '+t.time:''} · ${mgrOf(t.mgr).name}`,'tasks','',ntNoon(t0)));
  fin.filter(f=>f.type==='in'&&!isPaid(f)&&f.due&&f.due<t0).forEach(f=>add('p'+f.id+f.due,'payment',`Платёж просрочен: ${f.t}`,`${rub(f.sum)} · ожидался ${fd(f.due)}`,'finance','bad',ntNoon(f.due)));
  if(typeof stockLow==='function')stockLow().forEach(p=>add('sl'+p.id+'_'+p.qty,'stock',`Низкий остаток: ${p.name}`,`Осталось ${p.qty} при пороге ${p.min??'—'}`,'products',p.qty<=0?'bad':'warn'));
  if(typeof contactDue==='function')contactDue().forEach(c=>add('cd'+c.id+c.nextContact,'contact',`Пора связаться: ${c.name}`,`Запланировано на ${fd(c.nextContact)}`,'messages','warn',ntNoon(c.nextContact)));
  M.activeDeals().filter(d=>d.moved&&d.moved<addDays(t0,-14)).forEach(d=>add('sd'+d.id+d.moved,'deal',`Сделка без движения: «${d.title}»`,`Последнее изменение ${fd(d.moved)}`,'deals','warn',ntNoon(d.moved)));
  dialogs.filter(d=>d.unread).forEach(d=>add('m'+d.id+'_'+d.unread,'message',`Новые сообщения: ${cliOf(d.cid)?.name||'клиент'}`,`${d.unread} непрочитанных`,'messages','',Date.now()));
  calls.filter(c=>c.type==='miss'&&String(c.at).slice(0,10)===t0).forEach(c=>add('c'+c.id,'contact',`Пропущенный звонок: ${cliOf(c.cid)?.name||'клиент'}`,String(c.at).slice(11),'phone','warn',Date.now()));
  notifs.forEach(n=>add(n.k,'auto',n.t,n.ago||'','automation','',Date.now()));  /* старые сценарии ядра */
  return out.sort((a,b)=>(a.read-b.read)||(b.at-a.at));
}
function getNotifs(){return ntAll().filter(n=>!n.read).map(n=>({k:n.k,t:n.t,ago:n.sub||relTime(n.at)}))}
function unreadCount(){try{return ntAll().filter(n=>!n.read).length}catch(e){return 0}}
function ntMark(k,on=true){
  const l=nlog.find(n=>n.id===k);
  if(l)l.read=on;else{ME.nread=ME.nread||{};if(on)ME.nread[k]=Date.now();else delete ME.nread[k]}
}
function ntPrune(){
  const lim=Date.now()-60*864e5;ME.nread=ME.nread||{};
  Object.keys(ME.nread).forEach(k=>{if(ME.nread[k]<lim)delete ME.nread[k]});
  const cut=Date.now()-30*864e5;for(let i=nlog.length-1;i>=0;i--)if(nlog[i].read&&nlog[i].at<cut)nlog.splice(i,1);
}
const ntGo=n=>{if(n.go)go(n.go);else if(n.ent&&ENT_VIEW[n.ent])go(ENT_VIEW[n.ent])};
function ntRefresh(){
  const dot=$('#bellDot');if(dot)dot.hidden=!unreadCount();
  if(typeof drawNav==='function'&&ME.name)drawNav();
  if(!$('#bellPop').hidden)drawBell();
  if(cur==='notifications'&&$('#ntList'))ntList();
}

/* ---------- Колокольчик ---------- */
function drawBell(){
  const all=ntAll(),un=all.filter(n=>!n.read),show=un.slice(0,7);
  $('#bellPop').innerHTML=`<div class="nt-pop-h"><h4>Уведомления</h4>${un.length?`<span class="pill">${un.length}</span>`:''}</div>`
   +(show.length?show.map(n=>ntRow(n,true)).join('')+(un.length>show.length?`<div class="nt-more">и ещё ${un.length-show.length}</div>`:'')
     :`<div class="nt-pop-e">${ico('check')}<span>Новых уведомлений нет</span></div>`)
   +`<div class="nt-pop-f">${un.length?`<button class="btn sm" data-act="readAll">Прочитать всё</button>`:''}<button class="btn sm pri" data-go="notifications">Все уведомления</button></div>`;
}
A.readAll=()=>{ntAll().filter(n=>!n.read).forEach(n=>ntMark(n.k,true));notifs.length=0;persist();ntRefresh();toast('Все уведомления отмечены прочитанными')};
function ntRow(n,compact){
  const [lbl,ic]=ntType(n.type);
  return `<div class="nt-row ${n.read?'':'un'} ${n.sev||''}" role="button" tabindex="0" data-act="ntOpen" data-k="${esc(n.k)}"><span class="nt-ic">${ico(ic)}</span>
   <div class="nt-b"><b>${esc(n.t)}</b><small>${[n.sub,compact?'':lbl,n.log?relTime(n.at):''].filter(Boolean).map(esc).join(' · ')}</small></div>
   ${compact?'':`<button class="ibtn nt-x" data-act="ntToggle" data-k="${esc(n.k)}" aria-label="${n.read?'Отметить непрочитанным':'Отметить прочитанным'}" title="${n.read?'Отметить непрочитанным':'Отметить прочитанным'}">${ico(n.read?'eyeoff':'check')}</button>`}</div>`;
}
A.ntOpen=(b,e)=>{
  if(e&&e.target.closest('.nt-x'))return;
  const k=b.dataset.k,n=ntAll().find(x=>String(x.k)===k);if(!n)return;
  ntMark(n.log?k:n.k,true);persist();$('#bellPop').hidden=true;ntRefresh();ntGo(n);
};
A.ntToggle=b=>{const n=ntAll().find(x=>String(x.k)===b.dataset.k);if(!n)return;ntMark(n.k,!n.read);persist();ntRefresh()};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.nt-row[data-act]')){e.preventDefault();e.target.click()}});

/* ---------- Страница «Уведомления» ---------- */
function ntList(){
  let l=ntAll();const un=l.filter(n=>!n.read).length;
  if(NT.flt==='unread')l=l.filter(n=>!n.read);
  if(NT.type)l=l.filter(n=>n.type===NT.type);
  $('#ntList').innerHTML=l.length?`<div class="card nt-card">${l.map(n=>ntRow(n)).join('')}</div>`
   :`<div class="card">${emptyState('bell',NT.flt==='unread'?'Непрочитанных нет':'Уведомлений пока нет','Здесь появятся новые клиенты и сделки, назначенные и просроченные задачи, платежи, низкие остатки и срабатывания автоматизации.')}</div>`;
  const c=$('#ntCount');if(c)c.textContent=un?`Непрочитанных: ${un}`:'Всё прочитано';
}
V.notifications=()=>{
  ntPrune();
  const types=[...new Set(ntAll().map(n=>n.type))];
  $('#view').innerHTML=`<div class="ph"><div><h1>Уведомления</h1><p id="ntCount"></p></div><div class="acts"><button class="btn" data-act="ntClear">${ico('trash')}Очистить прочитанные</button><button class="btn pri" data-act="readAll">${ico('check')}Прочитать всё</button></div></div>
  <div class="tools"><div class="seg"><button data-act="ntFlt" data-f="all" class="${NT.flt==='all'?'on':''}">Все</button><button data-act="ntFlt" data-f="unread" class="${NT.flt==='unread'?'on':''}">Непрочитанные</button></div>
  <select id="ntType" aria-label="Тип"><option value="">Все типы</option>${Object.entries(NT_TYPES).map(([k,v])=>`<option value="${k}" ${NT.type===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
  <div id="ntList"></div><p class="nt-note">Уведомления показываются внутри CRM, пока она открыта. Push-сообщения и письма не отправляются.</p>`;
  $('#ntType').onchange=e=>{NT.type=e.target.value;ntList()};ntList();
};
A.ntFlt=b=>{NT.flt=b.dataset.f;$$('[data-act=ntFlt]').forEach(x=>x.classList.toggle('on',x===b));ntList()};
A.ntClear=()=>{
  const n=nlog.filter(x=>x.read).length;
  if(!n){toast('Прочитанных журнальных уведомлений нет');return}
  confirmBox(`Удалить ${n} прочитанных уведомлений из журнала? Вычисляемые оповещения (просрочки, остатки) пересчитываются автоматически.`,()=>{for(let i=nlog.length-1;i>=0;i--)if(nlog[i].read)nlog.splice(i,1);persist();ntRefresh();toast('Прочитанные уведомления удалены')},'Очистить');
};
/* Новое событие → точка на колокольчике, счётчик и короткий toast */
const _notify=notify;
notify=function(o){_notify(o);try{if(o&&o.text&&ME.ntToast!==false)toast(o.text)}catch(e){}persist();ntRefresh()};
setInterval(()=>{if(typeof CUR!=='undefined'&&CUR&&!$('#app').hidden)ntRefresh()},60000);

/* ==========================================================================
   Журнал действий
   ========================================================================== */
const ENT_VIEW={client:'clients',deal:'deals',task:'tasks',fin:'finance',product:'products',staff:'staff',auto:'automation',export:'activity',trash:'trash'};
const AC={mgr:'',per:'30d',q:''};
function acList(){
  const r=periodRange(AC.per),q=norm(AC.q);
  return activity.filter(a=>(!AC.mgr||String(a.mgr)===AC.mgr)&&(AC.per==='all'||!a.at||inR(dayOf(a.at),r))&&(!q||norm(a.t).includes(q)));
}
function acDraw(){
  const l=acList(),box=$('#acList');
  $('#acCount').textContent=`Записей: ${l.length}`;
  box.innerHTML=l.length?`<div class="card nt-card">${l.slice(0,300).map(a=>{
    const s=mgrOf(a.mgr),v=ENT_VIEW[a.ent];
    return `<div class="ac-row">${av(a.mgr,1)}<div class="nt-b"><b><span class="ac-who">${esc(s.name)}</span> ${esc(a.t)}</b><small>${a.at?esc(fdt(a.at))+' · '+esc(relTime(a.at)):esc(a.ago||'')}</small></div>${v?`<button class="btn sm" data-go="${v}">Открыть раздел</button>`:''}</div>`}).join('')}${l.length>300?`<div class="nt-more">Показаны 300 из ${l.length}. Остальные — в экспорте.</div>`:''}</div>`
   :`<div class="card">${emptyState('log','Записей нет','Измените период или фильтр. Действия появляются здесь по мере работы в CRM.')}</div>`;
}
V.activity=()=>{
  $('#view').innerHTML=`<div class="ph"><div><h1>Журнал действий</h1><p id="acCount"></p></div><div class="acts">${typeof exportButtons==='function'?exportButtons('activity'):''}</div></div>
  <div class="tools"><input id="acQ" type="search" placeholder="Поиск по журналу" value="${esc(AC.q)}" aria-label="Поиск"><select id="acM" aria-label="Сотрудник"><option value="">Все сотрудники</option>${staff.map(s=>`<option value="${s.id}" ${AC.mgr==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  <select id="acP" aria-label="Период">${PERIODS.map(p=>`<option value="${p[0]}" ${AC.per===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>
  <div id="acList"></div><p class="nt-note">Журнал хранится в вашем рабочем пространстве и записывается приложением. Это не неизменяемый аудит: владелец может его очистить. Защищённый серверный аудит предусмотрен схемой этапа 2 (supabase/migrations/002_team_workspaces.sql).</p>`;
  $('#acQ').oninput=e=>{AC.q=e.target.value;acDraw()};$('#acM').onchange=e=>{AC.mgr=e.target.value;acDraw()};$('#acP').onchange=e=>{AC.per=e.target.value;acDraw()};acDraw();
};

/* ==========================================================================
   Корзина
   ========================================================================== */
const TR_DAYS=30;
function trAutoPurge(){const lim=Date.now()-TR_DAYS*864e5;let n=0;for(let i=trash.length-1;i>=0;i--)if(trash[i].at<lim){trash.splice(i,1);n++}return n}
V.trash=()=>{
  const n0=trAutoPurge();if(n0)persist();
  const canP=can('trash.purge');
  $('#view').innerHTML=`<div class="ph"><div><h1>Корзина</h1><p>Удалённые записи хранятся ${TR_DAYS} дней, затем стираются безвозвратно</p></div><div class="acts">${trash.length&&canP?`<button class="btn dng" data-act="trEmpty">${ico('trash')}Очистить корзину</button>`:''}</div></div>
  <div class="tools"><select id="trK" aria-label="Тип"><option value="">Все типы</option>${Object.entries(TRASHKIND).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div id="trList"></div>`;
  $('#trK').onchange=trDraw;trDraw();
};
function trDraw(){
  const k=$('#trK')?.value||'',l=trash.filter(t=>!k||t.kind===k),canP=can('trash.purge');
  $('#trList').innerHTML=l.length?`<div class="card nt-card">${l.map(t=>{
    const left=Math.max(0,Math.ceil((t.at+TR_DAYS*864e5-Date.now())/864e5)),extra=t.extra?[(t.extra.deals||[]).length&&`сделок: ${t.extra.deals.length}`,(t.extra.files||[]).length&&`файлов: ${t.extra.files.length}`].filter(Boolean).join(', '):'';
    return `<div class="ac-row"><span class="nt-ic">${ico('trash')}</span><div class="nt-b"><b>${esc(t.label)}</b><small>${esc(TRASHKIND[t.kind]||'Запись')} · удалил(а) ${esc(t.by||'—')}, ${esc(relTime(t.at))}${extra?' · вместе с ним: '+esc(extra):''} · хранится ещё ${left} дн.</small></div>
     <div class="acts"><button class="btn sm pri" data-act="trRestore" data-id="${t.id}">${ico('undo')}Восстановить</button>${canP?`<button class="btn sm dng" data-act="trPurge" data-id="${t.id}">Удалить навсегда</button>`:''}</div></div>`}).join('')}</div>`
   :`<div class="card">${emptyState('trash','Корзина пуста','Удалённые клиенты, сделки, задачи, товары и операции можно будет восстановить отсюда.')}</div>`;
}
A.trRestore=b=>{
  const id=+b.dataset.id;if(!trashRestore(id))return;
  if(typeof afterLoad==='function')afterLoad();
  persist();drawNav();trDraw();toast('Запись восстановлена');
};
A.trPurge=b=>{
  const id=+b.dataset.id,t=trash.find(x=>x.id===id);if(!t)return;
  confirmBox(`Удалить «${esc(t.label)}» навсегда? Восстановить запись после этого будет невозможно.`,()=>{trashPurge(id);persist();trDraw();toast('Удалено навсегда')},'Удалить навсегда');
};
A.trEmpty=()=>{
  if(!can('trash.purge')){toast('Недостаточно прав');return}
  confirmBox(`Безвозвратно удалить все записи корзины (${trash.length})? Это действие нельзя отменить.`,()=>{trash.length=0;persist();V.trash();toast('Корзина очищена')},'Очистить корзину');
};

</script>
<script>
/* Встроенный файл: assets/js/exporter.js */
/* ==========================================================================
   exporter.js — экспорт CSV / Excel (OOXML) и печатные PDF-отчёты. Без внешних библиотек.
   Публичное API: exportButtons(kind), exportData(kind,fmt), exReportOpen(kind)
   ========================================================================== */

/* ---------- Описание наборов данных ----------
   Колонка: [заголовок, функция(строка)→значение, тип, ширина]
   Типы: s — строка, i — целое, m — деньги (число с копейками), d — дата 'YYYY-MM-DD', dt — момент в мс */
const exNameOf=(arr,id,f='name')=>{const x=arr.find(y=>String(y.id)===String(id));return x?(x[f]||''):''};
const exMgr=id=>{const s=staff.find(x=>String(x.id)===String(id));return s?s.name:''};
const exStage=id=>(STAGES.find(s=>s.id===id)||{name:id||''}).name;
const exCli=id=>{const c=cliOf(id);return c?c.name:''};
const EXSETS={
  clients:{label:'клиенты',sheet:'Клиенты',rows:()=>clients,cols:[
    ['№',c=>c.id,'i',7],['Имя',c=>c.name,'s',28],['Телефон',c=>c.phone,'s',18],['Почта',c=>c.email,'s',26],['Компания',c=>c.company,'s',24],
    ['Источник',c=>c.source,'s',16],['Менеджер',c=>exMgr(c.mgr),'s',20],['Статус',c=>c.status,'s',14],['Теги',c=>(c.tags||[]).join(', '),'s',20],
    ['Добавлен',c=>c.added,'d',12],['Следующий контакт',c=>c.nextContact,'d',18],['Сделок',c=>deals.filter(d=>d.cid===c.id).length,'i',9],
    ['Сумма выигранных сделок',c=>sum(deals.filter(d=>d.cid===c.id&&d.stage==='won'),d=>d.sum),'m',24]]},
  deals:{label:'сделки',sheet:'Сделки',rows:()=>deals,cols:[
    ['№',d=>d.id,'i',7],['Название',d=>d.title,'s',34],['Клиент',d=>exCli(d.cid),'s',26],['Менеджер',d=>exMgr(d.mgr),'s',20],['Этап',d=>exStage(d.stage),'s',24],
    ['Сумма',d=>d.sum,'m',14],['Вероятность, %',d=>d.prob,'i',14],['Создана',d=>d.created,'d',12],['Закрыта',d=>d.closed,'d',12],
    ['Ожидаемая оплата',d=>d.exp,'d',17],['Причина отказа',d=>d.lost,'s',24],
    ['Товары',d=>(d.items||[]).map(i=>(exNameOf(products,i.pid)||('№'+i.pid))+' × '+i.qty).join('; '),'s',34]]},
  tasks:{label:'задачи',sheet:'Задачи',rows:()=>tasks,cols:[
    ['№',t=>t.id,'i',7],['Задача',t=>t.title,'s',34],['Описание',t=>t.desc,'s',40],['Исполнитель',t=>exMgr(t.mgr),'s',20],['Срок',t=>t.due,'d',12],
    ['Приоритет',t=>t.prio,'s',12],['Статус',t=>t.status,'s',16],['Клиент',t=>exCli(t.cid),'s',26],['Сделка',t=>exNameOf(deals,t.did,'title'),'s',28]]},
  finance:{label:'финансовые операции',sheet:'Финансы',rows:()=>[...fin].sort((a,b)=>(a.date||'').localeCompare(b.date||'')),cols:[

/* ---------- Значения ячеек ---------- */
const exPad=n=>String(n).padStart(2,'0');
const exDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?`${m[3]}.${m[2]}.${m[1]}`:''};
const exDt=ms=>{if(!ms)return '';const d=new Date(ms);return `${exPad(d.getDate())}.${exPad(d.getMonth()+1)}.${d.getFullYear()} ${exPad(d.getHours())}:${exPad(d.getMinutes())}`};
/* Excel-серийная дата (локальное время, без часовых поясов) */
const exSerial=(y,mo,d,h=0,mi=0)=>Math.round((Date.UTC(y,mo-1,d,h,mi)-Date.UTC(1899,11,30))/864e5*1e6)/1e6;
function exSerialOf(v,t){
  if(t==='d'){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||''));return m?exSerial(+m[1],+m[2],+m[3]):null}
  if(!v)return null;const d=new Date(v);return isNaN(d)?null:exSerial(d.getFullYear(),d.getMonth()+1,d.getDate(),d.getHours(),d.getMinutes());
}
/* Нормализация: {t:'s'|'n'|'m'|'d'|'dt'|'e', v, txt} — txt = представление для CSV */
function exCell(raw,type){
  if(type==='s'){const s=exSafe(raw==null?'':String(raw));return s===''?{t:'e',v:'',txt:''}:{t:'s',v:s,txt:s}}
  if(type==='d'||type==='dt'){
    const ser=exSerialOf(raw,type);if(ser==null)return {t:'e',v:'',txt:''};
    return {t:type,v:ser,txt:type==='d'?exDate(raw):exDt(raw)};
  }
  if(raw===''||raw==null||isNaN(+raw))return {t:'e',v:'',txt:''};
  const n=+raw;return {t:type==='m'?'m':'n',v:n,txt:String(n).replace('.',',')};
}
/* Защита от формульной инъекции: строки, начинающиеся с = + - @ (а также TAB/CR), получают префикс ' */
function exSafe(s){return /^[=+\-@\t\r]/.test(s)?"'"+s:s}

function exBuild(kind){
  const set=EXSETS[kind];if(!set)return null;
  const rows=set.rows().map(r=>set.cols.map(c=>exCell(c[1](r),c[2])));
  return {set,headers:set.cols.map(c=>c[0]),widths:set.cols.map(c=>c[3]),rows};
}

/* ---------- CSV ---------- */
function exCsvField(txt){return /[";\r\n]/.test(txt)?'"'+txt.replace(/"/g,'""')+'"':txt}
function exCsv(b){
  const clean=s=>s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const lines=[b.headers.map(h=>exCsvField(h)).join(';')].concat(b.rows.map(r=>r.map(c=>exCsvField(clean(c.txt))).join(';')));
  return '﻿'+lines.join('\r\n')+'\r\n';
}

/* ---------- XLSX: ZIP «stored» + OOXML ---------- */
let EXCRC=null;
function exCrc32(u8){
  if(!EXCRC){EXCRC=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;EXCRC[n]=c>>>0}}
  let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=EXCRC[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;
}
function exZip(files){/* files:[{name,data:Uint8Array}] → Uint8Array */
  const enc=new TextEncoder(),now=new Date();
  const dosT=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  const dosD=((Math.max(1980,now.getFullYear())-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  const parts=[],central=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),crc=exCrc32(f.data),sz=f.data.length;
    const lh=new Uint8Array(30+nm.length),lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint16(10,dosT,true);lv.setUint16(12,dosD,true);
    lv.setUint32(14,crc,true);lv.setUint32(18,sz,true);lv.setUint32(22,sz,true);lv.setUint16(26,nm.length,true);lv.setUint16(28,0,true);lh.set(nm,30);
    const ch=new Uint8Array(46+nm.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,dosT,true);cv.setUint16(14,dosD,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,sz,true);cv.setUint32(24,sz,true);cv.setUint16(28,nm.length,true);cv.setUint32(42,off,true);ch.set(nm,46);
    parts.push(lh,f.data);central.push(ch);off+=lh.length+sz;
  });
  const cdSize=central.reduce((a,c)=>a+c.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
  const all=parts.concat(central,[end]),out=new Uint8Array(all.reduce((a,p)=>a+p.length,0));let o=0;all.forEach(p=>{out.set(p,o);o+=p.length});return out;
}
/* Экранирование для XML 1.0: убираем недопустимые символы и одиночные суррогаты */
function exXml(s){
  return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g,'')
    .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function exColName(i){let s='';for(i++;i>0;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s}
const EXSTYLE={s:0,n:2,m:3,d:4,dt:5,wrap:6,head:1};
function exSheetName(s){return s.replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Лист1'}

    return `<c r="${ref}" s="${EXSTYLE[x.t]}"><v>${x.v}</v></c>`;
  };
  const head=`<row r="1" ht="22" customHeight="1">${b.headers.map((h,c)=>`<c r="${exColName(c)}1" t="inlineStr" s="${EXSTYLE.head}"><is><t xml:space="preserve">${exXml(h)}</t></is></c>`).join('')}</row>`;
  const body=b.rows.map((r,i)=>`<row r="${i+2}">${r.map((x,c)=>cell(c,i+1,x)).join('')}</row>`).join('');
  const ws=X+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`

   +`<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToHeight="0"/></worksheet>`;
  const styles=X+`<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
   +`<numFmts count="2"><numFmt numFmtId="164" formatCode="dd\\.mm\\.yyyy"/><numFmt numFmtId="165" formatCode="dd\\.mm\\.yyyy\\ hh:mm"/></numFmts>`
   +`<fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts>`
   +`<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE9E9F5"/><bgColor indexed="64"/></patternFill></fill></fills>`
   +`<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FF9A9AB0"/></bottom><diagonal/></border></borders>`
   +`<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
   +`<cellXfs count="7">`
   +`<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>`

   +`<xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>`

   +`<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>`

  const files=[
    ['[Content_Types].xml',X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],

/* ---------- Экспорт данных ---------- */
const EXMIME={csv:'text/csv',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
function exportData(kind,fmt){
  if(typeof can==='function'&&!can('export')){toast('Нет прав на экспорт данных');return false}
  if(fmt==='pdf'){exReportOpen(kind);return true}
  if(!EXSETS[kind]||!EXMIME[fmt]){toast('Неизвестный формат экспорта');return false}
  let b;
  try{b=exBuild(kind)}catch(e){console.error('export',e);toast('Не удалось подготовить данные для экспорта');return false}
  if(!b.rows.length){toast('Нет данных для экспорта: «'+b.set.label+'» пусты');return false}
  try{
    const blob=fmt==='csv'?new Blob([exCsv(b)],{type:'text/csv;charset=utf-8'}):new Blob([exXlsx(b)],{type:EXMIME.xlsx});
    download(`alfa-${kind}-${iso(0)}.${fmt}`,blob);
  }catch(e){console.error('export',e);toast('Не удалось сформировать файл');return false}
  log(`экспортировал(а) ${b.set.label} (${fmt.toUpperCase()}, ${b.rows.length} ${exPlural(b.rows.length)})`,{ent:'export'});
  try{persist()}catch(e){}
  toast(`Экспорт готов: ${b.rows.length} ${exPlural(b.rows.length)}`);
  return true;
}
const exPlural=n=>{const a=n%100,b=n%10;return a>10&&a<20?'строк':b===1?'строка':b>1&&b<5?'строки':'строк'};

/* ---------- Кнопка «Экспорт» с меню ---------- */
function exportButtons(kind){
  if(!EXSETS[kind])return '';
  if(typeof can==='function'&&!can('export'))
    return `<button class="btn ex-btn" disabled title="Нет прав на экспорт данных" aria-disabled="true">${ico('file')}Экспорт</button>`;
  return `<span class="ex-wrap"><button class="btn ex-btn" data-act="exportMenu" data-kind="${esc(kind)}" aria-haspopup="menu" aria-expanded="false">${ico('file')}<span>Экспорт</span>${ico('chev','ex-chev')}</button>`
    +`<span class="ex-menu" role="menu" hidden>`
    +`<button role="menuitem" data-act="exportDo" data-kind="${esc(kind)}" data-fmt="csv"><b>CSV</b><small>таблица для любой программы</small></button>`
    +`<button role="menuitem" data-act="exportDo" data-kind="${esc(kind)}" data-fmt="xlsx"><b>Excel</b><small>файл .xlsx с форматированием</small></button>`
    +`<button role="menuitem" data-act="exportDo" data-kind="${esc(kind)}" data-fmt="pdf"><b>PDF-отчёт</b><small>сводка за период для печати</small></button>`
    +`</span></span>`;
}
function exCloseMenus(){
  $$('.ex-menu').forEach(m=>{m.hidden=true;m.style.cssText=''});
  $$('.ex-btn[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
}
A.exportMenu=btn=>{
  const menu=btn.parentElement.querySelector('.ex-menu'),was=!menu.hidden;
  exCloseMenus();if(was)return;
  menu.hidden=false;btn.setAttribute('aria-expanded','true');
  /* position:fixed — меню не обрезается контейнерами и не уезжает за экран */
  const r=btn.getBoundingClientRect(),w=menu.offsetWidth,h=menu.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  let left=Math.min(Math.max(8,r.right-w),vw-w-8),top=r.bottom+6;
  if(top+h>vh-8&&r.top-h-6>8)top=r.top-h-6;
  menu.style.cssText=`position:fixed;left:${left}px;top:${top}px`;
  menu.querySelector('button')?.focus();
};
A.exportDo=btn=>{exCloseMenus();exportData(btn.dataset.kind,btn.dataset.fmt)};
document.addEventListener('click',e=>{if(!e.target.closest('.ex-wrap'))exCloseMenus()},true);
document.addEventListener('keydown',e=>{
  if(!$$('.ex-menu:not([hidden])').length)return;
  if(e.key==='Escape'){const b=$('.ex-btn[aria-expanded="true"]');exCloseMenus();b?.focus()}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const items=$$('.ex-menu:not([hidden]) button'),i=items.indexOf(document.activeElement);
    items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();e.preventDefault();
  }
});
window.addEventListener('resize',exCloseMenus);
document.addEventListener('scroll',exCloseMenus,true);

/* ---------- PDF-отчёт ---------- */

function exReportData(key){

  const paidIn=fin.filter(f=>f.type==='in'&&isPaid(f)&&inR(paidDate(f),r)),paidOut=fin.filter(f=>f.type==='out'&&isPaid(f)&&inR(paidDate(f),r));
  const grp=a=>{const g={};a.forEach(f=>{const x=g[f.cat||'Без категории']=g[f.cat||'Без категории']||{n:0,s:0};x.n++;x.s+=f.sum});return Object.entries(g).sort((a,b)=>b[1].s-a[1].s)};
  return {r,won,lost,open,paidIn,paidOut,inCats:grp(paidIn),outCats:grp(paidOut),

}

  }
  if(secs.fin){
    const rowsOf=(cats)=>cats.map(([c,x])=>[esc(c),String(x.n),rub(x.s)]);
    h+=`<section><h2>Финансы по категориям</h2><p class="ex-note">Только фактически оплаченные операции, дата оплаты внутри периода.</p>`;
    h+=`<h3>Поступления</h3>`+(D.inCats.length?exTable(['Категория','Операций','Сумма'],rowsOf(D.inCats).concat([[`<b>Итого поступлений</b>`,`<b>${D.paidIn.length}</b>`,`<b>${rub(K.income)}</b>`]]),[1,2]):`<p class="ex-empty">Нет оплаченных поступлений за период.</p>`);
    h+=`<h3>Расходы</h3>`+(D.outCats.length?exTable(['Категория','Операций','Сумма'],rowsOf(D.outCats).concat([[`<b>Итого расходов</b>`,`<b>${D.paidOut.length}</b>`,`<b>${rub(K.expenses)}</b>`]]),[1,2]):`<p class="ex-empty">Нет оплаченных расходов за период.</p>`);
    if(K.pendingOut)h+=`<p class="ex-note">Ожидаемые расходы (не оплачены): ${rub(K.pendingOut)}</p>`;
    h+=`</section>`;
  }
  if(secs.deals){
    const dr=d=>[esc(d.title),esc(exCli(d.cid)||'—'),esc(exMgr(d.mgr)||'—'),d.closed?fdf(d.closed):'—',rub(d.sum)];
    h+=`<section><h2>Сделки</h2><h3>Выигранные за период: ${D.won.length} на ${rub(K.wonSum)}</h3>`
      +(D.won.length?exTable(['Сделка','Клиент','Менеджер','Закрыта','Сумма'],exCap(D.won).map(dr),[4])+exMore(D.won):`<p class="ex-empty">Нет выигранных сделок за период.</p>`)
      +`<h3>Проигранные за период: ${D.lost.length} на ${rub(K.lostSum)}</h3>`
      +(D.lost.length?exTable(['Сделка','Клиент','Менеджер','Причина','Сумма'],exCap(D.lost).map(d=>[esc(d.title),esc(exCli(d.cid)||'—'),esc(exMgr(d.mgr)||'—'),esc(d.lost||'не указана'),rub(d.sum)]),[4])+exMore(D.lost):`<p class="ex-empty">Нет проигранных сделок за период.</p>`)
      +`<h3>Открытые сейчас: ${D.open.length} на ${rub(sum(D.open,d=>d.sum))}</h3>`
      +(D.open.length?exTable(['Сделка','Клиент','Этап','Ожидаемая оплата','Сумма'],exCap(D.open).map(d=>[esc(d.title),esc(exCli(d.cid)||'—'),esc(exStage(d.stage)),d.exp?fdf(d.exp):'—',rub(d.sum)]),[4])+exMore(D.open):`<p class="ex-empty">Открытых сделок нет.</p>`)
      +`</section>`;
  }
  if(secs.tasks){
    const od=M.overdueTasks(),od0=new Set(od.map(t=>t.id)),inP=tasks.filter(t=>inR(t.due,r)&&!od0.has(t.id));
    const tr=t=>[esc(t.title),esc(exMgr(t.mgr)||'—'),t.due?fdf(t.due):'—',esc(t.prio||''),esc(t.status||'')];
    h+=`<section><h2>Задачи</h2><div class="ex-kpis">`
      +kpi('Всего задач',String(tasks.length))+kpi('Открытых',String(tasks.filter(t=>t.status!=='Выполнена').length))
      +kpi('Просрочено',String(od.length),'',od.length?'neg':'')+kpi('На сегодня',String(M.todayTasks().length))+`</div>`
      +`<h3>Просроченные: ${od.length}</h3>`+(od.length?exTable(['Задача','Исполнитель','Срок','Приоритет','Статус'],exCap(od).map(tr))+exMore(od):`<p class="ex-empty">Просроченных задач нет.</p>`)
      +`<h3>Остальные задачи со сроком в периоде: ${inP.length}</h3>`+(inP.length?exTable(['Задача','Исполнитель','Срок','Приоритет','Статус'],exCap(inP).map(tr))+exMore(inP):`<p class="ex-empty">Задач со сроком в этом периоде нет.</p>`)
      +`</section>`;
  }
  h+=`<footer class="ex-foot">${esc(co)} · отчёт сформирован ${esc(stamp)} в alfa+ CRM. Данные взяты из рабочего пространства на момент формирования.</footer>`;
  return h;
}
function exReportOpen(kind){

}
function exReportShell(){

    +`<div class="ex-ctl-row"><span class="ex-lbl">Разделы</span><div class="ex-secs">${EXSECS.map(s=>`<label class="ex-sec"><input type="checkbox" data-act="exSec" data-s="${s[0]}" ${EXR.secs[s[0]]?'checked':''}><span>${esc(s[1])}</span></label>`).join('')}</div></div>`

}
function exReportDraw(){const p=$('#exPaper');if(p)p.innerHTML=exReportHtml(EXR.period,EXR.secs)}
A.exPeriod=btn=>{EXR.period=btn.dataset.p;$$('#exSeg button').forEach(b=>b.classList.toggle('on',b===btn));exReportDraw()};
/* Чекбокс: клик перехватывается глобальным data-act-обработчиком с preventDefault — переключаем вручную */
A.exSec=(box,e)=>{
  const on=!EXR.secs[box.dataset.s];EXR.secs[box.dataset.s]=on;
  setTimeout(()=>{box.checked=on},0);exReportDraw();
};
function exPrintPrepare(){
  exPrintCleanup();
  const root=document.createElement('div');root.id='exPrint';root.className='ex-paper ex-print';
  root.innerHTML=exReportHtml(EXR.period,EXR.secs);document.body.appendChild(root);
  const co=(ME.company||'Моя компания').replace(/[\u0000-\u001F]/g,' ');

  document.body.classList.add('ex-printing');return root;
}
function exPrintCleanup(){
  document.getElementById('exPrint')?.remove();document.body.classList.remove('ex-printing');
  document.documentElement.style.removeProperty('--ex-co');
}
A.exportPrint=()=>{
  if(!Object.values(EXR.secs).some(Boolean)){toast('Выберите хотя бы один раздел отчёта');return}
  exPrintPrepare();
  log(`экспортировал(а) отчёт (PDF, ${exPeriodLabel(EXR.period,periodRange(EXR.period))})`,{ent:'export'});
  try{persist()}catch(e){}
  setTimeout(()=>window.print(),60);
};
window.addEventListener('afterprint',exPrintCleanup);

</script>
<script>
/* Встроенный файл: assets/js/ai.js */
/* ==========================================================================
   ai.js — Alfa AI.
   Два режима, оба честные:
   1) «Локальная аналитика» (по умолчанию) — детерминированные расчёты по данным вашей CRM.
      Это НЕ языковая модель: она понимает ограниченный набор вопросов (по ключевым словам),
      показывает цифры, на которых основан вывод, и прямо говорит, если данных недостаточно.
   2) «Языковая модель» — вопрос и СВОДКА данных (агрегаты, без имён клиентов, телефонов и почты)
      отправляются в Supabase Edge Function `alfa-ai`, которая вызывает Claude. Ключ Anthropic хранится
      только в секретах функции и не попадает в браузер. По умолчанию выключено (ME.ai.remote=false).
   Архитектура: aiProviders[] — модули-обработчики; новый провайдер добавляется одним объектом.
   ========================================================================== */
const AI={log:[],busy:false};
const aiCfg=()=>{const c=ME.ai=ME.ai&&typeof ME.ai==='object'?ME.ai:{};if(c.remote==null)c.remote=false;return c};
const aiR=(a,b)=>({from:a,to:b});
const aiPct=(a,b)=>b>0?Math.round((a-b)/b*100):null;

const aiL=(l)=>`<ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul>`;

/* ---------- Сводка (агрегаты для анализа и для удалённой модели) ---------- */
function aiDigest(){
